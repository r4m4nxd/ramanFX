name: Publish backtest artifact

# Commit the results artifact of an earlier backtest run whose push failed.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Backtest run id
        required: true
      artifact:
        description: Artifact name (fx-backtest-<run id> or stock-backtest-<run id>)
        required: true

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact }}
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: .
      - name: Commit results
        run: |
          git config user.name "ramanfx-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public docs/research
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "backtest: publish ${{ inputs.artifact }}"
          ok=0; for i in 1 2 3; do git rebase --abort 2>/dev/null || true; git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && ok=1 && break; sleep 5; done
          [ "$ok" = 1 ] || { echo "::error::results not pushed"; exit 1; }
