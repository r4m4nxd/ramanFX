name: cTrader check

# Manual: logs in to the cTrader Open API with the CTRADER_* secrets and prints safe facts only (account ids masked,
# symbol count, a few D1 candles), then compares cTrader bars with OANDA's for a few symbols (tools/ctrader/parity.py).
on:
  workflow_dispatch:
    inputs:
      parity:
        description: 'Also compare bars with OANDA (2-3 min)'
        type: boolean
        default: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CTRADER_CLIENT_ID: ${{ secrets.CTRADER_CLIENT_ID }}
      CTRADER_CLIENT_SECRET: ${{ secrets.CTRADER_CLIENT_SECRET }}
      CTRADER_ACCESS_TOKEN: ${{ secrets.CTRADER_ACCESS_TOKEN }}
      CTRADER_REFRESH_TOKEN: ${{ secrets.CTRADER_REFRESH_TOKEN }}
      OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
      OANDA_ENV: ${{ vars.OANDA_ENV || 'practice' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      PYTHONTZPATH: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q websocket-client==1.8.0 tzdata
      - run: python tools/ctrader/ctrader.py check
      - name: Symbol inventory (every enabled symbol by asset class / category)
        run: python tools/ctrader/ctrader.py inventory
      - uses: actions/upload-artifact@v4
        with:
          name: ctrader-symbols
          path: ctrader_symbols.json
      - name: Parity vs OANDA (a few symbols)
        if: ${{ github.event.inputs.parity != 'false' }}
        run: python tools/ctrader/parity.py
