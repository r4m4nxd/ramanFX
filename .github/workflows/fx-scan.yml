name: FX scan

# Forex zone scan (Raja rules, top-down MN -> W1 -> D1 -> H4 -> H1, 3M context), Pepperstone symbols, OANDA data.
# Hourly: a full scan after every H1 close. GitHub drops or delays scheduled runs (worst near the top of the hour), so
# the scan is NOT tied to the close minute: it is polled every 10 minutes (off the :00 peak) Monday-Friday UTC, plus
# Saturday 00-05 UTC to catch the Friday close and Sunday 21-23 UTC for the first hours of the week (forex week:
# Sunday 17:00 New York -> Friday 17:00 New York). Each run first asks OANDA for the newest complete H1 candle
# (`fxscan.py --check`, seconds) and compares it with the last scanned one (public/fx/state.json, committed, + the
# actions cache): already scanned -> the run stops there; not yet -> full scan, so a dropped run is caught up by the
# next one. Telegram stays calm: an hourly scan sends only the instant alert when something is new; the H4 digest goes
# out once per new H4 candle; the daily summary with the first scan after the D1 close (17:00 New York), however late.
# Only the new candles are fetched (cache): an hourly run inside an H4 bar asks OANDA for one H1 request per
# instrument. Manual runs always scan (--force), except a dispatch with scheduled=true (the trader-coach edge function's
# reliable 10-minute scheduler, supabase/functions/trader-coach/scheduler.ts), which behaves exactly like a cron run.
# On-demand (the bot's /scan SYM and [🔄 Live scan]): only=SYM + ondemand=true scans that symbol with every rule and sends
# ONE result card; it writes nothing (no public files, no alert state, no cache save), skips the unit tests and runs
# beside a full scan (its own concurrency group), so the card comes in about a minute.
run-name: ${{ github.event.inputs.ondemand == 'true' && format('FX on-demand scan {0}', github.event.inputs.only) || 'FX scan' }}
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * 1-5'
    - cron: '7,17,27,37,47,57 0-5 * * 6'
    - cron: '7,17,27,37,47,57 21-23 * * 0'
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional comma-separated Pepperstone symbols (e.g. EURUSD,XAUAUD); default: all'
        required: false
      summary:
        description: 'Send the daily summary now'
        type: boolean
        default: false
      scheduled:
        description: 'Behave like a scheduled run (the trader-coach scheduler sets it): --check decides, no --force'
        type: boolean
        default: false
      ondemand:
        description: 'On-demand scan for the bot (with only=SYM): one result card, nothing written'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.event.inputs.ondemand == 'true' && 'fx-scan-ondemand' || 'fx-scan' }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OANDA_ENV: ${{ vars.OANDA_ENV || 'practice' }}
      FX_INCLUDE_CFD: ${{ vars.FX_INCLUDE_CFD || 'false' }}
      FX_MAX_SPREAD_FRAC: ${{ vars.FX_MAX_SPREAD_FRAC || '0.10' }}
      FX_SOFT_REACH_PCT: ${{ vars.FX_SOFT_REACH_PCT || '5' }}
      FX_BUDGET_MIN: '25'
      FX_H4_DIGEST: ${{ vars.FX_H4_DIGEST || 'true' }}
      PYTHONTZPATH: ''                 # zoneinfo: the pip tzdata (step 'Current time-zone data'), never a stale system copy
    steps:
      # the branch tip at run time (not the commit the schedule fired on): the latest committed public/fx/state.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Seconds: is there a complete H1 candle that was not scanned yet? Manual runs always scan.
      - name: New H1 candle?
        id: check
        run: |
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SCHEDULED" != "true" ]; then echo "scan=true" >> "$GITHUB_OUTPUT"; echo "manual run: scan"; exit 0; fi
          python tools/fx_scanner/fxscan.py --check
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULED: ${{ github.event.inputs.scheduled }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}

      # Candles + the Telegram dedupe state between runs (restore + explicit save with always(), like the stock scan).
      - name: Restore data cache
        if: ${{ steps.check.outputs.scan == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: tools/fx_scanner/.cache
          key: fx-data-${{ github.run_id }}
          restore-keys: |
            fx-data-

      # The PyPI tzdata (newest rules: Alberta's permanent UTC-6 from 2026-11-01, tzdata 2026c+) for the Calgary clock
      # in the messages and the bot's quiet hours; PYTHONTZPATH='' on the steps below makes zoneinfo use it.
      - name: Current time-zone data
        if: ${{ steps.check.outputs.scan == 'true' }}
        run: python -m pip install --quiet --upgrade tzdata

      - name: Unit tests
        id: tests
        if: ${{ steps.check.outputs.scan == 'true' && github.event.inputs.ondemand != 'true' }}
        run: python -m unittest discover -s tools/fx_scanner/tests

      # a failing unit test skips the scan: say so on Telegram (at most one failure message per day)
      - name: Notify unit test failure
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        run: >-
          python tools/fx_scanner/fxscan.py --notify-failure "unit tests failed - no scan this run, see the Actions log"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Scan + notify
        id: scan
        if: ${{ steps.check.outputs.scan == 'true' }}
        timeout-minutes: 30
        run: |
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$SCHEDULED" != "true" ]; then ARGS+=(--force); fi
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$SUMMARY" = "true" ]; then ARGS+=(--summary); fi
          if [ "$ONDEMAND" = "true" ] && [ -n "$ONLY" ]; then ARGS+=(--ondemand --no-write); fi
          python tools/fx_scanner/fxscan.py "${ARGS[@]}"
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULED: ${{ github.event.inputs.scheduled }}
          ONLY: ${{ github.event.inputs.only }}
          SUMMARY: ${{ github.event.inputs.summary }}
          ONDEMAND: ${{ github.event.inputs.ondemand }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FX_WATCHLIST: ${{ secrets.FX_WATCHLIST }}

      - name: Save data cache
        if: ${{ always() && steps.check.outputs.scan == 'true' && github.event.inputs.ondemand != 'true' && hashFiles('tools/fx_scanner/.cache/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: tools/fx_scanner/.cache
          key: fx-data-${{ github.run_id }}

      - name: Commit results
        if: ${{ !cancelled() && steps.check.outputs.scan == 'true' && github.event.inputs.ondemand != 'true' && hashFiles('public/fx/latest.json') != '' }}
        run: |
          git config user.name "ramanfx-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fx
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "fx: scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
