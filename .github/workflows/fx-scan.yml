name: FX scan

# Forex zone scan (Raja rules, top-down MN -> W1 -> D1 -> H4, 3M context), Pepperstone symbols, OANDA data.
# GitHub drops or delays scheduled runs (worst near the top of the hour), so the scan is NOT tied to the H4 close
# minute: it is polled every 10 minutes (off the :00 peak) Monday-Friday UTC, plus Saturday 00-05 UTC to
# catch the Friday close (forex week: Sunday 17:00 New York -> Friday 17:00 New York). Each run first asks OANDA for
# the newest complete H4 candle (`fxscan.py --check`, seconds) and compares it with the last scanned one
# (public/fx/state.json, committed, + the actions cache): already scanned -> the run stops there; not yet -> full scan,
# so a dropped run is caught up by the next one. The H4 digest goes out after every new H4 scan; the daily summary with
# the first scan after the D1 close (17:00 New York), however late. Manual runs always scan (--force).
on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * 1-5'
    - cron: '7,17,27,37,47,57 0-5 * * 6'
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional comma-separated Pepperstone symbols (e.g. EURUSD,XAUAUD); default: all'
        required: false
      summary:
        description: 'Send the daily summary now'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fx-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OANDA_ENV: ${{ vars.OANDA_ENV || 'practice' }}
      FX_INCLUDE_CFD: ${{ vars.FX_INCLUDE_CFD || 'false' }}
      FX_MAX_SPREAD_FRAC: ${{ vars.FX_MAX_SPREAD_FRAC || '0.10' }}
      FX_SOFT_REACH_PCT: ${{ vars.FX_SOFT_REACH_PCT || '5' }}
      FX_BUDGET_MIN: '25'
      FX_H4_DIGEST: ${{ vars.FX_H4_DIGEST || 'true' }}
    steps:
      # the branch tip at run time (not the commit the schedule fired on): the latest committed public/fx/state.json
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Seconds: is there a complete H4 candle that was not scanned yet? Manual runs always scan.
      - name: New H4 candle?
        id: check
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then echo "scan=true" >> "$GITHUB_OUTPUT"; echo "manual run: scan"; exit 0; fi
          python tools/fx_scanner/fxscan.py --check
        env:
          EVENT: ${{ github.event_name }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}

      # Candles + the Telegram dedupe state between runs (restore + explicit save with always(), like the stock scan).
      - name: Restore data cache
        if: ${{ steps.check.outputs.scan == 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: tools/fx_scanner/.cache
          key: fx-data-${{ github.run_id }}
          restore-keys: |
            fx-data-

      - name: Unit tests
        id: tests
        if: ${{ steps.check.outputs.scan == 'true' }}
        run: python -m unittest discover -s tools/fx_scanner/tests

      # a failing unit test skips the scan: say so on Telegram (at most one failure message per day)
      - name: Notify unit test failure
        if: ${{ failure() && steps.tests.outcome == 'failure' }}
        run: >-
          python tools/fx_scanner/fxscan.py --notify-failure "unit tests failed - no scan this run, see the Actions log"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Scan + notify
        id: scan
        if: ${{ steps.check.outputs.scan == 'true' }}
        timeout-minutes: 30
        run: |
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ]; then ARGS+=(--force); fi
          if [ -n "$ONLY" ]; then ARGS+=(--only "$ONLY"); fi
          if [ "$SUMMARY" = "true" ]; then ARGS+=(--summary); fi
          python tools/fx_scanner/fxscan.py "${ARGS[@]}"
        env:
          EVENT: ${{ github.event_name }}
          ONLY: ${{ github.event.inputs.only }}
          SUMMARY: ${{ github.event.inputs.summary }}
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FX_WATCHLIST: ${{ secrets.FX_WATCHLIST }}

      - name: Save data cache
        if: ${{ always() && steps.check.outputs.scan == 'true' && hashFiles('tools/fx_scanner/.cache/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: tools/fx_scanner/.cache
          key: fx-data-${{ github.run_id }}

      - name: Commit results
        if: ${{ !cancelled() && steps.check.outputs.scan == 'true' && hashFiles('public/fx/latest.json') != '' }}
        run: |
          git config user.name "ramanfx-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fx
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "fx: scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
