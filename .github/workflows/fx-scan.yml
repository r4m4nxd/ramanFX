name: FX scan

# Forex zone scan (Raja rules, top-down MN -> W1 -> D1 -> H4, 3M context), Pepperstone symbols, OANDA data.
# Runs 5 minutes after every H4 close (Pepperstone server time 00/04/08/12/16/20 = New York 17/21/01/05/09/13):
# 21/01/05/09/13/17 UTC in US summer time, 22/02/06/10/14/18 UTC in winter. Both sets are scheduled; a run without
# a new complete H4 candle exits in seconds ("nothing to do"). Sunday 22:00 UTC -> Friday 22:00 UTC.
# The daily summary goes out with the first run after the D1 close (21:05 UTC summer / 22:05 UTC winter).
on:
  schedule:
    - cron: '5 1,2,5,6,9,10,13,14,17,18,21,22 * * 0-5'
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional comma-separated Pepperstone symbols (e.g. EURUSD,XAUAUD); default: all'
        required: false
      summary:
        description: 'Send the daily summary now'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fx-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OANDA_ENV: ${{ vars.OANDA_ENV || 'practice' }}
      FX_INCLUDE_CFD: ${{ vars.FX_INCLUDE_CFD || 'false' }}
      FX_MAX_SPREAD_FRAC: ${{ vars.FX_MAX_SPREAD_FRAC || '0.10' }}
      FX_SOFT_REACH_PCT: ${{ vars.FX_SOFT_REACH_PCT || '5' }}
      FX_BUDGET_MIN: '25'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Candles + the Telegram dedupe state between runs (restore + explicit save with always(), like the stock scan).
      - name: Restore data cache
        uses: actions/cache/restore@v4
        with:
          path: tools/fx_scanner/.cache
          key: fx-data-${{ github.run_id }}
          restore-keys: |
            fx-data-

      - name: Unit tests
        run: python -m unittest discover -s tools/fx_scanner/tests

      - name: Scan + notify
        id: scan
        timeout-minutes: 30
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="--force"; fi
          if [ -n "${{ github.event.inputs.only }}" ]; then ARGS="$ARGS --only ${{ github.event.inputs.only }}"; fi
          if [ "${{ github.event.inputs.summary }}" = "true" ]; then ARGS="$ARGS --summary"; fi
          python tools/fx_scanner/fxscan.py $ARGS
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FX_WATCHLIST: ${{ secrets.FX_WATCHLIST }}

      - name: Save data cache
        if: ${{ always() && hashFiles('tools/fx_scanner/.cache/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: tools/fx_scanner/.cache
          key: fx-data-${{ github.run_id }}

      - name: Commit results
        if: ${{ !cancelled() && hashFiles('public/fx/latest.json') != '' }}
        run: |
          git config user.name "ramanfx-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fx
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "fx: scan $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && break; sleep 5; done
