name: Load test

# Manual k6 load test of the live site: VUS simulated visitors open the app, the stock scanner and the forex scanner
# (public, read-only files; no sign-in, no Supabase writes). Summary in the job summary and the uploaded artifact.
on:
  workflow_dispatch:
    inputs:
      vus:
        description: 'Peak simultaneous visitors'
        default: '1000'
      hold:
        description: 'Time at peak (k6 duration, e.g. 3m)'
        default: '3m'
      base_url:
        description: 'Site to test'
        default: 'https://raman-fx.vercel.app'

permissions:
  contents: read

jobs:
  k6:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Run k6
        env:
          VUS: ${{ inputs.vus }}
          HOLD: ${{ inputs.hold }}
          BASE_URL: ${{ inputs.base_url }}
        run: |
          set +e
          k6 run --summary-export summary.json tools/loadtest/flow.js 2>&1 | tee k6.txt
          code=${PIPESTATUS[0]}
          { echo '```'; sed -n '/checks\.\.\./,$p' k6.txt | head -60; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-test-${{ github.run_id }}
          path: |
            summary.json
            k6.txt
