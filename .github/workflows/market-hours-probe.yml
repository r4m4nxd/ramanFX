name: Market hours probe

# Diagnostic for the market-hours study: do Alpaca's extended-hours bars carry a high-low range?
# Runs on a push that changes the probe; commits docs/research/market_hours_probe.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/research/market_hours_probe/**'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/research/market_hours_probe/probe.py
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Commit
        run: |
          git config user.name "ramanfx-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/market_hours_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: market-hours Alpaca probe"
          ok=0; for i in 1 2 3; do git rebase --abort 2>/dev/null || true; git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && ok=1 && break; sleep 5; done
          [ "$ok" = 1 ] || exit 1
