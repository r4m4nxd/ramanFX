# Publishes the per-weekday forex profiles (the trading clock's weekday view) from a Market hours study run WITHOUT
# waiting for its stock shards: takes that run's finished forex shard files and adds 'pw' to the app's by-symbol file.
# The full study writes the same data when it finishes, so this is only a shortcut for a slow run.
name: Market hours weekdays (forex only)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The Market hours study run whose forex shards to use'
        required: true

permissions:
  contents: write
  actions: read

jobs:
  week:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet numpy tzdata
      - uses: actions/download-artifact@v4
        with:
          pattern: mh-*
          path: shards
          run-id: ${{ github.event.inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Add the weekday profiles
        run: python tools/research/market_hours/report.py --in shards --cal shards/mh-cal/cal.json --week-only
      - name: Commit
        run: |
          git config user.name "ramanfx-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/research/market_hours_by_symbol.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "research: market hours weekday profiles (forex) $(date -u +%Y-%m-%dT%H:%MZ)"
          ok=0; for i in 1 2 3; do git rebase --abort 2>/dev/null || true; git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && ok=1 && break; sleep 5; done
          [ "$ok" = 1 ] || { echo "::error::weekday profiles not pushed"; exit 1; }
