name: Market hours study

# When do volume and price range spike, by weekday and Calgary clock time? (tools/research/market_hours/market_hours.py)
# OANDA M15 (forex, gold, index / oil CFDs) + Alpaca 15Min (SPY / QQQ / IWM + 25 large caps), ~2 years.
# Runs by hand, or on a push to main that changes the study script. Writes docs/research/Market_Hours.md,
# docs/research/market_hours_{fx,stocks}.png and public/research/market_hours.json, and commits them.
on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Sample length in years back from today'
        required: false
        default: '2'
  push:
    branches: [main]
    paths:
      - 'tools/research/market_hours/**'
      - '.github/workflows/market-hours.yml'

permissions:
  contents: write

concurrency:
  group: market-hours
  cancel-in-progress: false

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OANDA_ENV: ${{ vars.OANDA_ENV || 'practice' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install plotting
        run: python -m pip install --quiet matplotlib tzdata

      - name: Self-test (synthetic data, no network)
        run: |
          mkdir -p /tmp/mh
          python tools/research/market_hours/market_hours.py --synthetic --years 0.5 \
            --out-md /tmp/mh/m.md --out-json /tmp/mh/m.json --out-dir /tmp/mh

      - name: Study
        timeout-minutes: 60
        run: python tools/research/market_hours/market_hours.py --years "${IN_YEARS:-2}" --budget-min 45
        env:
          OANDA_API_TOKEN: ${{ secrets.OANDA_API_TOKEN }}
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          IN_YEARS: ${{ github.event.inputs.years }}

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: market-hours-${{ github.run_id }}
          path: |
            docs/research/Market_Hours.md
            docs/research/market_hours_fx.png
            docs/research/market_hours_stocks.png
            public/research/market_hours.json
          if-no-files-found: ignore

      - name: Commit results
        if: ${{ !cancelled() && hashFiles('public/research/market_hours.json') != '' }}
        run: |
          git config user.name "ramanfx-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/research/Market_Hours.md public/research/market_hours.json
          git add docs/research/market_hours_fx.png docs/research/market_hours_stocks.png 2>/dev/null || true
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "research: market hours study $(date -u +%Y-%m-%dT%H:%MZ)"
          ok=0; for i in 1 2 3; do git rebase --abort 2>/dev/null || true; git pull --rebase -X theirs --autostash origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && ok=1 && break; sleep 5; done
          [ "$ok" = 1 ] || { echo "::error::results not pushed (see the uploaded artifact)"; exit 1; }
