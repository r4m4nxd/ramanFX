name: Net probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe data hosts
        run: |
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36'
          for u in \
            "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=1mo&interval=1d" \
            "https://query2.finance.yahoo.com/v8/finance/chart/AAPL?range=1mo&interval=1d" \
            "https://query1.finance.yahoo.com/v8/finance/chart/RY.TO?range=1mo&interval=1d" \
            "https://query1.finance.yahoo.com/v8/finance/chart/BBD-B.TO?range=1mo&interval=1d" \
            "https://stooq.com/q/d/l/?s=aapl.us&i=d" \
            "https://www.sec.gov/files/company_tickers.json" \
            "https://data.sec.gov/api/xbrl/companyfacts/CIK0000320193.json" \
            "https://data.nasdaq.com/" ; do
            echo "== $u"
            curl -sS -m 20 -A "$UA" -o body -w "HTTP %{http_code} %{size_download}B %{content_type}\n" "$u" || true
            head -c 200 body | tr -d '\0' ; echo
          done
      - name: Probe the FCA National Storage Mechanism (UK regulatory filings, official public search API)
        run: |
          curl -sS -m 25 -A 'RamanFX research bot (github.com/r4m4nxd/ramanFX)' -H 'Content-Type: application/json' -o body \
            -w "HTTP %{http_code} %{size_download}B %{content_type}\n" \
            -d '{"from":0,"size":3,"sort":"submitted_date","sortorder":"desc","keyword":"PDMR","criteriaObj":{"criteria":[{"name":"latest_flag","value":"Y"}],"dateCriteria":[]}}' \
            "https://api.data.fca.org.uk/search?index=fca-nsm-searchdata" || true
          head -c 1500 body; echo
