name: Questrade check

# Manual: exchanges the Questrade refresh token (the new one is stored in Supabase rfx_questrade_token first) and prints
# the number of daily bars of a few TSX names. tools/stock_scanner/questrade.py. No token is printed.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: TSX daily bars from Questrade
        env:
          QUESTRADE_REFRESH_TOKEN: ${{ secrets.QUESTRADE_REFRESH_TOKEN }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd tools/stock_scanner
          python - <<'PY'
          import questrade as Q
          print('enabled:', Q.enabled())
          import data as D
          print('tsx feed:', D.tsx_feed())
          for s in ('RY.TO', 'BBD-B.TO', 'AP-UN.TO', 'ATD.TO', 'WCN.TO', 'GIB-A.TO'):
              try:
                  b, m = D.fetch_tsx(s, 0.0)                       # the scan's own path (cache bypassed)
                  print(s, len(b), 'bars', b[0].d, '->', b[-1].d, 'last close', b[-1].c, m.get('source'))
              except Exception as e:
                  print(s, 'ERROR', type(e).__name__, str(e)[:160])
          PY
