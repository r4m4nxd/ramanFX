// Tooltip wrapper that works on both desktop hover and mobile tap.
// On hover: tooltip tracks the cursor as it moves. On tap (mobile): tooltip shows on touch and stays
// briefly. We use a global "active hint" so only one shows at a time.
const Hint = ({ text, children }) => {
  const [show, setShow] = useState(false);
  const [pos, setPos] = useState({ top: 0, left: 0, transform: 'translate(-50%, -100%)' });
  const hideTimer = useRef(null);
  const wrapRef = useRef(null);
  // Position the tooltip directly above the hovered element using its bounding rect, NOT raw
  // cursor coords. Using cursor coords with position:fixed was unreliable inside scrollable
  // containers and produced a large visual gap on the progress heatmap (small cells where the
  // cursor coords + viewport scroll didn't reconcile). Anchoring to the element's rect makes
  // the tooltip pop up consistently right above whatever you're hovering, regardless of layout.
  const computePos = () => {
    const el = wrapRef.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const TIP_W = 240, TIP_H = 44;
    let top = r.top - 6;                  // small gap above the element
    let left = r.left + r.width / 2;      // horizontally centered on the element
    let transform = 'translate(-50%, -100%)';
    // Edge handling: if too close to left/right viewport edges, clamp
    if (left - TIP_W / 2 < 8) { left = 8; transform = 'translate(0%, -100%)'; }
    else if (left + TIP_W / 2 > window.innerWidth - 8) { left = window.innerWidth - 8; transform = 'translate(-100%, -100%)'; }
    // If too close to the top edge, flip the tooltip below the element
    if (top - TIP_H < 8) { top = r.bottom + 6; transform = transform.replace('-100%', '0%'); }
    setPos({ top, left, transform });
  };
  const onEnter = () => { computePos(); setShow(true); };
  const onLeave = () => { setShow(false); };
  const onTouch = (e) => {
    if (!text) return;
    computePos();
    setShow(true);
    if (hideTimer.current) clearTimeout(hideTimer.current);
    hideTimer.current = setTimeout(() => setShow(false), 2200);
  };
  useEffect(() => () => { if (hideTimer.current) clearTimeout(hideTimer.current); }, []);
  // Portal the tooltip into document.body so it escapes any backdrop-filter / transform
  // ancestor that would otherwise reparent its position:fixed coordinate system.
  const tooltip = show && text ? ReactDOM.createPortal(
    <div style={{ position: 'fixed', top: pos.top, left: pos.left, transform: pos.transform, background: 'var(--chart-tooltip-bg)', border: '1px solid var(--border2)', borderRadius: 'var(--r-sm)', padding: '7px 10px', fontSize: 11.5, lineHeight: 1.45, color: 'var(--chart-tooltip-text)', whiteSpace: 'normal', width: 'max-content', maxWidth: 240, zIndex: 9999, pointerEvents: 'none', boxShadow: '0 8px 24px rgba(0,0,0,0.25)' }}>{text}</div>,
    document.body
  ) : null;
  return (
    <Fragment>
      <span ref={wrapRef} onMouseEnter={onEnter} onMouseLeave={onLeave} onTouchStart={onTouch} style={{ display: 'inline-flex' }}>{children}</span>
      {tooltip}
    </Fragment>
  );
};

// Animated count-up number
function useCountUp(target, dur = 600) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    let raf, start;
    const from = 0;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min(1, (ts - start) / dur);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(from + (target - from) * eased);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return val;
}

// Gauge donut (RamanFX-style)
function Gauge({ value, color = '#4ade80', size = 88 }) {
  const radius = 38, stroke = 9, c = 2 * Math.PI * radius, arc = 0.75;
  const v = Math.max(0, Math.min(100, value));
  const animV = useCountUp(v, 700);
  return (
    <svg viewBox="0 0 100 100" style={{ width: size, height: size, transform: 'rotate(135deg)' }}>
      <circle cx="50" cy="50" r={radius} stroke="var(--chart-grid)" strokeWidth={stroke} fill="none" strokeDasharray={`${c * arc} ${c}`} strokeLinecap="round" />
      <circle cx="50" cy="50" r={radius} stroke={color} strokeWidth={stroke} fill="none" strokeDasharray={`${c * (animV / 100) * arc} ${c}`} strokeLinecap="round" style={{ transition: 'stroke 0.3s' }} />
    </svg>
  );
}

// ═══════════════ CALENDAR ═══════════════
function CalendarView({ stats, onDayClick }) {
  const isMobile = useMobile();
  // Use compact layout (no weekly column, tighter cells) below 960px so iPad landscape and
  // narrow PC windows don't squeeze the day cells until content overflows.
  const [windowW, setWindowW] = useState(typeof window !== 'undefined' ? window.innerWidth : 1200);
  useEffect(() => {
    const onResize = () => setWindowW(window.innerWidth);
    window.addEventListener('resize', onResize);
    return () => window.removeEventListener('resize', onResize);
  }, []);
  const compact = isMobile || windowW < 960;
  // Always default to the current calendar month so opening the app on June 1 shows June,
  // not the month of the last imported trade (which might be weeks behind).
  const [monthDate, setMonthDate] = useState(() => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), 1); });
  const { year, month, monthName, weeks, monthStats } = useMemo(() => {
    const year = monthDate.getFullYear(), month = monthDate.getMonth();
    const monthName = monthDate.toLocaleString('default', { month: 'long' });
    const firstDay = new Date(year, month, 1), lastDay = new Date(year, month + 1, 0);
    const days = [];
    for (let i = 0; i < firstDay.getDay(); i++) days.push(null);
    for (let d = 1; d <= lastDay.getDate(); d++) { const date = new Date(year, month, d); const key = dayKey(date); days.push({ day: d, key, data: stats?.byDay?.[key] }); }
    while (days.length % 7 !== 0) days.push(null);
    const weeks = []; for (let i = 0; i < days.length; i += 7) weeks.push(days.slice(i, i + 7));
    const weeklyAgg = weeks.map((week, wi) => { let pnl = 0, trades = 0, days = 0; for (const d of week) if (d?.data) { pnl += d.data.pnl; trades += d.data.trades; days++; } return { week: wi + 1, pnl, trades, days }; });
    let monthPnL = 0, monthTrades = 0, monthDays = 0;
    for (const w of weeklyAgg) { monthPnL += w.pnl; monthTrades += w.trades; monthDays += w.days; }
    return { year, month, monthName, weeks, monthStats: { pnl: monthPnL, trades: monthTrades, days: monthDays, weeklyAgg } };
  }, [monthDate, stats]);
  const maxAbs = useMemo(() => Math.max(...(stats?.daily || []).map(d => Math.abs(d.pnl)), 100), [stats]);
  // colorFor: produces background tint based on pnl magnitude. Range deliberately constrained
  // so that the saturated end (worst day) is still light enough for deep red/green text to be
  // readable. Going above ~0.65 makes red days unreadable in light mode (text vanishes into bg).
  // - alpha 0.22 = small wins/losses, clearly visible
  // - alpha 0.65 = biggest day, still readable
  const colorFor = (pnl) => {
    if (pnl == null) return null;
    const a = 0.22 + Math.min(1, Math.abs(pnl) / maxAbs) * 0.43;
    return pnl >= 0 ? `rgba(38,166,154,${a})` : `rgba(248,113,113,${a})`;
  };
  const navBtn = { padding: 6, borderRadius: 'var(--r-sm)', background: 'transparent', border: 'none', color: 'var(--text2)', cursor: 'pointer', fontSize: 16, lineHeight: 1 };
  // Highlight today's cell so it's easy to spot
  const todayKey = dayKey(new Date());

  return (
    <Card style={{ padding: compact ? 12 : 18 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 14, flexWrap: 'wrap', gap: 8 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
          <button style={navBtn} onClick={() => setMonthDate(new Date(year, month - 1, 1))} onMouseEnter={e => e.currentTarget.style.background = 'var(--panel2)'} onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>‹</button>
          <div style={{ fontWeight: 600, fontSize: 15, minWidth: 130, textAlign: 'center' }}>{monthName} {year}</div>
          <button style={navBtn} onClick={() => setMonthDate(new Date(year, month + 1, 1))} onMouseEnter={e => e.currentTarget.style.background = 'var(--panel2)'} onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>›</button>
          <button style={{ ...btnStyle('secondary'), padding: '4px 10px', fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.05em' }} onClick={() => setMonthDate(new Date())}>This month</button>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, fontSize: 12, flexWrap: 'wrap' }}>
          <span style={{ color: 'var(--text3)' }}>Monthly:</span>
          <span className="tabnum" style={{ fontWeight: 600, padding: '3px 9px', borderRadius: 'var(--r-sm)', background: monthStats.pnl >= 0 ? 'rgba(38,166,154,0.12)' : 'rgba(248,113,113,0.12)', color: monthStats.pnl >= 0 ? 'var(--green-bright)' : 'var(--red)' }}>{fmtMoney(monthStats.pnl, true)}</span>
          <span style={{ color: 'var(--text2)', padding: '3px 9px', borderRadius: 'var(--r-sm)', background: 'var(--panel2)' }}>{monthStats.days} days</span>
        </div>
      </div>
      {/* Compact layout (mobile / narrow window): 7 equal columns, no weekly sidebar.
          Wide layout (≥960px): 7 day columns + 96px weekly summary column. */}
      <div style={{ display: 'grid', gridTemplateColumns: compact ? 'repeat(7, minmax(0, 1fr))' : 'repeat(7, minmax(0, 1fr)) 96px', gap: compact ? 2 : 5, gridAutoRows: compact ? 'minmax(64px, auto)' : 'minmax(74px, auto)' }}>
        {/* Header row: 7 weekday labels (+ Weekly label on wide) */}
        {['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].map(d => (
          <div key={d} style={{ fontSize: 10, color: 'var(--text3)', textAlign: 'center', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 600, height: 16, lineHeight: '16px' }}>{d}</div>
        ))}
        {!compact && <div style={{ fontSize: 10, color: 'var(--text3)', textAlign: 'center', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 600, height: 16, lineHeight: '16px' }}>Weekly</div>}

        {/* Each calendar row = 7 day cells (+ weekly cell on wide) */}
        {weeks.map((week, wi) => (
          <Fragment key={wi}>
            {week.map((cell, i) => {
              if (!cell) return <div key={i} style={{ borderRadius: 'var(--r-md)', background: 'var(--calendar-empty-bg)', border: '1px solid var(--calendar-empty-border)', minWidth: 0 }} />;
              const c = cell.data ? colorFor(cell.data.pnl) : null;
              const isToday = cell.key === todayKey;
              return (
                <button key={i} onClick={() => cell.data && onDayClick?.(cell.key)} disabled={!cell.data}
                  style={{ borderRadius: 'var(--r-md)', border: isToday ? '1.5px solid var(--violet-light)' : (cell.data ? '1px solid var(--border2)' : '1px solid var(--calendar-empty-border)'), background: c || 'var(--calendar-cell-bg)', textAlign: 'center', padding: compact ? '5px 2px' : '6px 3px', cursor: cell.data ? 'pointer' : 'default', display: 'flex', flexDirection: 'column', alignItems: 'center', transition: 'background 0.12s var(--ease-out), color 0.12s var(--ease-out), border-color 0.12s var(--ease-out), opacity 0.12s var(--ease-out)', position: 'relative', minHeight: compact ? 64 : 74, minWidth: 0 }}
                  onMouseEnter={e => { if (cell.data) { e.currentTarget.style.transform = 'scale(1.04)'; e.currentTarget.style.borderColor = 'var(--violet)'; e.currentTarget.style.zIndex = '5'; } }}
                  onMouseLeave={e => { e.currentTarget.style.transform = 'none'; e.currentTarget.style.borderColor = isToday ? 'var(--violet-light)' : (cell.data ? 'var(--border2)' : 'var(--calendar-empty-border)'); e.currentTarget.style.zIndex = 'auto'; }}>
                  {/* Day number — top center, small */}
                  <div style={{ fontSize: compact ? 9 : 10, color: cell.data ? 'var(--text2)' : 'var(--text3)', fontWeight: 500, lineHeight: 1, alignSelf: 'flex-start', paddingLeft: 3 }}>{cell.day}</div>
                  {cell.data && (() => {
                    const txt = fmtCompact(cell.data.pnl);
                    // Scale font down for longer numbers so they always fit on one line
                    const fs = txt.length <= 5 ? (compact ? 12 : 14) : txt.length <= 7 ? (compact ? 10 : 12) : (compact ? 9 : 10);
                    return (
                      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 1, width: '100%' }}>
                        <div className="tabnum" style={{ fontSize: fs, fontWeight: 700, lineHeight: 1.15, color: cell.data.pnl >= 0 ? 'var(--cell-text-green)' : 'var(--cell-text-red)', whiteSpace: 'nowrap', maxWidth: '100%' }}>{txt}</div>
                        <div style={{ fontSize: compact ? 8 : 9, color: cell.data.pnl >= 0 ? 'var(--cell-text-green)' : 'var(--cell-text-red)', opacity: 0.6, lineHeight: 1 }}>{cell.data.trades}t</div>
                      </div>
                    );
                  })()}
                </button>
              );
            })}
            {/* Weekly summary box for this row — only on wide layouts */}
            {!compact && (() => { const w = monthStats.weeklyAgg[wi]; return (
              <div style={{ borderRadius: 'var(--r-md)', border: '1px solid var(--border)', background: 'var(--panel2)', padding: '6px 8px', display: 'flex', flexDirection: 'column', justifyContent: 'center', minHeight: 62, minWidth: 0, overflow: 'hidden' }}>
                <div style={{ fontSize: 10, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>Wk {w.week}</div>
                {w.trades > 0 ? (
                  <Fragment>
                    {/* Use full money format (e.g. -$467.81) instead of compact (-$467) so users see exact week totals */}
                    <div className="tabnum" style={{ fontSize: 11, fontWeight: 700, color: w.pnl >= 0 ? 'var(--green-bright)' : 'var(--red)', whiteSpace: 'nowrap', textAlign: 'center', lineHeight: 1.2 }}>{fmtCompact(w.pnl)}</div>
                    <div style={{ fontSize: 10, color: 'var(--text3)' }}>{w.days}d · {w.trades}t</div>
                  </Fragment>
                ) : <div style={{ fontSize: 11, color: 'var(--border2)' }}>—</div>}
              </div>
            ); })()}
          </Fragment>
        ))}
      </div>
    </Card>
  );
}

// ═══════════════ PROGRESS HEATMAP ═══════════════
function ProgressHeatmap({ stats, months = 6, cell = 12 }) {
  const scrollRef = useRef(null);
  const weeks = useMemo(() => {
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const start = new Date(today); start.setMonth(start.getMonth() - months);
    while (start.getDay() !== 0) start.setDate(start.getDate() - 1);
    const cols = []; const cursor = new Date(start);
    while (cursor <= today) { const week = []; for (let d = 0; d < 7; d++) { const k = dayKey(cursor); week.push({ date: new Date(cursor), key: k, day: stats?.byDay?.[k] }); cursor.setDate(cursor.getDate() + 1); } cols.push(week); }
    // Chronological order: oldest column on the LEFT, most recent on the RIGHT.
    return cols;
  }, [stats, months]);
  // After mount, scroll the container all the way right so the latest weeks are visible without manual scrolling.
  useEffect(() => {
    const el = scrollRef.current; if (!el) return;
    // Use requestAnimationFrame to ensure layout has settled before scrolling
    requestAnimationFrame(() => { el.scrollLeft = el.scrollWidth; });
  }, [weeks]);
  const maxAbs = useMemo(() => Math.max(...(stats?.daily || []).map(d => Math.abs(d.pnl)), 100), [stats]);
  const colorFor = (pnl) => { if (pnl == null || pnl === 0) return 'var(--panel2)'; const a = 0.3 + Math.min(1, Math.abs(pnl) / maxAbs) * 0.7; return pnl > 0 ? `rgba(38,166,154,${a})` : `rgba(248,113,113,${a})`; };
  const monthLabels = useMemo(() => { const labels = []; let lm = -1; weeks.forEach((w, i) => { const m = w[0].date.getMonth(); if (m !== lm) { labels.push({ index: i, label: w[0].date.toLocaleString('default', { month: 'short' }) }); lm = m; } }); return labels; }, [weeks]);
  const gap = 3;
  return (
    <div ref={scrollRef} style={{ overflowX: 'auto', WebkitOverflowScrolling: 'touch' }}>
      <div style={{ display: 'inline-block' }}>
        <div style={{ display: 'flex', gap, marginBottom: 4, paddingLeft: 26 }}>
          {weeks.map((_, i) => { const l = monthLabels.find(x => x.index === i); return <div key={i} style={{ width: cell, fontSize: 10, color: 'var(--text3)' }}>{l?.label || ''}</div>; })}
        </div>
        <div style={{ display: 'flex', gap }}>
          <div style={{ display: 'flex', flexDirection: 'column', gap, paddingRight: 4, fontSize: 10, color: 'var(--text3)', justifyContent: 'space-around' }}>
            {['Sun', '', 'Tue', '', 'Thu', '', 'Sat'].map((d, i) => <div key={i} style={{ height: cell, lineHeight: `${cell}px` }}>{d}</div>)}
          </div>
          {weeks.map((week, wi) => (
            <div key={wi} style={{ display: 'flex', flexDirection: 'column', gap }}>
              {week.map((d, di) => (
                <Hint key={di} text={d.day ? `${d.key}: ${fmtMoney(d.day.pnl, true)} · ${d.day.trades} trade${d.day.trades !== 1 ? 's' : ''}` : d.key}>
                  <div style={{ width: cell, height: cell, borderRadius: 3, background: d.day ? colorFor(d.day.pnl) : 'var(--calendar-empty-bg)', border: '1px solid var(--calendar-empty-border)', cursor: d.day ? 'pointer' : 'default' }} />
                </Hint>
              ))}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

// ═══════════════ HERO SCORE CARD ═══════════════
// Big composite score + current streak + 4 headline KPIs. Sits at the top of the Dashboard
// as the visual anchor. Inspired by PNLog and Tradinjournal — but uses your own data and
// the same composite computation as the existing radar ScoreCard (so the numbers tie out).
function HeroScoreCard({ stats }) {
  const isMobile = useMobile();
  const { score } = useMemo(() => computeScore(stats), [stats]);
  const animScore = useCountUp(score, 900);
  const scoreColor = score >= 70 ? 'var(--green-bright)' : score >= 40 ? '#fbbf24' : 'var(--red)';
  const scoreLabel = score >= 80 ? 'Excellent' : score >= 65 ? 'Strong' : score >= 50 ? 'Developing' : score >= 35 ? 'Needs work' : 'Critical';
  // Current streak — fed directly from computeStats (curStreak count + curStreakSign 1/-1/0)
  const streakCount = stats?.curStreak || 0;
  const streakSign = stats?.curStreakSign || 0; // 1 = winning, -1 = losing, 0 = none
  const streakLabel = streakSign === 0 ? null : `${streakSign > 0 ? 'W' : 'L'}${streakCount}`;
  const streakColor = streakSign > 0 ? 'var(--green-bright)' : 'var(--red)';

    <div className="rfx-kpi" style={{ padding: '12px 14px', background: 'var(--panel)', border: '1px solid var(--border)', color: 'var(--text)', borderRadius: 'var(--r-md)', minWidth: 0, position: 'relative', overflow: 'hidden' }}>

      {sub && <div style={{ fontSize: 10.5, color: 'var(--text3)' }}>{sub}</div>}
    </div>

  // Format helpers
  const fmtRR = (rr) => rr > 0 ? `1 : ${rr.toFixed(2)}` : '—';

  const rrColor = stats?.avgRR >= 2 ? 'var(--green-bright)' : stats?.avgRR >= 1 ? 'var(--text)' : 'var(--red)';
  const pfColor = stats?.profitFactor >= 1.5 ? 'var(--green-bright)' : stats?.profitFactor >= 1 ? 'var(--text)' : 'var(--red)';
  const wrColor = stats?.winRate >= 50 ? 'var(--green-bright)' : stats?.winRate >= 40 ? 'var(--text)' : 'var(--red)';
  return (
    <Card style={{ padding: 0, overflow: 'hidden', background: `linear-gradient(135deg, rgba(16,185,129,0.08) 0%, rgba(45,212,191,0.03) 100%), var(--panel)`, borderColor: 'rgba(16,185,129,0.2)' }}>

        {/* Big score */}
        <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, flex: '0 0 auto' }}>
          <div>
            <div style={{ fontSize: 9.5, textTransform: 'uppercase', letterSpacing: '0.16em', color: 'var(--violet-light)', fontWeight: 700, marginBottom: 8, opacity: 0.7, fontFamily: "'Geist', sans-serif" }}>Performance Score</div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 6 }}>
              <span className="tabnum" style={{ fontSize: isMobile ? 56 : 68, fontWeight: 800, color: scoreColor, lineHeight: 1, letterSpacing: '-0.04em', textShadow: `0 0 24px ${scoreColor}25`, fontFamily: "'Geist', system-ui, sans-serif" }}>{Math.round(animScore)}</span>
              <span style={{ fontSize: 20, color: 'var(--text2)', fontWeight: 500 }}>/ 100</span>
            </div>
            <div style={{ fontSize: 10, color: scoreColor, fontWeight: 700, marginTop: 8, textTransform: 'uppercase', letterSpacing: '0.14em', fontFamily: "'Geist', sans-serif", display: 'inline-block', padding: '2px 8px', borderRadius: 'var(--r-full)', background: `${scoreColor}18`, border: `1px solid ${scoreColor}30` }}>{scoreLabel}</div>
          </div>
        </div>
        {/* Vertical divider on desktop */}
        {!isMobile && <div style={{ width: 1, alignSelf: 'stretch', background: 'var(--border)' }} />}
        {/* Right side: streak + context line */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 10, justifyContent: 'center' }}>
          {streakLabel && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
              <span style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.07em', color: 'var(--text3)', fontWeight: 600 }}>Current streak</span>
              <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 13, fontWeight: 700, padding: '3px 10px', borderRadius: 'var(--r-sm)', background: streakBg, border: `1px solid ${streakBorder}`, color: streakColor }}>
                <span style={{ fontSize: 11 }}>{streakSign > 0 ? '↑' : '↓'}</span>
                {streakLabel}
              </span>
              <span style={{ fontSize: 11, color: 'var(--text3)' }}>{streakSign > 0 ? `${streakCount} win${streakCount !== 1 ? 's' : ''} in a row` : `${streakCount} loss${streakCount !== 1 ? 'es' : ''} in a row`}</span>
            </div>
          )}
          <div style={{ fontSize: 12, color: 'var(--text2)', lineHeight: 1.5 }}>
            {stats?.total > 0 ? <Fragment>Across <strong style={{ color: 'var(--text)' }}>{stats.total} trades</strong> · {stats.profDays} profitable {stats.profDays === 1 ? 'day' : 'days'}, {stats.losingDays} losing {stats.losingDays === 1 ? 'day' : 'days'} ({stats.dayWinRate.toFixed(0)}% day win rate)</Fragment> : 'Import trades to see your score.'}
          </div>
        </div>
      </div>
      {/* Bottom KPIs */}
      <div style={{ display: 'grid', gridTemplateColumns: `repeat(${isMobile ? 2 : 4}, 1fr)`, gap: 10, padding: isMobile ? 14 : 18 }}>
        {kpi('Win rate', `${stats?.winRate?.toFixed(0) || 0}%`, `${stats?.wins || 0}W · ${stats?.losses || 0}L`, wrColor)}
        {kpi('Profit factor', stats?.profitFactor === Infinity ? '∞' : (stats?.profitFactor?.toFixed(2) || '0.00'), stats?.profitFactor >= 1 ? 'Profitable edge' : 'Below breakeven', pfColor)}
        {kpi('Avg R/R', fmtRR(stats?.avgRR || 0), stats?.avgRR >= 2 ? 'Strong asymmetry' : stats?.avgRR >= 1 ? 'Wins beat losses' : 'Losses outpace wins', rrColor)}
        {kpi('Sharpe', fmtSharpe(stats?.sharpe), sharpeNote, sharpeColor)}
      </div>
    </Card>
  );
}

// ═══════════════ SCATTER CHARTS ═══════════════
function ScatterCard({ stats, kind }) {
  const isTime = kind === 'time';
  const [timeMode, setTimeMode] = useState('entry'); // 'entry' or 'exit'
  const data = isTime ? (timeMode === 'entry' ? stats.timeScatter : stats.exitTimeScatter) : stats.durationScatter;
  const winData = data.filter(d => d.win), lossData = data.filter(d => !d.win);
  const chartWrapRef = useRef(null);
  // Bridge touch events on the chart to synthetic mouse events so Recharts shows
  // tooltips while the user drags a finger across the chart on mobile.
  useEffect(() => {
    const el = chartWrapRef.current; if (!el) return;
    const dispatch = (typeStr, touch) => {
      const ev = new MouseEvent(typeStr, { clientX: touch.clientX, clientY: touch.clientY, bubbles: true, cancelable: true, view: window });
      const target = document.elementFromPoint(touch.clientX, touch.clientY) || el;
      target.dispatchEvent(ev);
    };
    const onStart = (e) => { const t = e.touches[0]; if (t) dispatch('mousemove', t); };
    const onMove  = (e) => { const t = e.touches[0]; if (t) { e.preventDefault(); dispatch('mousemove', t); } };
    const onEnd   = () => { dispatch('mouseleave', { clientX: 0, clientY: 0 }); };
    el.addEventListener('touchstart', onStart, { passive: true });
    el.addEventListener('touchmove', onMove, { passive: false });
    el.addEventListener('touchend', onEnd);
    return () => { el.removeEventListener('touchstart', onStart); el.removeEventListener('touchmove', onMove); el.removeEventListener('touchend', onEnd); };
  }, []);
  const toggleBtn = (v, label) => (
    <button key={v} onClick={() => setTimeMode(v)} style={{ padding: '3px 10px', fontSize: 11, fontWeight: 500, borderRadius: 5, border: 'none', cursor: 'pointer', background: timeMode === v ? 'var(--violet)' : 'transparent', color: timeMode === v ? '#fff' : 'var(--text3)', transition: 'background 0.12s var(--ease-out), color 0.12s var(--ease-out), border-color 0.12s var(--ease-out), opacity 0.12s var(--ease-out)' }}>{label}</button>
  );
  return (
    <Card style={{ padding: 18 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12, gap: 8, flexWrap: 'wrap' }}>
        <div>
          <div style={{ fontWeight: 600 }}>{isTime ? 'Trade time performance' : 'Trade duration performance'}</div>
          <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>{isTime ? `P&L vs ${timeMode === 'entry' ? 'entry' : 'exit'} hour of day` : 'P&L vs hold time (log scale)'} · drag across to inspect</div>
        </div>
        {isTime && (
          <div style={{ display: 'inline-flex', background: 'var(--panel2)', borderRadius: 'var(--r-sm)', padding: 2, gap: 1 }}>
            {toggleBtn('entry', 'Entry')}
            {toggleBtn('exit', 'Exit')}
          </div>
        )}
      </div>
      <div ref={chartWrapRef} style={{ touchAction: 'pan-y' }}>
        <ResponsiveContainer width="100%" height={230}>
          <ScatterChart margin={{ top: 5, right: 10, bottom: 5, left: 0 }}>
            <CartesianGrid strokeDasharray="1 4" stroke="var(--chart-grid)" />
            {isTime
              ? <XAxis type="number" dataKey="hour" domain={[0, 24]} ticks={[0, 4, 8, 12, 16, 20, 24]} tickFormatter={h => `${h}:00`} tick={{ fontSize: 10, fill: 'var(--chart-tick)' }} axisLine={{ stroke: 'var(--chart-axis)' }} tickLine={false} />
              : <XAxis type="number" dataKey="hold" scale="log" domain={['auto', 'auto']} tickFormatter={v => fmtHold(v)} tick={{ fontSize: 10, fill: 'var(--chart-tick)' }} axisLine={{ stroke: 'var(--chart-axis)' }} tickLine={false} />}
            <YAxis type="number" dataKey="pnl" tick={{ fontSize: 10, fill: 'var(--chart-tick)' }} axisLine={false} tickLine={false} tickFormatter={fmtCompact} />
            <ReferenceLine y={0} stroke="var(--chart-baseline)" strokeDasharray="2 2" />
            <Tooltip cursor={{ strokeDasharray: '3 3', stroke: 'var(--chart-baseline)' }} contentStyle={{ background: 'var(--chart-tooltip-bg)', border: '1px solid var(--chart-tooltip-border)', borderRadius: 'var(--r-md)', fontSize: 12, color: 'var(--chart-tooltip-text)' }} labelStyle={{ color: 'var(--chart-tooltip-text)', fontWeight: 600 }} itemStyle={{ color: 'var(--chart-tooltip-text)' }}
              formatter={(v, n) => n === 'pnl' ? [fmtMoney(v), 'P&L'] : [isTime ? `${Math.floor(v)}:00` : fmtHold(v), isTime ? (timeMode === 'entry' ? 'Entry' : 'Exit') : 'Hold']} />
            <Scatter data={winData} fill="#4ade80" fillOpacity={0.75} />
            <Scatter data={lossData} fill="#f87171" fillOpacity={0.75} />
          </ScatterChart>
        </ResponsiveContainer>
      </div>
    </Card>
  );
}

// ═══════════════ ACCOUNT BALANCE VS DEPOSITS CHART ═══════════════
// Builds a chronological series of account balance (running) vs net deposits / withdrawals.
// Each deposit entry has a `balance` snapshot AFTER the deposit. Each trade carries its own
// post-close balance via closing equity: we approximate by walking forward.
function buildBalanceSeries(trades, deposits) {
  // Collect dated events
  const events = [];
  for (const d of (deposits || [])) {
    const dt = parseMT5Date(d.time);
    if (dt) events.push({ ts: dt.getTime(), label: d.time?.split(' ')[0], type: 'deposit', amount: d.amount || 0, balance: d.balance });
  }
  for (const t of (trades || [])) {
    const dt = parseMT5Date(t.closeTime);
    if (dt) events.push({ ts: dt.getTime(), label: t.closeTime?.split(' ')[0], type: 'trade', amount: netPnL(t) });
  }
  events.sort((a, b) => a.ts - b.ts);
  let bal = 0, deposited = 0;
  const pts = [];
  for (const e of events) {
    if (e.type === 'deposit') {
      deposited += e.amount;
      bal = (typeof e.balance === 'number' && e.balance > 0) ? e.balance : (bal + e.amount);
    } else {
      bal += e.amount;
    }
    pts.push({ label: e.label, ts: e.ts, balance: Math.round(bal * 100) / 100, deposits: Math.round(deposited * 100) / 100 });
  }
  return pts;
}
function AccountBalanceChart({ trades, deposits }) {
  const data = useMemo(() => buildBalanceSeries(trades, deposits), [trades, deposits]);
  if (!data.length) return null;
  return (
    <Card style={{ padding: 18 }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 12, flexWrap: 'wrap', gap: 6 }}>
        <div>
          <div style={{ fontWeight: 600 }}>Account balance vs deposits</div>

// ═══════════════ WIN % vs AVG WIN / AVG LOSS CHART ═══════════════
// Aggregates trades by day / week / month and plots three series: win rate (%), avg win ($), avg loss ($).
function buildWinLossSeries(trades, grain) {
  const buckets = new Map();
  for (const t of trades) {
    const dt = parseMT5Date(t.closeTime); if (!dt) continue;
    let key;
    if (grain === 'day') key = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}-${String(dt.getDate()).padStart(2, '0')}`;
    else if (grain === 'week') {
      const monday = new Date(dt); monday.setDate(dt.getDate() - ((dt.getDay() + 6) % 7));
      key = `${monday.getFullYear()}-${String(monday.getMonth() + 1).padStart(2, '0')}-${String(monday.getDate()).padStart(2, '0')}`;
    } else key = `${dt.getFullYear()}-${String(dt.getMonth() + 1).padStart(2, '0')}`;
    if (!buckets.has(key)) buckets.set(key, { key, wins: [], losses: [], total: 0 });
    const b = buckets.get(key); const n = netPnL(t);
    b.total++;
    if (n > 0) b.wins.push(n);
    else if (n < 0) b.losses.push(n);
  }
  return Array.from(buckets.values()).sort((a, b) => a.key.localeCompare(b.key)).map(b => ({
    label: b.key,
    winRate: b.total ? (b.wins.length / b.total) * 100 : 0,
    avgWin: b.wins.length ? b.wins.reduce((a, c) => a + c, 0) / b.wins.length : 0,
    avgLoss: b.losses.length ? b.losses.reduce((a, c) => a + c, 0) / b.losses.length : 0,
  }));
}

              {stat('Profit Factor', pf === Infinity ? '∞' : pf.toFixed(2))}
            </div>
          </div>
          {editNote && (
            <div style={{ marginTop: 14 }}>
              <textarea value={draft} onChange={e => setDraft(e.target.value)} rows={3} placeholder="End-of-day reflection…"
                style={{ width: '100%', fontSize: 13, padding: 10, background: 'var(--panel2)', border: '1px solid var(--border2)', borderRadius: 'var(--r-md)', color: 'var(--text)', outline: 'none', resize: 'vertical' }} />
              <div style={{ display: 'flex', gap: 8, marginTop: 8 }}>
                <button style={btnStyle('primary')} onClick={() => { onSaveNote(draft); setEditNote(false); }}>Save note</button>
                <button style={btnStyle('ghost')} onClick={() => setEditNote(false)}>Cancel</button>
              </div>
            </div>
          )}
          {!editNote && note && <div style={{ marginTop: 14, background: 'var(--panel)', border: '1px solid var(--border)', color: 'var(--text)', borderRadius: 'var(--r-md)', padding: 12, fontSize: 13, color: 'var(--text2)', whiteSpace: 'pre-wrap' }}>{note}</div>}
          {/* RamanFX Daily Insights — patterns detected from this day vs your 60-day history */}
          <div style={{ marginTop: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 10 }}>
              <span style={{ color: 'var(--violet-light)', fontSize: 13 }}><svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3" fill="currentColor"/></svg></span>
              <div style={{ fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text2)', fontWeight: 600, fontFamily: "'Geist', sans-serif" }}>RamanFX daily insights</div>
            </div>
            {(() => {
              const dayItems = day.items;
              // Build a 60-day rolling history window ending the day BEFORE this date
              const [y, m, dd] = day.date.split('-').map(Number);
              const cutoff = new Date(y, m - 1, dd); cutoff.setHours(0, 0, 0, 0);
              const histStart = new Date(cutoff); histStart.setDate(cutoff.getDate() - 60);
              const history = (allTrades || []).filter(t => {
                const ct = parseMT5Date(t.closeTime); if (!ct) return false;
                return ct >= histStart && ct < cutoff;
              });
              return <InsightsPanel windowTrades={dayItems} historyTrades={history} scope="day" exitData={exitData} />;
            })()}
          </div>
          <div style={{ marginTop: 16 }}>
            <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', marginBottom: 8 }}>Trades</div>
            {[...day.items].sort((a, b) => parseMT5Date(a.closeTime) - parseMT5Date(b.closeTime)).map(t => {
              const net = netPnL(t);
              // Click anywhere on a trade row to open its detail page
              const rowClick = (e) => { e.stopPropagation(); onOpenTrade?.(t.id); };
              if (isMobile) return (
                <div key={t.id} onClick={rowClick} style={{ padding: '8px 0', borderBottom: '1px solid rgba(38,38,44,0.5)', cursor: 'pointer', transition: 'background 0.12s', margin: '0 -4px', paddingLeft: 4, paddingRight: 4, borderRadius: 4 }}
                  onTouchStart={e => e.currentTarget.style.background = 'rgba(16,185,129,0.06)'}
                  onTouchEnd={e => e.currentTarget.style.background = 'transparent'}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 3 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
                      <span style={{ color: 'var(--text3)', fontFamily: 'ui-monospace,monospace', fontSize: 11 }}>{t.closeTime.split(' ')[1]?.slice(0, 5)}</span>
                      <span style={{ fontFamily: 'ui-monospace,monospace', color: 'var(--text)', fontSize: 12 }}>{t.symbol}</span>
                      <Pill color={t.type === 'buy' ? 'blue' : 'amber'}>{t.type}</Pill>
                    </div>
                    <span className="tabnum" style={{ fontWeight: 600, color: net >= 0 ? 'var(--green-bright)' : 'var(--red)', fontSize: 13 }}>{fmtMoney(net, true)}</span>
                  </div>
                  <div className="tabnum" style={{ color: 'var(--text3)', fontSize: 11, paddingLeft: 50 }}>{t.volume} lot · {t.openPrice} → {t.closePrice}</div>
                </div>
              );
              return (
                <div key={t.id} onClick={rowClick} style={{ display: 'grid', gridTemplateColumns: '60px 70px 56px 1fr 80px 16px', fontSize: 12, alignItems: 'center', padding: '7px 0', borderBottom: '1px solid rgba(38,38,44,0.5)', cursor: 'pointer', transition: 'background 0.12s', margin: '0 -8px', paddingLeft: 8, paddingRight: 8, borderRadius: 4 }}
                  onMouseEnter={e => e.currentTarget.style.background = 'rgba(16,185,129,0.05)'}
                  onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                  <div style={{ color: 'var(--text3)', fontFamily: 'ui-monospace,monospace' }}>{t.closeTime.split(' ')[1]?.slice(0, 5)}</div>
                  <div style={{ fontFamily: 'ui-monospace,monospace', color: 'var(--text)' }}>{t.symbol}</div>
                  <Pill color={t.type === 'buy' ? 'blue' : 'amber'}>{t.type}</Pill>
                  <div className="tabnum" style={{ color: 'var(--text3)' }}>{t.volume} lot · {t.openPrice} → {t.closePrice}</div>
                  <div className="tabnum" style={{ textAlign: 'right', fontWeight: 600, color: net >= 0 ? 'var(--green-bright)' : 'var(--red)' }}>{fmtMoney(net, true)}</div>
                  <div style={{ color: 'var(--text3)', textAlign: 'right', fontSize: 11 }}>›</div>
                </div>
              );
            })}
          </div>
        </div>
      )}
    </Card>
  );
}

function WeekView({ stats, allTrades, exitData }) {
  const isMobile = useMobile();
  const weeks = useMemo(() => {
    const map = {};
    for (const d of stats.daily) {
      const [y, m, dd] = d.date.split('-').map(Number); const date = new Date(y, m - 1, dd);
      const day = (date.getDay() + 6) % 7; const monday = new Date(date); monday.setDate(date.getDate() - day);
      const key = dayKey(monday);
      if (!map[key]) map[key] = { weekStart: monday, days: {}, totalPnL: 0, totalTrades: 0, weekItems: [] };
      map[key].days[['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'][day]] = d;
      map[key].totalPnL += d.pnl; map[key].totalTrades += d.trades;
      // Collect every trade for the week
      for (const t of (d.items || [])) map[key].weekItems.push(t);
    }
    return Object.values(map).sort((a, b) => b.weekStart - a.weekStart);
  }, [stats]);
  // Most recent week expanded by default, all others collapsed
  const [expandedKey, setExpandedKey] = useState(weeks[0]?.weekStart?.toISOString() || null);
  const dayNames = ['mon', 'tue', 'wed', 'thu', 'fri', 'sat', 'sun'], dayLabels = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
      {weeks.map(w => {
        const start = w.weekStart, end = new Date(start); end.setDate(start.getDate() + 6);
        const range = `${start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })} - ${end.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`;
        const profit = w.totalPnL >= 0;
        const key = w.weekStart.toISOString();
        const expanded = expandedKey === key;
        // 60-day history ending the day before the week started
        const histStart = new Date(start); histStart.setDate(start.getDate() - 60);
        const history = (allTrades || []).filter(t => {
          const ct = parseMT5Date(t.closeTime); if (!ct) return false;
          return ct >= histStart && ct < start;
        });
        return (
          <Card key={key} style={{ padding: 0, overflow: 'hidden' }}>
            <div onClick={() => setExpandedKey(expanded ? null : key)} style={{ padding: '14px 18px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', cursor: 'pointer', gap: 10, flexWrap: 'wrap' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 12, minWidth: 0 }}>
                <span style={{ color: 'var(--text3)', fontSize: 14, transition: 'transform 0.2s', transform: expanded ? 'rotate(90deg)' : 'none' }}>›</span>
                <div style={{ fontWeight: 600 }}>{range}</div>
                <span style={{ fontSize: 11, color: 'var(--text3)' }}>{w.totalTrades} trade{w.totalTrades !== 1 ? 's' : ''}</span>
              </div>
              <div className="tabnum" style={{ fontWeight: 600, color: profit ? 'var(--green-bright)' : 'var(--red)' }}>Net P&L {fmtMoney(w.totalPnL, true)}</div>
            </div>
            {expanded && (
              <div style={{ padding: '0 18px 18px 18px', borderTop: '1px solid var(--border)' }}>
                <div style={{ paddingTop: 14 }}>
                  {isMobile ? (
                    // Mobile: stacked rows, one per day. No horizontal scroll.
                    <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                      {dayNames.map((dn, i) => {
                        const day = w.days[dn]; const isP = day?.pnl >= 0; const dd = new Date(start); dd.setDate(start.getDate() + i);
                        return (
                          <div key={dn} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '10px 12px', borderRadius: 'var(--r-md)', background: day ? (isP ? 'rgba(38,166,154,0.08)' : 'rgba(248,113,113,0.08)') : 'var(--panel2)', border: `1px solid ${day ? (isP ? 'rgba(38,166,154,0.3)' : 'rgba(248,113,113,0.3)') : 'var(--border)'}`, gap: 12 }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0 }}>
                              <div style={{ width: 36, textAlign: 'center' }}>
                                <div style={{ fontSize: 10, textTransform: 'uppercase', color: 'var(--text3)', fontWeight: 600 }}>{dayLabels[i]}</div>
                                <div className="tabnum" style={{ fontSize: 13, color: 'var(--text)', fontWeight: 600 }}>{dd.getDate()}</div>
                              </div>
                              {day ? <div style={{ fontSize: 11, color: 'var(--text3)' }}>{day.trades} trade{day.trades !== 1 ? 's' : ''}</div> : <div style={{ fontSize: 11, color: 'var(--border2)' }}>—</div>}
                            </div>
                            {day && <div className="tabnum" style={{ fontSize: 15, fontWeight: 700, color: isP ? 'var(--green-bright)' : 'var(--red)' }}>{fmtMoney(day.pnl, true)}</div>}
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', gap: 8 }}>
                      {dayNames.map((dn, i) => {
                        const day = w.days[dn]; const isP = day?.pnl >= 0; const dd = new Date(start); dd.setDate(start.getDate() + i);
                        return (
                          <div key={dn} style={{ borderRadius: 'var(--r-md)', border: `1px solid ${day ? (isP ? 'rgba(38,166,154,0.3)' : 'rgba(248,113,113,0.3)') : 'var(--border)'}`, background: day ? (isP ? 'rgba(38,166,154,0.08)' : 'rgba(248,113,113,0.08)') : 'var(--panel2)', padding: 12, textAlign: 'center', minHeight: 78, display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
                            <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.04em', color: 'var(--text3)', marginBottom: 4 }}>{dayLabels[i]} {dd.getDate()}</div>
                            {day ? <Fragment><div className="tabnum" style={{ fontSize: 15, fontWeight: 700, color: isP ? 'var(--green-bright)' : 'var(--red)' }}>{fmtMoney(day.pnl, true)}</div><div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 3 }}>{day.trades} trades</div></Fragment> : <div style={{ fontSize: 10, color: 'var(--border2)' }}>—</div>}
                          </div>
                        );
                      })}
                    </div>
                  )}
                </div>
                {/* Weekly insights — patterns from the 7 days vs 60-day baseline */}
                {w.weekItems.length >= 3 && (
                  <div style={{ marginTop: 16, paddingTop: 14, borderTop: '1px solid var(--border)' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 10 }}>
                      <span style={{ color: 'var(--violet-light)', fontSize: 13 }}><svg width="8" height="8" viewBox="0 0 8 8"><circle cx="4" cy="4" r="3" fill="currentColor"/></svg></span>
                      <div style={{ fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text2)', fontWeight: 600, fontFamily: "'Geist', sans-serif" }}>RamanFX weekly insights</div>
                    </div>
                    <InsightsPanel windowTrades={w.weekItems} historyTrades={history} scope="week" exitData={exitData} />
                  </div>
                )}
              </div>
            )}
          </Card>
        );
      })}
    </div>
  );
}

// ═══════════════ TRADE VIEW COLUMNS ═══════════════
// Master list of every column the user can choose to display in the Trade View.
// Each column has: id, label, group (for the picker UI), align ('left'|'right'),
// render(t, note, ctx) -> ReactNode. `available` is true only when the field is reliably
// derivable from MT5 forex data — others are marked unavailable so we never fake data.
// `defaultOn` is whether the column shows out of the box.
//
// Sort keys correspond to enriched trade fields. We only allow sorting on a subset.
// Helper: convert MT5 date string "YYYY.MM.DD HH:MM:SS" to a sortable number (ms since epoch).
// Used by every timing column's sortValue. Returns null for missing/invalid strings.
const _toTs = (s) => { const d = parseMT5Date(s); return d ? d.getTime() : null; };
// Helper: pull a possibly-string number safely
const _num = (v) => { if (v == null || v === '') return null; const n = parseFloat(v); return isNaN(n) ? null : n; };

const TRADE_COLUMNS = [
  // ── Identity & timing ──
  // Every column declares sortValue so it can be clicked to sort. Returns:
  //   • a Number for numeric columns (use null for missing → sorts last)
  //   • a String for text columns (use '' for missing → sorts first asc / last desc)
  { id: 'openDate',  label: 'Open date',   group: 'Timing',  align: 'left',  available: true, defaultOn: true,
    sortValue: t => _toTs(t.openTime),
    render: t => t.openTime?.split(' ')[0] || '—' },
  { id: 'openTimeFull',  label: 'Open time',   group: 'Timing',  align: 'left',  available: true, defaultOn: false,
    sortValue: t => _toTs(t.openTime),
    render: t => t.openTime?.split(' ')[1] || '—' },
  { id: 'closeDate', label: 'Close date',  group: 'Timing',  align: 'left',  available: true, defaultOn: true,
    sortValue: t => _toTs(t.closeTime),
    render: t => t.closeTime?.split(' ')[0] || '—' },
  { id: 'closeTimeFull', label: 'Close time',  group: 'Timing',  align: 'left',  available: true, defaultOn: false,
    sortValue: t => _toTs(t.closeTime),
    render: t => t.closeTime?.split(' ')[1] || '—' },
  { id: 'holdTime',  label: 'Hold time',   group: 'Timing',  align: 'right', available: true, defaultOn: false,
    sortValue: t => t.holdSec || 0,
    render: t => fmtHold(t.holdSec || 0) },
  // ── Instrument & direction ──
  { id: 'symbol',    label: 'Symbol',      group: 'Instrument', align: 'left', available: true, defaultOn: true,
    sortValue: t => (t.symbol || '').toLowerCase(),
    render: t => <span style={{ display: 'inline-flex', alignItems: 'center', gap: 6 }}>{t.symbol} <Pill color={t.type === 'buy' ? 'blue' : 'amber'}>{t.type}</Pill></span> },
  { id: 'side',      label: 'Side',        group: 'Instrument', align: 'left', available: true, defaultOn: false,
    sortValue: t => (t.type || '').toLowerCase(),
    render: t => <Pill color={t.type === 'buy' ? 'blue' : 'amber'}>{(t.type || '').toUpperCase()}</Pill> },
  { id: 'volume',    label: 'Volume (lots)', group: 'Instrument', align: 'right', available: true, defaultOn: false,
    sortValue: t => t.volume || 0,
    render: t => <span className="tabnum">{(t.volume || 0).toFixed(2)}</span> },
  { id: 'account',   label: 'Account',     group: 'Instrument', align: 'left', available: true, defaultOn: false,
    sortValue: t => (t.account || '').toLowerCase(),
    render: t => <span style={{ color: 'var(--text3)', fontSize: 12 }}>{t.account || '—'}</span> },
  // ── Prices ──
  { id: 'entry',     label: 'Avg Entry',   group: 'Prices', align: 'right', available: true, defaultOn: true,
    sortValue: t => _num(t.openPrice),
    render: t => <span className="tabnum">{t.openPrice ?? '—'}</span> },
  { id: 'exit',      label: 'Avg Exit',    group: 'Prices', align: 'right', available: true, defaultOn: true,
    sortValue: t => _num(t.closePrice),
    render: t => <span className="tabnum">{t.closePrice ?? '—'}</span> },
  { id: 'sl',        label: 'Stop Loss',   group: 'Prices', align: 'right', available: true, defaultOn: false,
    sortValue: t => _num(t.sl),
    render: t => <span className="tabnum" style={{ color: t.sl ? 'var(--red)' : 'var(--text3)' }}>{t.sl || '—'}</span> },
  { id: 'tp',        label: 'Take Profit', group: 'Prices', align: 'right', available: true, defaultOn: false,
    sortValue: t => _num(t.tp),
    render: t => <span className="tabnum" style={{ color: t.tp ? 'var(--green-bright)' : 'var(--text3)' }}>{t.tp || '—'}</span> },
  // ── P&L breakdown ──
  { id: 'gross',     label: 'Gross P&L',   group: 'P&L', align: 'right', available: true, defaultOn: false,
    sortValue: t => t.profit || 0,
    render: t => <span className="tabnum" style={{ color: t.profit >= 0 ? 'var(--green-bright)' : 'var(--red)' }}>{fmtMoney(t.profit || 0, true)}</span> },
  { id: 'commission', label: 'Commission', group: 'P&L', align: 'right', available: true, defaultOn: false,
    sortValue: t => t.commission || 0,
    render: t => <span className="tabnum" style={{ color: 'var(--text3)' }}>{fmtMoney(t.commission || 0)}</span> },
  { id: 'swap',      label: 'Swap',        group: 'P&L', align: 'right', available: true, defaultOn: false,
    sortValue: t => t.swap || 0,
    render: t => <span className="tabnum" style={{ color: 'var(--text3)' }}>{fmtMoney(t.swap || 0)}</span> },
  { id: 'net',       label: 'Net P&L',     group: 'P&L', align: 'right', available: true, defaultOn: true,
    sortValue: t => t.net,
    render: t => <span className="tabnum" style={{ fontWeight: 600, color: t.net >= 0 ? 'var(--green-bright)' : 'var(--red)' }}>{fmtMoney(t.net, true)}</span> },
  { id: 'status',    label: 'Status',      group: 'P&L', align: 'left', available: true, defaultOn: true,
    sortValue: t => t.net > 0 ? 2 : t.net === 0 ? 1 : 0,
    render: t => <Pill color={t.net > 0 ? 'green' : t.net === 0 ? 'zinc' : 'red'}>{t.net > 0 ? 'WIN' : t.net === 0 ? 'SCRATCH' : 'LOSS'}</Pill> },
  // ── Risk-adjusted (derived) ──
  { id: 'rMultiple', label: 'R-Multiple',  group: 'Risk', align: 'right', available: true, defaultOn: false,
    // Compute the R-multiple as a sortable number; null if can't derive
    sortValue: t => {
      if (!t.sl || !t.openPrice) return null;
      const sl = parseFloat(t.sl), entry = parseFloat(t.openPrice);
      if (!sl || !entry) return null;
      const pipDist = Math.abs(entry - sl); if (pipDist === 0) return null;
      const priceMove = Math.abs((parseFloat(t.closePrice) || entry) - entry); if (priceMove === 0) return null;
      const dollarPerUnit = Math.abs((t.profit || 0)) / priceMove;
      const risk = dollarPerUnit * pipDist; if (risk === 0) return null;
      return t.net / risk;
    },
    render: t => {
      // R = net / risked amount; risked = |entry - SL| * volume * contract size approx
      if (!t.sl || !t.openPrice) return <span style={{ color: 'var(--text3)' }}>—</span>;
      const sl = parseFloat(t.sl), entry = parseFloat(t.openPrice);
      if (!sl || !entry) return <span style={{ color: 'var(--text3)' }}>—</span>;
      const pipDist = Math.abs(entry - sl);
      if (pipDist === 0) return <span style={{ color: 'var(--text3)' }}>—</span>;
      // Estimate $ risk per unit move from observed P&L / price move on this trade
      const priceMove = Math.abs((parseFloat(t.closePrice) || entry) - entry);
      if (priceMove === 0) return <span style={{ color: 'var(--text3)' }}>—</span>;
      const dollarPerUnit = Math.abs((t.profit || 0)) / priceMove;
      const risk = dollarPerUnit * pipDist;
      if (risk === 0) return <span style={{ color: 'var(--text3)' }}>—</span>;
      const r = t.net / risk;
      return <span className="tabnum" style={{ color: r >= 0 ? 'var(--green-bright)' : 'var(--red)' }}>{r >= 0 ? '+' : ''}{r.toFixed(2)}R</span>;
    }
  },
  { id: 'roi',       label: 'ROI %',       group: 'Risk', align: 'right', available: true, defaultOn: false,
    sortValue: t => {
      if (!t.openPrice || !t.volume) return null;
      const notional = parseFloat(t.openPrice) * (t.volume || 0) * 100000;
      if (!notional) return null;
      return (t.net / notional) * 100;
    },
    render: t => {
      // ROI estimated as net / (entry * volume) — rough proxy for forex without margin info
      if (!t.openPrice || !t.volume) return <span style={{ color: 'var(--text3)' }}>—</span>;
      const notional = parseFloat(t.openPrice) * (t.volume || 0) * 100000;
      if (!notional) return <span style={{ color: 'var(--text3)' }}>—</span>;
      const roi = (t.net / notional) * 100;
      return <span className="tabnum" style={{ color: roi >= 0 ? 'var(--green-bright)' : 'var(--red)' }}>{roi >= 0 ? '+' : ''}{roi.toFixed(2)}%</span>;
    }
  },
  { id: 'pips',      label: 'Pips',        group: 'Risk', align: 'right', available: true, defaultOn: false,
    sortValue: t => {
      if (!t.openPrice || !t.closePrice) return null;
      const entry = parseFloat(t.openPrice), exit = parseFloat(t.closePrice);
      const sym = (t.symbol || '').toUpperCase();
      const pipSize = sym.includes('JPY') ? 0.01 : (sym.includes('XAU') || sym.includes('XAG')) ? 0.1 : 0.0001;
      const dir = t.type === 'buy' ? 1 : -1;
      return ((exit - entry) / pipSize) * dir;
    },
    render: t => {
      if (!t.openPrice || !t.closePrice) return <span style={{ color: 'var(--text3)' }}>—</span>;
      const entry = parseFloat(t.openPrice), exit = parseFloat(t.closePrice);
      const sym = (t.symbol || '').toUpperCase();
      const pipSize = sym.includes('JPY') ? 0.01 : (sym.includes('XAU') || sym.includes('XAG')) ? 0.1 : 0.0001;
      const dir = t.type === 'buy' ? 1 : -1;
      const pips = ((exit - entry) / pipSize) * dir;
      return <span className="tabnum" style={{ color: pips >= 0 ? 'var(--green-bright)' : 'var(--red)' }}>{pips >= 0 ? '+' : ''}{pips.toFixed(1)}</span>;
    }
  },
  // ── User-entered metadata ──
  { id: 'strategy',  label: 'Strategy',    group: 'Notes', align: 'left', available: true, defaultOn: false,
    sortValue: (t, note, ctx) => {
      const s = ctx.strategies?.find(s => s.id === note?.strategyId);
      return (s?.name || '').toLowerCase();
    },
    render: (t, note, ctx) => {
      const s = ctx.strategies?.find(s => s.id === note?.strategyId);
      return s ? <span style={{ color: 'var(--violet-light)', fontSize: 12 }}>{s.name}</span> : <span style={{ color: 'var(--text3)' }}>—</span>;
    }
  },
  { id: 'tags',      label: 'Tags',        group: 'Notes', align: 'left', available: true, defaultOn: false,
    // Sort by count of tags; secondary by first tag alphabetically

// ═══════════════ COLUMN PICKER MODAL ═══════════════
function ColumnPickerModal({ open, onClose, selected, onSave }) {
  const [draft, setDraft] = useState(selected);
  useEffect(() => { setDraft(selected); }, [selected, open]);
  if (!open) return null;
  const toggle = (id) => setDraft(d => d.includes(id) ? d.filter(x => x !== id) : [...d, id]);
  const groups = ['Timing', 'Instrument', 'Prices', 'P&L', 'Risk', 'Exit quality', 'Notes', 'Performance', 'Unavailable'];
  return (
    <Modal open={open} onClose={onClose} width={680}>
      {/* Three-row flex layout inside the modal panel: fixed header, scrollable body, fixed footer.
          This guarantees the Apply/Cancel buttons are always reachable no matter how long the list. */}
      <div style={{ padding: '16px 22px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexShrink: 0 }}>
        <div>
          <div style={{ fontWeight: 700, fontSize: 16 }}>Customize columns</div>
          <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>Choose which columns to show in the trade list</div>
        </div>
        <button style={btnStyle('ghost')} onClick={onClose}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
      </div>
      <div style={{ padding: 18, flex: 1, minHeight: 0, overflowY: 'auto', WebkitOverflowScrolling: 'touch' }}>
        <div style={{ display: 'flex', gap: 8, marginBottom: 16, flexWrap: 'wrap' }}>
          <button style={btnStyle('ghost')} onClick={() => setDraft(TRADE_COLUMNS.filter(c => c.available).map(c => c.id))}>All available</button>
          <button style={btnStyle('ghost')} onClick={() => setDraft([])}>None</button>
          <button style={btnStyle('ghost')} onClick={() => setDraft(DEFAULT_TRADE_COLUMNS)}>Default</button>
          <div style={{ flex: 1 }} />
          <span style={{ fontSize: 12, color: 'var(--text3)', alignSelf: 'center' }}>{draft.length} selected</span>
        </div>
        {groups.map(group => {
          const cols = TRADE_COLUMNS.filter(c => c.group === group);
          if (!cols.length) return null;
          const isUnavail = group === 'Unavailable';
          return (
            <div key={group} style={{ marginBottom: 18 }}>
              <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.06em', color: isUnavail ? 'var(--text3)' : 'var(--violet-light)', fontWeight: 700, marginBottom: 8 }}>
                {group}{isUnavail && <span style={{ marginLeft: 8, fontWeight: 400, textTransform: 'none', letterSpacing: 0, fontSize: 11, color: 'var(--text3)' }}>(not available for MT5 forex data)</span>}
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(180px, 1fr))', gap: 4 }}>
                {cols.map(col => {
                  const checked = draft.includes(col.id);
                  return (
                    <label key={col.id}
                      title={col.reason || ''}
                      style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 10px', borderRadius: 'var(--r-sm)', cursor: col.available ? 'pointer' : 'not-allowed', opacity: col.available ? 1 : 0.4, background: checked && col.available ? 'rgba(16,185,129,0.08)' : 'transparent', transition: 'background 0.12s', minHeight: 36 }}>
                      <input type="checkbox" checked={checked} disabled={!col.available} onChange={() => col.available && toggle(col.id)} style={{ accentColor: 'var(--violet)', cursor: col.available ? 'pointer' : 'not-allowed', width: 18, height: 18, flexShrink: 0 }} />
                      <span style={{ fontSize: 13, color: col.available ? 'var(--text2)' : 'var(--text3)' }}>{col.label}</span>
                    </label>
                  );
                })}
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ padding: '14px 22px', borderTop: '1px solid var(--border)', display: 'flex', justifyContent: 'flex-end', gap: 8, flexShrink: 0, background: 'var(--panel)' }}>
        <button style={btnStyle('ghost')} onClick={onClose}>Cancel</button>
        <button style={{ ...btnStyle('primary'), opacity: draft.length === 0 ? 0.5 : 1, cursor: draft.length === 0 ? 'not-allowed' : 'pointer' }} disabled={draft.length === 0} onClick={() => { if (draft.length > 0) { onSave(draft); onClose(); } }}>Apply ({draft.length})</button>
      </div>
    </Modal>
  );
}

// ═══════════════ TRADE VIEW ═══════════════
function TradeView({ trades, notes, strategies, exitData, onSaveNote, onOpenTradeDetail }) {
  const isMobile = useMobile();
  const [search, setSearch] = useState(''), [filter, setFilter] = useState('all'), [symFilter, setSymFilter] = useState('all'), [stratFilter, setStratFilter] = useState('all');
  const [expanded, setExpanded] = useState(null), [sortBy, setSortBy] = useState({ key: 'closeDate', dir: 'desc' });
  // Column picker — persisted selection
  const [selectedCols, setSelectedCols] = useState(() => {
    const saved = lsGet(SK.tradeColumns, null);
    return Array.isArray(saved) && saved.length ? saved : DEFAULT_TRADE_COLUMNS;
  });
  const [pickerOpen, setPickerOpen] = useState(false);
  const saveSelectedCols = (cols) => { setSelectedCols(cols); lsSet(SK.tradeColumns, cols); };
  // Active columns to render, preserving the order they appear in TRADE_COLUMNS
  const activeCols = useMemo(() => TRADE_COLUMNS.filter(c => selectedCols.includes(c.id) && c.available), [selectedCols]);
  const stats = useMemo(() => computeStats(trades), [trades]);
  const symbols = useMemo(() => ['all', ...new Set(trades.map(t => t.symbol))].sort(), [trades]);
  const filtered = useMemo(() => {
    if (!stats) return [];
    return stats.enriched
      .filter(t => symFilter === 'all' || t.symbol === symFilter)
      .filter(t => filter === 'all' ? true : filter === 'wins' ? t.net > 0 : filter === 'losses' ? t.net < 0 : (!notes[t.id]?.note && !notes[t.id]?.tags?.length && !notes[t.id]?.strategyId))
      .filter(t => stratFilter === 'all' || notes[t.id]?.strategyId === stratFilter)
      .filter(t => { if (!search) return true; const s = search.toLowerCase(); return t.symbol.toLowerCase().includes(s) || t.id.includes(s) || (notes[t.id]?.note || '').toLowerCase().includes(s) || (notes[t.id]?.tags || []).some(tag => tag.toLowerCase().includes(s)); })
      .sort((a, b) => {
        // Uniform comparator that uses each column's sortValue function. Handles:
        //   • numbers and strings (auto-detects type from first non-null value)
        //   • missing data — nulls always sort last regardless of direction (consistent UX)
        //   • case-insensitive string comparison (already lowercased by sortValue)
        const col = TRADE_COLUMNS.find(c => c.id === sortBy.key);
        if (!col?.sortValue) return 0;
        const dir = sortBy.dir === 'desc' ? -1 : 1;
        // Lightweight ctx for sort — exit-quality columns need exitData, strategy column needs strategies
        const sortCtx = { exitData: exitData || {}, strategies: strategies || [] };
        const va = col.sortValue(a, notes[a.id] || {}, sortCtx);
        const vb = col.sortValue(b, notes[b.id] || {}, sortCtx);
        // Nulls always go to the bottom regardless of sort direction
        if (va == null && vb == null) return 0;
        if (va == null) return 1;
        if (vb == null) return -1;
        // Type-aware comparison
        if (typeof va === 'string' || typeof vb === 'string') {
          return dir * String(va).localeCompare(String(vb));
        }
        return dir * (va - vb);
      });
  }, [stats, notes, search, filter, symFilter, stratFilter, sortBy, exitData, strategies]);
  if (!stats) return <div style={{ textAlign: 'center', padding: 40, color: 'var(--text3)' }}>No trades yet.</div>;
  // KPIs should reflect only the trades currently shown after filters/search.
  // Note `filtered` is the enriched & sorted trade slice; we recompute the relevant stats from it.
  const filteredStats = useMemo(() => {
    if (!filtered || filtered.length === 0) {
      return { totalNet: 0, total: 0, profitFactor: 0, winRate: 0, wins: 0, losses: 0, avgWin: 0, avgLoss: 0, largestWin: 0, largestLoss: 0 };
    }
    let totalNet = 0, wins = 0, losses = 0, grossWin = 0, grossLoss = 0, largestWin = 0, largestLoss = 0;
    for (const t of filtered) {
      totalNet += t.net;
      if (t.net > 0) { wins++; grossWin += t.net; if (t.net > largestWin) largestWin = t.net; }
      else if (t.net < 0) { losses++; grossLoss += Math.abs(t.net); if (t.net < largestLoss) largestLoss = t.net; }
    }
    const total = filtered.length;
    const completed = wins + losses;
    return {
      totalNet, total, wins, losses,
      profitFactor: grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : 0),
      winRate: completed > 0 ? (wins / completed) * 100 : 0,
      avgWin: wins > 0 ? grossWin / wins : 0,
      avgLoss: losses > 0 ? -grossLoss / losses : 0,
      largestWin, largestLoss,
    };
  }, [filtered]);
  const sortIcon = k => sortBy.key === k ? (sortBy.dir === 'desc' ? ' ↓' : ' ↑') : '';
  const toggleSort = k => setSortBy(sortBy.key === k ? { key: k, dir: sortBy.dir === 'desc' ? 'asc' : 'desc' } : { key: k, dir: 'desc' });
  const sel = { fontSize: 12, background: 'var(--panel2)', border: '1px solid var(--border2)', borderRadius: 'var(--r-sm)', padding: '6px 8px', color: 'var(--text)', cursor: 'pointer' };
  // ctx supplies stats for column renderers (used by 'scale' column for largestWin/loss normalisation).
  // Pass filteredStats so the scale bar normalises against what's currently visible.
  const ctx = { stats: filteredStats, strategies, exitData: exitData || {} };

  // Whether any filter is currently narrowing the view
  const isFiltering = search.trim() !== '' || filter !== 'all' || symFilter !== 'all' || stratFilter !== 'all';

  return (
    <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      {isFiltering && (
        <div style={{ padding: '8px 14px', background: 'rgba(16,185,129,0.08)', border: '1px solid rgba(16,185,129,0.28)', borderRadius: 'var(--r-md)', fontSize: 12, color: 'var(--violet-light)' }}>
          Showing {filteredStats.total} of {stats.total} trades — KPIs below reflect the filtered set.
        </div>
      )}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(220px,1fr))', gap: 12 }}>
        <MetricGauge label="Net cumulative P&L" value={fmtMoney(filteredStats.totalNet, true)} sub={`${filteredStats.total} trade${filteredStats.total !== 1 ? 's' : ''}`} accent={filteredStats.totalNet >= 0 ? 'var(--green-bright)' : 'var(--red)'} />
        <MetricGauge label="Profit factor" value={filteredStats.profitFactor === Infinity ? '∞' : filteredStats.profitFactor.toFixed(2)} donutValue={Math.min(100, (filteredStats.profitFactor === Infinity ? 100 : filteredStats.profitFactor) * 40)} color={filteredStats.profitFactor >= 1 ? '#4ade80' : '#f87171'} />
        <MetricGauge label="Trade win %" value={`${filteredStats.winRate.toFixed(2)}%`} donutValue={filteredStats.winRate} color="#4ade80" donutCenter={<div className="tabnum" style={{ fontSize: 13, fontWeight: 700 }}>{filteredStats.wins}/{filteredStats.losses}</div>} />

// ═══════════════ MODAL ═══════════════
// Render modal into a portal at document.body so it's not constrained by ancestor stacking contexts,
// transforms, filters, or overflow. This is the standard pattern for production modals.
function Modal({ open, onClose, children, width = 720 }) {
  // iOS-safe scroll lock with portal: lock html overflow + remember scroll, restore on close.
  // onClose is captured in a ref so the lock effect depends ONLY on `open` — a fresh onClose
  // identity on every parent render would otherwise re-run the effect and cause scroll-jump churn.
  const onCloseRef = useRef(onClose);
  onCloseRef.current = onClose;
  useEffect(() => {
    if (!open) return;
    const onEsc = (e) => { if (e.key === 'Escape') onCloseRef.current(); };
    document.addEventListener('keydown', onEsc);
    const scrollY = window.scrollY || window.pageYOffset || 0;
    const prevHtmlOverflow = document.documentElement.style.overflow;
    const prevBodyOverflow = document.body.style.overflow;
    const prevBodyPosition = document.body.style.position;
    const prevBodyTop = document.body.style.top;
    const prevBodyWidth = document.body.style.width;
    // Position-fixed-body is still required on iOS Safari to actually freeze scroll under the modal.
    // Combined with the portal, the modal is rendered as a sibling of #root, outside the fixed body,
    // so it always anchors correctly to the viewport.
    document.body.style.position = 'fixed';
    document.body.style.top = `-${scrollY}px`;
    document.body.style.width = '100%';
    document.body.style.overflow = 'hidden';
    document.documentElement.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onEsc);
      document.documentElement.style.overflow = prevHtmlOverflow;
      document.body.style.overflow = prevBodyOverflow;
      document.body.style.position = prevBodyPosition;
      document.body.style.top = prevBodyTop;
      document.body.style.width = prevBodyWidth;
      window.scrollTo(0, scrollY);
    };
  }, [open]);
  if (!open) return null;
  // Note: ReactDOM.createPortal renders children into a DOM node OUTSIDE the React tree.
  // We use document.body so the modal is a top-level sibling of #root.
  const modalContent = (
    <div onClick={onClose} style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, height: '100dvh', background: 'rgba(0,0,0,0.5)', WebkitBackdropFilter: 'blur(8px) saturate(1.2)', backdropFilter: 'blur(8px) saturate(1.2)', zIndex: 10000, display: 'flex', alignItems: 'flex-start', justifyContent: 'center', overflowY: 'auto', paddingTop: 'max(24px, env(safe-area-inset-top))', paddingBottom: 'max(24px, env(safe-area-inset-bottom))', paddingLeft: 'max(16px, env(safe-area-inset-left))', paddingRight: 'max(16px, env(safe-area-inset-right))', WebkitOverflowScrolling: 'touch' }}>
      <div onClick={e => e.stopPropagation()} className="fade-in" style={{ background: 'var(--panel)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 'var(--r-xl)', maxWidth: width, width: '100%', maxHeight: '100%', display: 'flex', flexDirection: 'column', boxShadow: '0 20px 60px rgba(0,0,0,0.7)', overflow: 'hidden' }}>
        {children}
      </div>
    </div>
  );
  return ReactDOM.createPortal(modalContent, document.body);
}

function DaySummaryPopup({ dayKey: dk, stats, onClose, onViewDetails, onAddNote, existingNote }) {

  const profit = day.pnl >= 0;
  const winRate = day.trades ? day.wins / day.trades * 100 : 0;
  const pf = (() => { let gW = 0, gL = 0; for (const t of day.items) { const n = netPnL(t); if (n > 0) gW += n; else if (n < 0) gL += Math.abs(n); } return gL > 0 ? gW / gL : (gW > 0 ? Infinity : 0); })();
  const grossPnL = day.items.reduce((a, b) => a + b.profit, 0);
  const commissions = day.items.reduce((a, b) => a + b.commission, 0);
  const equityData = (() => { let cum = 0; return [...day.items].sort((a, b) => parseMT5Date(a.closeTime) - parseMT5Date(b.closeTime)).map((t, i) => { cum += netPnL(t); return { i: i + 1, cum }; }); })();

        <div className="force-stack" style={{ padding: 22, display: 'grid', gridTemplateColumns: 'minmax(0,1fr) minmax(0,1.6fr)', gap: 18 }}>
          <ResponsiveContainer width="100%" height={150}>
            <AreaChart data={equityData}>
              <defs><linearGradient id="dayPopG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={profit ? '#4ade80' : '#f87171'} stopOpacity={0.4} /><stop offset="100%" stopColor={profit ? '#4ade80' : '#f87171'} stopOpacity={0} /></linearGradient></defs>
