<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* ── DARK THEME (default) ──
     The :root scope sets the default variables. Switching themes is done by adding
     data-theme="light" to <html>, which we do via a button click. CSS handles the rest
     declaratively, with a short transition for smoothness.

     Note: --sidebar-* variables intentionally do NOT change between themes. The sidebar
     stays dark in both light and dark mode (matching Tradezella's design language) so
     the brand stamp + navigation feel anchored regardless of the content surface. */
  :root {
    /* ── Spacing scale (8pt grid) ── */
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px;
    /* ── Radius scale ── */
    --r-sm: 4px; --r-md: 6px; --r-lg: 8px; --r-xl: 10px; --r-full: 9999px;
    /* ── Easing (Emil-grade custom curves) ── */
    /* ── Motion tokens (4 named durations, 3 curves) ── */
    --dur-fast: 120ms;      /* micro: toggle, hover, focus */
    --dur-normal: 220ms;    /* UI: modal, drawer, tab */
    --dur-slow: 380ms;      /* page: route, dashboard cascade */
    --dur-xslow: 550ms;     /* hero: score count-up, splash */
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
    --ease-spring: cubic-bezier(0.22, 1.65, 0.36, 1);
    /* ── z-index scale ── */
    --z-dropdown: 30; --z-sticky: 40; --z-modal-bg: 200; --z-modal: 201; --z-toast: 300; --z-tooltip: 400;
    /* Main content surfaces */
    --bg: #0C1117;
    --panel: #151B24;
    --panel2: #1B232E;
    --border: #27303B;
    --border2: #36404D;
    /* Text — brighter for legibility on deep indigo */
    --text: #F1F5F9;
    --text2: #C4CDD9;
    --text3: #8B97A6;
    /* Brand & semantic */
    --green: #2BD27B;
    --green-bright: #4FE39B;
    --red: #F4568E;
    --violet: #34D399;
    --violet-light: #6EE7B7;
    --violet-tint: rgba(16,185,129,0.16);
    --glow: rgba(16,185,129,0.16);
    /* Charts */
    --chart-grid: #27303B;
    --chart-axis: #36404D;
    --chart-tick: #8B97A6;
    --chart-baseline: #36404D;
    --chart-tooltip-bg: #151B24;
    --chart-tooltip-border: #36404D;
    --chart-tooltip-text: #F1F5F9;
    /* Scrollbar */
    --scroll-thumb: #36404D;
    --scroll-thumb-hover: #46515F;
    /* Hover tints */
    --hover-tint: rgba(16,185,129,0.05);
    /* Shadows — subtle depth in dark mode */
    --shadow-card: 0 1px 2px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.04) inset, 0 0 0 0.5px rgba(255,255,255,0.03) inset;
    --shadow-elev: 0 24px 60px -12px rgba(0,0,0,0.66), 0 8px 20px -8px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.05) inset;
    /* Header backdrop (translucent so it blends as you scroll) */
    --header-bg: rgba(12,17,23,0.82);
    /* Calendar cell colors — used for empty (no-trade) cells. Need to be subtle in both themes. */
    --calendar-empty-bg: rgba(27,35,46,0.3);
    --calendar-empty-border: rgba(54,64,77,0.45);
    --calendar-cell-bg: rgba(27,35,46,0.5);
    /* Text color INSIDE a colored data-cell. Designed to read well over the green/red tint backgrounds. */
    --cell-text-green: #4FE39B;
    --cell-text-red: #F88FB5;
    /* Inset blocks within cards — like strategy rules, KPI tiles inside a card.
       Dark: very subtle lift from the panel. Light: indistinguishable from panel (pure white). */
    --inset-bg: rgba(255,255,255,0.02);
    --inset-border: rgba(255,255,255,0.05);
    /* Track/scale bar background — used for progress bars, scale meters, slider tracks */
    --track-bg: rgba(255,255,255,0.05);
    /* Pill colors — these change between themes because pills use light tints over the
       theme background, and the text color needs to match the tint density.
       Dark mode: brighter text on muted tints. Light mode: deeper text on washy tints. */
    --pill-zinc-bg: rgba(113,113,122,0.12);
    --pill-zinc-fg: #a1a1ab;
    --pill-zinc-border: rgba(113,113,122,0.3);

(function() {
  var el = document.getElementById('rfx-loader');
  if (!el) return;
  var minTime = 2600; // min display ms so animation completes
  var startTime = Date.now();
  function fadeOut() {
    var elapsed = Date.now() - startTime;
    var wait = Math.max(0, minTime - elapsed);
    setTimeout(function() {
      el.classList.add('fade-out');
      setTimeout(function() { el.style.display = 'none'; }, 650);
    }, wait);
  }
  // Poll for React root being populated
  var check = setInterval(function() {
    var root = document.getElementById('root');
    var elapsed = Date.now() - startTime;
    if (root && root.children.length > 0 && elapsed >= 1800) {
      clearInterval(check); fadeOut();
    } else if (elapsed > 9000) { clearInterval(check); fadeOut(); } // safety
  }, 80);
})();

<script type="text/babel">
const { useState, useEffect, useMemo, useRef, Fragment } = React;
const {
  LineChart, Line, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, CartesianGrid,
  ReferenceLine, Cell, Area, AreaChart, PieChart, Pie, ComposedChart, ScatterChart, Scatter,
  RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, Radar
} = Recharts;

// ═══════════════ BRAND ═══════════════
const BRAND = "RamanFX"; // app name — change to your trading name

// ═══════════════ STRATEGY PLAYBOOK (Supply & Demand + Trendline) ═══════════════
const TIMEFRAME_PAIRS = [
  { htf: 'Monthly', mtf: 'Weekly', ltf: 'Daily' },
  { htf: 'Weekly', mtf: 'Daily', ltf: '4H' },
  { htf: 'Daily', mtf: '4H', ltf: '1H' },

  { htf: '1H', mtf: '15m', ltf: '5m' },
  { htf: '15m', mtf: '5m', ltf: '1m' },
];

// Pre-trade checklist derived from the user's S&D + trendline rules.
const PLAYBOOK_CHECKS = [
  { id: 'departure', label: 'Departure candle is 2x+ the base candle size', group: 'Zone quality' },
  { id: 'fresh', label: 'Zone is WOW / Fresh / PCP near a trendline', group: 'Zone quality' },
  { id: 'tlbreak', label: 'Trendline broken by a long OHLC candle closing the other side', group: 'Trendline' },
  { id: 'removed', label: 'Break removed 2+ opposite zones', group: 'Trendline' },
  { id: 'neartl', label: 'Zone sits under the TL (sell) / over the TL (buy)', group: 'Trendline' },
  { id: 'curve', label: 'Buying in low curve near demand / selling in high curve near supply', group: 'Location' },
  { id: 'htf', label: 'HTF / MTF / LTF trends all match entry direction', group: 'Alignment' },
  { id: 'pair', label: 'Correct timeframe pair identified before the impulse entry', group: 'Alignment' },
  { id: 'cp', label: 'Fewer than 3 CP levels formed (trend still valid)', group: 'Risk' },
  { id: 'sl', label: 'SL set 10–15 pips beyond the valley (buy) / peak (sell)', group: 'Risk' },
  { id: 'confirm', label: 'Confirmation present (everything non-WOW needs it)', group: 'Risk' },
];

const PLAYBOOK_RULES = [
  'Departure candles more than 2× the size of base candles.',
  'Trendline broken with a long OHLC candle closing on the other side, removing 2+ opposite zones.',
  'Buy in low curve — near demand zone.',
  'Sell in high curve — near supply zone.',
  'For buys, stop loss 10–15 pips below the valley.',
  'For sells, stop loss 10–15 pips above the peak.',
  'HTF, MTF and LTF trend must all match direction for entry.',
  'Only take impulse entries after identifying the timeframe pair.',
  'Keep trading zones near the trendline — under it for sell, over it for buy.',
  'All timeframes aligned = high-probability trade.',
  'Only trade WOW zones, Fresh zones, and PCP near the trendlines.',
  'Everything else always needs confirmation.',
  'Stop entering after 3 CP levels have formed — trade may reverse.',
  'Look for PCP levels if entry is missed from the valley or peak.',
];

// ═══════════════ RISK RULES ═══════════════
// Default rules. The user can edit any of these in the Risk Rules page.
const DEFAULT_RISK_RULES = {
  maxDailyLoss: 50,            // $ — hard stop for the day
  maxSingleTradeRisk: 25,      // $ — max risk on any one trade (entry-to-SL distance × $/pt × size)
  maxPositionSizeLots: 0.10,   // lots — hard cap on a single position
  maxDailyTrades: 5,           // count — daily trade cap
  maxConsecutiveLosses: 2,     // count — cooldown trigger
  cooldownMinutes: 30,         // min — mandatory wait after hitting consecutive-loss trigger
  maxSizeIncreaseFactor: 2.0,  // ratio — no single trade larger than 2× your average lot today
  requirePlanBeforeTrade: true,// must run pre-trade gate before entry
};

// Compute today's status against the rules: P&L vs cap, trade count vs cap, consecutive losses, biggest size.
// Inputs: trades = closed trades (already in local time), rules = user's RISK_RULES object.
function computeRiskStatus(trades, rules) {
  const today = new Date();
  const todayKey = `${today.getFullYear()}.${String(today.getMonth() + 1).padStart(2, '0')}.${String(today.getDate()).padStart(2, '0')}`;
  // Trades closed today
  const todayTrades = (trades || []).filter(t => t.closeTime?.startsWith(todayKey));
  // P&L
  let netToday = 0, lossToday = 0;
  for (const t of todayTrades) {
    const n = (t.profit || 0) + (t.commission || 0) + (t.swap || 0);
    netToday += n; if (n < 0) lossToday += Math.abs(n);
  }
  // Consecutive losses (most recent trades, walking back)
  const chrono = [...todayTrades].sort((a, b) => (a.closeTime > b.closeTime ? -1 : 1));
  let consecLosses = 0;
  for (const t of chrono) {
    const n = (t.profit || 0) + (t.commission || 0) + (t.swap || 0);
    if (n < 0) consecLosses++; else break;
  }
  // Biggest position size today
  const biggestSize = todayTrades.reduce((a, t) => Math.max(a, t.volume || 0), 0);
  const avgSize = todayTrades.length ? todayTrades.reduce((a, t) => a + (t.volume || 0), 0) / todayTrades.length : 0;
  // Time since last loss
  const lastLoss = chrono.find(t => ((t.profit || 0) + (t.commission || 0) + (t.swap || 0)) < 0);
  const minsSinceLastLoss = lastLoss ? Math.floor((Date.now() - parseMT5Date(lastLoss.closeTime)) / 60000) : Infinity;
  // Build breach list
  const breaches = [];
  if (lossToday >= rules.maxDailyLoss) breaches.push({ level: 'hard', text: `Max daily loss hit: −$${lossToday.toFixed(2)} (limit −$${rules.maxDailyLoss}).` });
  if (todayTrades.length >= rules.maxDailyTrades) breaches.push({ level: 'hard', text: `Max daily trade count hit: ${todayTrades.length}/${rules.maxDailyTrades}.` });
  if (biggestSize > rules.maxPositionSizeLots) breaches.push({ level: 'hard', text: `Max position size exceeded: ${biggestSize} lot (cap ${rules.maxPositionSizeLots}).` });
  if (consecLosses >= rules.maxConsecutiveLosses && minsSinceLastLoss < rules.cooldownMinutes) {
    breaches.push({ level: 'cooldown', text: `Cooldown active: ${consecLosses} losses in a row, wait ${rules.cooldownMinutes - minsSinceLastLoss} more minute(s).` });
  }
  // Soft warnings
  const warnings = [];
  if (lossToday > 0 && lossToday >= rules.maxDailyLoss * 0.7) warnings.push(`Approaching daily loss limit: −$${lossToday.toFixed(2)} of −$${rules.maxDailyLoss}.`);
  if (todayTrades.length >= rules.maxDailyTrades - 1 && todayTrades.length < rules.maxDailyTrades) warnings.push(`One trade left today (${todayTrades.length}/${rules.maxDailyTrades}).`);
  return {
    todayKey, netToday, lossToday, count: todayTrades.length, consecLosses, biggestSize, avgSize, minsSinceLastLoss,
    breaches, warnings, locked: breaches.length > 0,
  };
}

// ═══════════════ INSIGHTS ENGINE ═══════════════
// Generate human-readable insights for a slice of trades. Three levels:
//   'good'    — green checkmark, something to acknowledge or repeat
//   'caution' — amber dot, pattern worth watching
//   'warning' — red ×, behavior that hurt the period and should be avoided
// Each insight: { level, icon, title, body }. Insights are deduplicated and ordered worst-first.
//
// `scope` is 'day' or 'week'. `windowTrades` is the slice for the analysis window.
// `historyTrades` is the surrounding ~60-day baseline used to detect "unusual" behavior.
function generateDailyInsights(windowTrades, historyTrades, scope, exitDataMap) {
  const out = [];
  if (!windowTrades || windowTrades.length === 0) return out;

  // Net P&L and counts for this window
  const nets = windowTrades.map(t => (t.profit || 0) + (t.commission || 0) + (t.swap || 0));
  const netTotal = nets.reduce((a, c) => a + c, 0);
  const wins = nets.filter(n => n > 0), losses = nets.filter(n => n < 0);
  const winRate = (wins.length / windowTrades.length) * 100;
  const grossProfit = wins.reduce((a, c) => a + c, 0);
  const grossLoss = Math.abs(losses.reduce((a, c) => a + c, 0));
  const avgWin = wins.length ? grossProfit / wins.length : 0;
  const avgLoss = losses.length ? -grossLoss / losses.length : 0;
  const profitFactor = grossLoss > 0 ? grossProfit / grossLoss : (grossProfit > 0 ? Infinity : 0);
  const isGreen = netTotal > 0, isRed = netTotal < 0;

  // Baseline from history (excluding current window). Used for "unusual" comparisons.
  const histNets = (historyTrades || []).map(t => (t.profit || 0) + (t.commission || 0) + (t.swap || 0));
  const histByDay = new Map();
  for (const t of (historyTrades || [])) {
    const k = t.closeTime?.split(' ')[0]; if (!k) continue;
    if (!histByDay.has(k)) histByDay.set(k, { trades: 0, net: 0 });
    const d = histByDay.get(k); d.trades++; d.net += (t.profit || 0) + (t.commission || 0) + (t.swap || 0);
  }
  const histDays = Array.from(histByDay.values());
  const histGreenDays = histDays.filter(d => d.net > 0);
  const histRedDays = histDays.filter(d => d.net < 0);
  const avgTradesPerGreenDay = histGreenDays.length ? histGreenDays.reduce((a, c) => a + c.trades, 0) / histGreenDays.length : 0;
  const avgTradesPerDay = histDays.length ? histDays.reduce((a, c) => a + c.trades, 0) / histDays.length : 0;
  const avgGreenDayNet = histGreenDays.length ? histGreenDays.reduce((a, c) => a + c.net, 0) / histGreenDays.length : 0;
  const avgRedDayLoss = histRedDays.length ? histRedDays.reduce((a, c) => a + c.net, 0) / histRedDays.length : 0;

  // ── INSIGHT 1: Overtrading ──
  // Compare trade count to historical green/red day averages.
  if (avgTradesPerDay > 0 && windowTrades.length > avgTradesPerDay * 1.5 && windowTrades.length >= 4) {
    const pct = Math.round(((windowTrades.length / avgTradesPerDay) - 1) * 100);
    out.push({
      level: isRed ? 'warning' : 'caution',
      icon: 'ico0',
      title: scope === 'day' ? 'Unusual number of trades' : 'Heavy trading week',
      body: `You placed ${windowTrades.length} trade${windowTrades.length !== 1 ? 's' : ''} ${scope === 'day' ? 'today' : 'this week'} — about ${pct}% over your ${histDays.length}-day average (${avgTradesPerDay.toFixed(1)}/day).` + (isRed ? ' And it hurt your P&L.' : ''),
    });
  }

  // ── INSIGHT 2: Green day above average ──
  if (scope === 'day' && isGreen && avgGreenDayNet > 0 && netTotal > avgGreenDayNet * 1.3) {
    out.push({
      level: 'good',
      icon: 'good',
      title: 'Above-average green day',
      body: `Net ${fmtMoney(netTotal, true)} — about ${Math.round(((netTotal / avgGreenDayNet) - 1) * 100)}% above your avg green day (${fmtMoney(avgGreenDayNet)}). Look back at what went right and try to repeat.`,
    });
  }

  // ── INSIGHT 3: Concentration risk / repeated symbol ──
  const symCounts = new Map();
  for (const t of windowTrades) symCounts.set(t.symbol, (symCounts.get(t.symbol) || 0) + 1);
  const dominantSym = Array.from(symCounts.entries()).sort((a, b) => b[1] - a[1])[0];
  if (dominantSym && dominantSym[1] >= 4 && (dominantSym[1] / windowTrades.length) >= 0.6) {
    const symTrades = windowTrades.filter(t => t.symbol === dominantSym[0]);
    const symNet = symTrades.reduce((a, c) => a + (c.profit || 0) + (c.commission || 0) + (c.swap || 0), 0);
    out.push({
      level: symNet < 0 ? 'warning' : 'caution',
      icon: '◉',
      title: 'Concentration in one symbol',
      body: `${dominantSym[1]} of ${windowTrades.length} trades were ${dominantSym[0]} (net ${fmtMoney(symNet, true)}). Heavy concentration narrows your edge — one bad setup hits harder.`,
    });
  }

  // ── INSIGHT 4: Position size escalation ──
  // Were any trades much bigger than the period's average?
  const vols = windowTrades.map(t => t.volume || 0).filter(v => v > 0);
  if (vols.length >= 3) {
    const avgVol = vols.reduce((a, c) => a + c, 0) / vols.length;
    const maxVol = Math.max(...vols);
    if (maxVol > avgVol * 2.5) {
      const bigTrades = windowTrades.filter(t => (t.volume || 0) > avgVol * 2);
      const bigNet = bigTrades.reduce((a, c) => a + (c.profit || 0) + (c.commission || 0) + (c.swap || 0), 0);
      out.push({
        level: bigNet < 0 ? 'warning' : 'caution',
        icon: '↑',
        title: 'Size escalation detected',
        body: `Your largest position was ${maxVol.toFixed(2)} lot — about ${(maxVol / avgVol).toFixed(1)}× your average for this ${scope} (${avgVol.toFixed(3)} lot). Those oversized trades netted ${fmtMoney(bigNet, true)}.`,
      });
    }
  }

  // ── INSIGHT 5: Consecutive losses (chronological) ──
  const chrono = [...windowTrades].sort((a, b) => (a.closeTime || '').localeCompare(b.closeTime || ''));
  let maxStreak = 0, curStreak = 0;
  for (const t of chrono) {
    const n = (t.profit || 0) + (t.commission || 0) + (t.swap || 0);
    if (n < 0) { curStreak++; maxStreak = Math.max(maxStreak, curStreak); } else curStreak = 0;
  }
  if (maxStreak >= 3) {
    out.push({
      level: 'warning',
      icon: '↓↓',
      title: `${maxStreak} losses in a row`,
      body: `You had a streak of ${maxStreak} consecutive losing trades. The right move during streaks is to step away — keep trading and you risk turning a bad run into a blowup.`,
    });
  }

  // ── INSIGHT 6: Win rate but bad payoff (avg loss > avg win) ──
  if (wins.length >= 2 && losses.length >= 2 && Math.abs(avgLoss) > avgWin * 1.5) {
    out.push({
      level: 'caution',
      icon: 'balance',
      title: 'Losses are bigger than wins',
      body: `Avg win ${fmtMoney(avgWin)} vs avg loss ${fmtMoney(avgLoss)}. Even at ${winRate.toFixed(0)}% win rate, this ratio means small slips erase good runs. Either cut losers faster or hold winners longer.`,
    });
  }

  // ── INSIGHT 7: Strong profit factor ──
  if (windowTrades.length >= 4 && profitFactor >= 2 && profitFactor !== Infinity) {
    out.push({
      level: 'good',
      icon: 'good',
      title: 'Strong profit factor',
      body: `Profit factor of ${profitFactor.toFixed(2)} — you made $${profitFactor.toFixed(2)} for every $1 lost. This is what good selectivity looks like; remember what setups produced it.`,
    });
  }

  // ── INSIGHT 8: All-wins day ──
  if (scope === 'day' && windowTrades.length >= 3 && losses.length === 0) {
    out.push({
      level: 'good',
      icon: 'good',
      title: 'Clean session',
      body: `${windowTrades.length} trades, zero losses. That's discipline showing. The temptation now is to ride momentum into another trade — resist that and bank the win.`,
    });
  }

  // ── INSIGHT 9: Off-hours trading ──
  // Were any trades opened outside your "best" historical window?
  const histHourPnL = new Map();
  for (const t of (historyTrades || [])) {
    const dt = parseMT5Date(t.openTime); if (!dt) continue;
    const h = dt.getHours();
    if (!histHourPnL.has(h)) histHourPnL.set(h, []);
    histHourPnL.get(h).push((t.profit || 0) + (t.commission || 0) + (t.swap || 0));
  }
  // Find hours where the window had trades but the historical average for that hour is negative.
  const badHourTrades = [];
  for (const t of windowTrades) {
    const dt = parseMT5Date(t.openTime); if (!dt) continue;
    const h = dt.getHours();
    const histList = histHourPnL.get(h) || [];
    if (histList.length >= 4) {
      const avg = histList.reduce((a, c) => a + c, 0) / histList.length;
      if (avg < 0) badHourTrades.push({ hour: h, net: (t.profit || 0) + (t.commission || 0) + (t.swap || 0) });
    }
  }
  if (badHourTrades.length >= 2) {
    const hours = [...new Set(badHourTrades.map(b => `${String(b.hour).padStart(2, '0')}:00`))].slice(0, 3).join(', ');
    out.push({
      level: 'caution',
      icon: '◷',
      title: 'Trading historically weak hours',
      body: `${badHourTrades.length} of your trades opened during hours that have lost money for you on average (${hours}). Consider sticking to your high-performance windows.`,
    });
  }

  // ── INSIGHT 10: Day P&L only — giving away profits within the day ──
  // Sort trades chronologically and track running cumulative P&L. If peak was significantly higher than final, flag.
  if (scope === 'day' && chrono.length >= 3) {
    let running = 0, peak = 0;
    for (const t of chrono) { running += (t.profit || 0) + (t.commission || 0) + (t.swap || 0); if (running > peak) peak = running; }
    if (peak > 0 && netTotal > 0 && peak > netTotal * 1.4 && (peak - netTotal) > 20) {
      const pct = Math.round(((peak - netTotal) / peak) * 100);
      out.push({
        level: 'caution',
        icon: '⤵',
        title: 'Giving away profits',
        body: `At one point you were up ${fmtMoney(peak)}, but closed at ${fmtMoney(netTotal)} — gave back ${pct}% of the day's peak. Consider locking partials at key levels instead of riding everything to stop.`,
      });
    } else if (peak > 0 && netTotal < 0 && peak > 50) {
      out.push({
        level: 'warning',
        icon: '⤵',
        title: 'Turned a green day red',
        body: `You were up ${fmtMoney(peak)} at one point but closed ${fmtMoney(netTotal, true)}. The biggest tell of revenge or over-trading is this exact shape: green then red.`,
      });
    }
  }

  // ── INSIGHT 11: Tag-based pattern (mistakes catalogued) ──
  // We don't have access to notes here — that integration happens at call site if needed.

  // ── INSIGHT 12: Process discipline (closed positive without notes-tagged-mistakes) ──
  // Also requires notes; skipped at this layer.

  // ── INSIGHT 13: Left money on the table (requires MAE/MFE CSV data) ──
  // This is the insight we couldn't compute before — needed real MFE excursion data.
  // For winning trades: how much of MFE did we capture? For trades that turned from win
  // to loss: that's the headline failure mode.
  if (exitDataMap && Object.keys(exitDataMap).length > 0) {
    let totalMfe = 0, totalCaptured = 0, captureCount = 0;
    let turnedLossCount = 0, turnedLossMfeDol = 0;
    let leftOnTableDol = 0;
    for (const t of windowTrades) {
      const ed = exitDataMap[t.id]; if (!ed) continue;
      const mfe = ed.mfe, profitPts = ed.profitPts, dpp = ed.dollarPerPt;
      if (mfe == null || profitPts == null) continue;
      if (mfe > 0) {
        totalMfe += mfe;
        if (profitPts > 0) {
          totalCaptured += profitPts; captureCount++;
          if (dpp != null) leftOnTableDol += (mfe - profitPts) * dpp;
        }
        if (mfe > 50 && profitPts < 0) {
          turnedLossCount++;
          if (dpp != null) turnedLossMfeDol += mfe * dpp;
        }
      }
    }
    if (turnedLossCount > 0) {
      out.push({
        level: 'warning',
        icon: '⤵',
        title: `${turnedLossCount} winner${turnedLossCount !== 1 ? 's' : ''} turned into loss${turnedLossCount !== 1 ? 'es' : ''}`,
        body: `${turnedLossCount} trade${turnedLossCount !== 1 ? 's' : ''} ${scope === 'day' ? 'today' : 'this week'} ${turnedLossCount !== 1 ? 'were' : 'was'} in profit at some point (combined peak ${turnedLossMfeDol > 0 ? '+$' + turnedLossMfeDol.toFixed(2) : turnedLossMfeDol.toLocaleString() + 'pt'}) but held until the stop hit. Move stop to breakeven once you're up meaningfully — don't give it all back.`,
      });
    }
    if (captureCount >= 2 && totalMfe > 0) {
      const captureRate = (totalCaptured / totalMfe) * 100;
      if (captureRate < 40 && leftOnTableDol > 1) {
        out.push({
          level: 'caution',
          icon: 'exit',
          title: 'Closing winners too early',
          body: `On your ${captureCount} winners ${scope === 'day' ? 'today' : 'this period'}, you only captured ${captureRate.toFixed(0)}% of the peak (left $${leftOnTableDol.toFixed(2)} on the table). Either trail your stop or scale out — but stop cutting clean trends.`,
        });
      } else if (captureRate >= 75) {
        out.push({
          level: 'good',
          icon: 'good',
          title: 'Strong profit-taking',
          body: `You captured ${captureRate.toFixed(0)}% of available peak across ${captureCount} winners. That's disciplined exit execution.`,
        });
      }
    }
  }

  // ── Sort: warnings first, then cautions, then good news ──
  const order = { warning: 0, caution: 1, good: 2 };
  out.sort((a, b) => order[a.level] - order[b.level]);
  return out;
}

// ═══════════════ MAE/MFE CSV PARSER ═══════════════
// Parses the CSV exported by the MQL5 script #72326 (Advanced Trade History Exporter)
// Source: https://www.mql5.com/en/code/72326
// Returns a map: { [positionId]: { mae, mfe, durationHrs, profitPts, t30m, t1h, t4h, t12h, t1d, t1w, t1wMin } }
// All numbers in POINTS (the script's unit). n/a values become null.
function parseExitCSV(text) {
  const out = {};
  if (!text) return out;
  // Normalize line endings, split, drop empty lines
  const lines = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n').filter(l => l.trim().length > 0);
  if (lines.length < 2) return out;
  // Parse header — handle the script's exact column names case-sensitively
  const headers = lines[0].split(',').map(h => h.trim());
  const idx = (name) => headers.findIndex(h => h === name);
  const iPos = idx('Position ID') >= 0 ? idx('Position ID') : idx('Ticket'); // MT5='Position ID', MT4='Ticket'
  const iSym = idx('Symbol');
  const iType = idx('Type');
  const iOpen = idx('Open Time');
  const iClose = idx('Close Time');
  const iDur = idx('Duration (Hrs)');
  const iProfitDol = idx('Profit ($)');
  const iProfitPts = idx('Profit (Pts)');
  const iMAE = idx('MAE (Pts)');
  const iMFE = idx('MFE (Pts)');
  const iT30 = idx('T+30m (Pts)');
  const iT1h = idx('T+1h (Pts)');
  const iT4h = idx('T+4h (Pts)');
  const iT12h = idx('T+12h (Pts)');
  const iT1d = idx('T+1d (Pts)');
  const iT1w = idx('T+1w (Pts)');
  const iT1wMin = idx('T+1w MIN (Pts)');
  if (iPos < 0) return out;
  const num = (s) => {
    if (s == null) return null;
    const t = String(s).trim();
    if (t === '' || t.toLowerCase() === 'n/a') return null;
    const n = parseFloat(t);
    return isNaN(n) ? null : n;
  };
  // Per-position aggregator. Multiple CSV rows can share a Position ID — this happens whenever
  // a position closed in partial fills (scale-outs, multiple TPs, partial manual closes). The
  // MQL5 script #72326 reports excursion data PER FILL, not per position. To get a position-level
  // picture we must merge across rows:
  //   • Profit ($) and Profit (Pts) — SUM across fills (each fill closed part of the position)
  //   • MFE — MAX across fills (best peak any fill saw is the position's peak)
  //   • MAE — MIN across fills (worst drawdown any fill saw)
  //   • Forward-time (T+30m..T+1d) — MAX (all fills share the same open time so they should
  //     report identical numbers; we take max to be tolerant of script quirks)
  //   • durationHrs — MAX (the position lived until its last fill)
  //   • openTime — earliest, closeTime — latest
  // After aggregation we sanity-check: if MFE somehow ends up below profit (script bug, partial-
  // fill timing quirk, or a fill closed in profit beyond the recorded peak), we flag it suspect.
  for (let i = 1; i < lines.length; i++) {
    const cells = lines[i].split(',').map(c => c.trim());
    if (cells.length < headers.length) continue;
    const pos = cells[iPos];
    if (!pos) continue;
    const row = {
      symbol: cells[iSym] || null,
      type: cells[iType] ? cells[iType].toLowerCase() : null,
      openTime: cells[iOpen] || null,
      closeTime: cells[iClose] || null,
      durationHrs: num(cells[iDur]),
      profitDol: iProfitDol >= 0 ? num(cells[iProfitDol]) : null,
      profitPts: num(cells[iProfitPts]),
      mae: num(cells[iMAE]),
      mfe: num(cells[iMFE]),
      t30m: num(cells[iT30]),
      t1h: num(cells[iT1h]),
      t4h: num(cells[iT4h]),
      t12h: num(cells[iT12h]),
      t1d: num(cells[iT1d]),
      t1w: num(cells[iT1w]),
      t1wMin: num(cells[iT1wMin]),
    };
    if (!out[pos]) {
      out[pos] = { positionId: pos, fillCount: 1, ...row };
      continue;
    }
    // Merge with existing
    const e = out[pos];
    e.fillCount = (e.fillCount || 1) + 1;
    // Sum the realized values
    if (row.profitDol != null) e.profitDol = (e.profitDol || 0) + row.profitDol;
    if (row.profitPts != null) e.profitPts = (e.profitPts || 0) + row.profitPts;
    // MAX for MFE and forward windows (best peak / best forward outcome)
    const takeMax = (a, b) => a == null ? b : b == null ? a : Math.max(a, b);
    e.mfe = takeMax(e.mfe, row.mfe);
    e.t30m = takeMax(e.t30m, row.t30m);
    e.t1h = takeMax(e.t1h, row.t1h);
    e.t4h = takeMax(e.t4h, row.t4h);
    e.t12h = takeMax(e.t12h, row.t12h);
    e.t1d = takeMax(e.t1d, row.t1d);
    e.t1w = takeMax(e.t1w, row.t1w);
    e.durationHrs = takeMax(e.durationHrs, row.durationHrs);
    // MIN for MAE (worst drawdown — most negative)
    const takeMin = (a, b) => a == null ? b : b == null ? a : Math.min(a, b);
    e.mae = takeMin(e.mae, row.mae);
    e.t1wMin = takeMin(e.t1wMin, row.t1wMin);
    // Earliest open, latest close
    if (row.openTime && (!e.openTime || row.openTime < e.openTime)) e.openTime = row.openTime;
    if (row.closeTime && (!e.closeTime || row.closeTime > e.closeTime)) e.closeTime = row.closeTime;
  }
  // Sanity check: if MFE is still below realized profit after aggregation, the data is suspect.
  // This can happen if the script's excursion sampling missed the actual peak, or if there are
  // partial fills the script didn't capture for some reason. Mark the entry so the UI can warn.
  for (const k in out) {
    const e = out[k];
    if (e.mfe != null && e.profitPts != null && e.mfe < e.profitPts) {
      e.suspectMFE = true;
      // Repair: the true peak is at LEAST the realized profit (you closed there).
      e.mfe = e.profitPts;
    }
    if (e.mae != null && e.profitPts != null && e.mae > Math.min(0, e.profitPts)) {
      // MAE should be ≤ 0 AND ≤ realized profit. If MAE > realized loss, similar repair.
      e.suspectMAE = true;
      e.mae = Math.min(0, e.profitPts);
    }
  }
  // Second pass: compute $-per-point for every position. Primary source: that position's own
  // profit$ / profitPts ratio (most accurate because volume + symbol are baked in). Fallback:
  // symbol-level median ratio, used only when this position closed at exactly 0 points.
  const symbolRatios = {};
  for (const k in out) {
    const e = out[k];
    if (e.profitDol != null && e.profitPts != null && e.profitPts !== 0) {
      const r = e.profitDol / e.profitPts;
      if (isFinite(r) && r > 0) {
        if (!symbolRatios[e.symbol]) symbolRatios[e.symbol] = [];
        symbolRatios[e.symbol].push(r);
      }
    }
  }
  const symbolMedian = {};
  for (const s in symbolRatios) {
    const arr = symbolRatios[s].sort((a, b) => a - b);
    symbolMedian[s] = arr[Math.floor(arr.length / 2)];
  }
  for (const k in out) {
    const e = out[k];
    if (e.profitDol != null && e.profitPts != null && e.profitPts !== 0) {
      e.dollarPerPt = Math.abs(e.profitDol / e.profitPts);
    } else if (symbolMedian[e.symbol]) {
      e.dollarPerPt = symbolMedian[e.symbol];
    } else {
      e.dollarPerPt = null;
    }
  }
  return out;
}

// Convert a points value to dollars using a position's dollarPerPt. Returns null if no ratio.
function ptsToDollars(pts, dollarPerPt) {
  if (pts == null || dollarPerPt == null) return null;
  return pts * dollarPerPt;
}

// ═══════════════ EXIT ANALYSIS HELPERS ═══════════════
// Given a trade with exit data, compute per-trade insights.
// Returns an array of plain-English bullets explaining what MAE/MFE say about THIS trade,
// and what the right exit would have looked like.
function generateExitInsights(trade, exitData) {
  if (!exitData) return [];
  const { mae, mfe, profitPts, t30m, t1h, t4h, t12h, t1d, dollarPerPt, profitDol } = exitData;
  if (mae == null && mfe == null) return [];
  const insights = [];
  // Helper: convert pts to dollars using this position's ratio; falls back to pts if no ratio
  const toD = (pts) => pts == null ? null : (dollarPerPt != null ? pts * dollarPerPt : pts);
  // Helper: format a $ value with sign — minus/plus prefix and 2 decimals
  const fmtD = (d) => d == null ? '—' : (d >= 0 ? '+$' : '-$') + Math.abs(d).toFixed(2);
  // Use the trade's actual closed P&L from the parent record if available (more accurate than
  // the CSV's profitDol because the journal includes commissions+swap)
  const tradeNet = (trade.profit || 0) + (trade.commission || 0) + (trade.swap || 0);
  const closedDol = tradeNet || profitDol || 0;
  const closedWin = closedDol > 0;
  const mfeDol = toD(mfe);
  const maeDol = toD(mae);
  // Capture rate
  if (mfe != null && mfe > 0) {
    const captureRate = (profitPts / mfe) * 100;
    if (closedWin) {
      if (captureRate >= 80) {
        insights.push({ level: 'good', title: 'Strong exit',
          body: `You captured ${captureRate.toFixed(0)}% of this trade's peak (it was up ${fmtD(mfeDol)} at one point, you took ${fmtD(closedDol)}). This is what good profit-taking looks like — repeat the setup that allowed you to hold this long.` });
      } else if (captureRate >= 50) {
        insights.push({ level: 'caution', title: 'Decent exit, room for more',
          body: `You captured ${captureRate.toFixed(0)}% of the peak (was up ${fmtD(mfeDol)}, closed at ${fmtD(closedDol)} — left ${fmtD((mfeDol||0) - closedDol)} on the table). A trailing stop or partial scale-out would have let more of that run.` });
      } else {
        insights.push({ level: 'warning', title: 'Closed too early',
          body: `You only kept ${captureRate.toFixed(0)}% of this trade's peak. It was up ${fmtD(mfeDol)} but you exited with just ${fmtD(closedDol)}. You called the direction right but didn't let the trade work.` });
      }
    } else if (closedDol < 0) {
      // You were up, then closed in loss
      const breakevenAt = Math.round((mfeDol || 0) * 0.4 * 100) / 100;
      insights.push({ level: 'warning', title: 'Winner turned into loser',
        body: `This trade was up ${fmtD(mfeDol)} at one point. You closed it at ${fmtD(closedDol)} — you gave back the entire +${(mfeDol||0).toFixed(2)} unrealized profit and then took an additional ${fmtD(closedDol)} loss on top. Either move stop to breakeven once you're up around +$${breakevenAt.toFixed(2)}, or take partial profits sooner.` });
    }
  }
  // MAE analysis
  if (mae != null && mae < 0 && maeDol != null) {
    if (closedWin && Math.abs(maeDol) > closedDol * 1.5) {
      insights.push({ level: 'caution', title: 'Bumpy ride to win',
        body: `Before this winner paid out, it was down ${fmtD(maeDol)} — more than your eventual gain of ${fmtD(closedDol)}. Your entry timing was off — consider waiting for a better confirmation level, or you might be entering before the setup completes.` });
    } else if (!closedWin && maeDol < -10) {
      insights.push({ level: 'caution', title: 'Trade went against you immediately',
        body: `Worst drawdown was ${fmtD(maeDol)} against you. The market told you fast — your entry zone wasn't valid.` });
    }
  }
  // Forward-time analysis — convert each to dollars
  const forward = [
    { label: '30 minutes', val: t30m, dol: toD(t30m) },
    { label: '1 hour', val: t1h, dol: toD(t1h) },
    { label: '4 hours', val: t4h, dol: toD(t4h) },
    { label: '12 hours', val: t12h, dol: toD(t12h) },
    { label: '1 day', val: t1d, dol: toD(t1d) },
  ].filter(f => f.val != null);
  if (forward.length > 0 && closedDol < 0) {
    const wouldHaveWon = forward.filter(f => f.val > 0);
    if (wouldHaveWon.length > 0) {
      const best = wouldHaveWon.reduce((a, b) => a.val > b.val ? a : b);
      insights.push({ level: 'caution', title: `Patience would have helped`,
        body: `If you had held this trade ${best.label} longer, it would have been ${fmtD(best.dol)} instead of ${fmtD(closedDol)}. This setup may have needed more time to mature.` });
    } else {
      const allWorse = forward.every(f => f.val < profitPts);
      if (allWorse) {
        const t30mDol = toD(t30m), t1hDol = toD(t1h), t4hDol = toD(t4h);
        insights.push({ level: 'good', title: 'Right call to cut',
          body: `Holding longer would have hurt more at every interval (at +30m: ${fmtD(t30mDol)}, at +1h: ${fmtD(t1hDol)}, at +4h: ${fmtD(t4hDol)}). Cutting the loss was the correct decision.` });
      }
    }
  }
  if (forward.length > 0 && closedWin && t1d != null) {
    const t1dDol = toD(t1d);
    if (t1d > profitPts * 1.5) {
      insights.push({ level: 'caution', title: 'Could have ridden further',
        body: `One day after your entry, the trade was worth ${fmtD(t1dDol)} — ${((t1d/profitPts - 1)*100).toFixed(0)}% more than what you took (${fmtD(closedDol)}). Setups that move this clean often have more in them; consider a runner.` });
    } else if (t1d < profitPts * 0.5) {
      insights.push({ level: 'good', title: 'Good exit before reversal',
        body: `One day later the trade had given back to ${fmtD(t1dDol)}. You exited near the peak — that's skill, not luck. Note the timing.` });
    }
  }
  return insights;
}

// Aggregate exit-quality stats across all trades that have exit data
function computeExitStats(enrichedTrades, exitDataMap) {
  let total = 0, withMFE = 0, wonByMFE = 0, totalMFE = 0, totalProfit = 0;
  let giveBackCount = 0, giveBackPts = 0;
  let turnedLossCount = 0, turnedLossDollars = 0;
  let captureRates = [];
  // Forward-time aggregates
  let giveBackDollars = 0;
  const forwardSums = { actual: 0, t30m: 0, t1h: 0, t4h: 0, t12h: 0, t1d: 0 };
  const forwardCounts = { actual: 0, t30m: 0, t1h: 0, t4h: 0, t12h: 0, t1d: 0 };
  const forwardSumsDol = { actual: 0, t30m: 0, t1h: 0, t4h: 0, t12h: 0, t1d: 0 };
  const bySymbol = {};
  const scatterData = []; // for MFE-vs-Profit chart (now in dollars)
  for (const t of enrichedTrades) {
    const ed = exitDataMap[t.id];
    if (!ed) continue;
    total++;
    const profitPts = ed.profitPts ?? 0;
    const mfe = ed.mfe;
    const mae = ed.mae;
    const dpp = ed.dollarPerPt; // dollar-per-point ratio for this position
    if (!bySymbol[t.symbol]) bySymbol[t.symbol] = { count: 0, mfeSum: 0, profitSum: 0, mfeSumDol: 0, profitSumDol: 0, giveBack: 0, turnedLoss: 0, dollars: 0, giveBackDol: 0 };
    bySymbol[t.symbol].count++;
    bySymbol[t.symbol].dollars += t.net;
    if (mfe != null && mfe > 0) {
      withMFE++;
      totalMFE += mfe;
      totalProfit += profitPts;
      bySymbol[t.symbol].mfeSum += mfe;
      bySymbol[t.symbol].profitSum += profitPts;
      const mfeDol = dpp != null ? mfe * dpp : null;
      if (mfeDol != null) bySymbol[t.symbol].mfeSumDol += mfeDol;
      if (profitPts > 0) {
        wonByMFE++;
        captureRates.push((profitPts / mfe) * 100);
      }
      // True give-back: winner that took less than its peak. Counted in dollars and trade count.
      // Losers-that-were-up are excluded from this metric — they belong to the "turned-loss" stat
      // because the MFE was unrealized, not realized profit they left behind.
      if (profitPts > 0 && profitPts < mfe) {
        giveBackCount++;
        giveBackPts += (mfe - profitPts);
        bySymbol[t.symbol].giveBack++;
        if (dpp != null) {
          const gb = (mfe - profitPts) * dpp;
          giveBackDollars += gb;
          bySymbol[t.symbol].giveBackDol += gb;
        }
      }
      if (mfe > 50 && profitPts < 0) {
        turnedLossCount++;
        turnedLossDollars += t.net;
        bySymbol[t.symbol].turnedLoss++;
      }
      // Scatter data uses dollars when available, else points (fallback labelled in UI)
      scatterData.push({
        id: t.id, symbol: t.symbol,
        mfe, profit: profitPts, mae: mae || 0, net: t.net,
        mfeDol: dpp != null ? mfe * dpp : null,
        profitDol: dpp != null ? profitPts * dpp : null,
        maeDol: dpp != null && mae != null ? mae * dpp : null,
      });
    }
    // Forward sums in points
    forwardSums.actual += profitPts; forwardCounts.actual++;
    if (dpp != null) forwardSumsDol.actual += profitPts * dpp;
    for (const k of ['t30m', 't1h', 't4h', 't12h', 't1d']) {
      if (ed[k] != null) {
        forwardSums[k] += ed[k];
        forwardCounts[k]++;
        if (dpp != null) forwardSumsDol[k] += ed[k] * dpp;
      }
    }
  }
  const avgCapture = captureRates.length ? captureRates.reduce((a, b) => a + b, 0) / captureRates.length : 0;
  const medianCapture = captureRates.length ? [...captureRates].sort((a, b) => a - b)[Math.floor(captureRates.length / 2)] : 0;
  const symbolStats = Object.entries(bySymbol).map(([sym, s]) => ({
    symbol: sym,
    count: s.count,
    captureRate: s.mfeSum > 0 ? (s.profitSum / s.mfeSum) * 100 : 0,
    turnedLoss: s.turnedLoss,
    giveBack: s.giveBack,
    dollars: s.dollars,
    giveBackDol: s.giveBackDol,
  })).sort((a, b) => b.count - a.count);
  return {
    total, withMFE, wonByMFE,
    avgCapture, medianCapture,
    giveBackCount, giveBackPts, giveBackDollars,
    turnedLossCount, turnedLossDollars,
    forwardSums, forwardCounts, forwardSumsDol,
    symbolStats, scatterData,
  };
}

// ═══════════════ MT5 PARSER ═══════════════

// Convert an MT5 date string "YYYY.MM.DD HH:MM:SS" from broker timezone (UTC+brokerOffsetHours) to browser local time.
// Returns a new MT5-format string in local time. Empty/invalid input is returned unchanged.
function convertMT5DateString(s, brokerOffsetHours) {
  if (!s || typeof s !== 'string') return s;
  const parts = s.trim().split(' ');
  if (parts.length < 2) return s;
  const dParts = parts[0].split('.');
  const tParts = parts[1].split(':');
  if (dParts.length !== 3 || tParts.length < 2) return s;
  const Y = +dParts[0], M = +dParts[1], D = +dParts[2];
  const h = +tParts[0], m = +tParts[1], sec = +(tParts[2] || 0);
  if ([Y, M, D, h, m].some(isNaN)) return s;
  // Treat input as broker-clock time; compute true UTC moment, then format as local.
  const utcMs = Date.UTC(Y, M - 1, D, h, m, sec) - brokerOffsetHours * 3600 * 1000;
  const dt = new Date(utcMs);
  const p = n => String(n).padStart(2, '0');
  return `${dt.getFullYear()}.${p(dt.getMonth() + 1)}.${p(dt.getDate())} ${p(dt.getHours())}:${p(dt.getMinutes())}:${p(dt.getSeconds())}`;
}

async function parseMT5File(file, brokerOffsetHours = 3) {
  const buffer = await file.arrayBuffer();
  const bytes = new Uint8Array(buffer);
  let html;
  if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) html = new TextDecoder('utf-16le').decode(buffer);
  else if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) html = new TextDecoder('utf-16be').decode(buffer);
  else {
    let nullCount = 0;
    for (let i = 1; i < Math.min(200, bytes.length); i += 2) if (bytes[i] === 0) nullCount++;
    html = nullCount > 50 ? new TextDecoder('utf-16le').decode(buffer) : new TextDecoder('utf-8').decode(buffer);
  }
  const doc = new DOMParser().parseFromString(html, 'text/html');
  let accountId = null, accountName = null, broker = null;
  const ths = doc.querySelectorAll('th');
  for (let i = 0; i < ths.length; i++) {
    const t = ths[i].textContent.trim();
    if (t === 'Account:' && ths[i + 1]) {
      const acc = ths[i + 1].textContent.trim();
      const m = acc.match(/^(\d+)/); if (m) accountId = m[1];
      const m2 = acc.match(/,\s*([^,]+?)-MT/); if (m2) broker = m2[1].trim();
    }
    if (t === 'Name:' && ths[i + 1]) accountName = ths[i + 1].textContent.trim();
  }
  const rows = Array.from(doc.querySelectorAll('tr'));
  let section = null; const positions = []; const openPositions = []; const workingOrders = []; const deposits = [];
  const summary = {};
  const KNOWN_SECTIONS = ['Positions', 'Orders', 'Deals', 'Open Positions', 'Working Orders'];

  for (const tr of rows) {
    // Section header: a single <th> with the section name, no data cells
    const headerB = tr.querySelector('th div b');
    if (headerB && tr.querySelectorAll('td').length === 0) {
      const name = headerB.textContent.trim();
      if (KNOWN_SECTIONS.includes(name)) { section = name; continue; }
    }
    if (tr.getAttribute('bgcolor') === '#E5F0FC') continue; // column header rows

    const allTds = Array.from(tr.children).filter(c => c.tagName === 'TD');
    const visible = allTds.filter(td => !(td.className || '').includes('hidden'));
    const txt = (i) => (visible[i]?.textContent || '').trim().replace(/\u00A0/g, ' ');
    const num = (i) => { const v = parseFloat(txt(i).replace(/[\s,]/g, '')); return isNaN(v) ? 0 : v; };

    // Account summary block (label -> <b>value</b> pairs), appears after Working Orders
    const rowText = tr.textContent;
    if (/(Balance|Equity|Floating P\/L|Free Margin|Margin Level|Credit Facility):/.test(rowText) && allTds.length) {
      for (let i = 0; i < allTds.length; i++) {
        const label = allTds[i].textContent.trim().replace(/\u00A0/g, ' ').replace(':', '');
        if (/^(Balance|Equity|Floating P\/L|Free Margin|Margin|Margin Level|Credit Facility)$/i.test(label)) {
          for (let j = i + 1; j < allTds.length; j++) {
            const b = allTds[j].querySelector('b');
            if (b) { summary[label] = b.textContent.trim().replace(/\u00A0/g, ' '); break; }
          }
        }
      }
    }

    if (section === 'Positions') {
      if (visible.length < 13) continue;
      const id = txt(1);
      if (!/^\d+$/.test(id)) continue;
      positions.push({
        id, account: accountId || 'default',
        openTime: convertMT5DateString(txt(0), brokerOffsetHours), symbol: txt(2), type: txt(3).toLowerCase(),
        volume: num(4), openPrice: num(5), sl: txt(6), tp: txt(7),
        closeTime: convertMT5DateString(txt(8), brokerOffsetHours), closePrice: num(9), commission: num(10), swap: num(11), profit: num(12),
      });
    }

    else if (section === 'Open Positions') {
      // openTime[0] id[1] symbol[2] type[3] volume[4] openPrice[5] sl[6] tp[7] curPrice[8] swap[9] floatProfit[10]
      if (visible.length < 10) continue;
      const id = txt(1);
      if (!/^\d+$/.test(id)) continue;
      openPositions.push({
        id, account: accountId || 'default',
        openTime: convertMT5DateString(txt(0), brokerOffsetHours), symbol: txt(2), type: txt(3).toLowerCase(),
        volume: num(4), openPrice: num(5), sl: txt(6), tp: txt(7),
        currentPrice: num(8), swap: num(9), floatingPnL: num(10),
      });
    }

    else if (section === 'Working Orders') {
      // openTime[0] id[1] symbol[2] type[3] volume("0.01 / 0")[4] price[5] sl[6] tp[7] expiry[8] state[9]
      if (visible.length < 9) continue;
      const id = txt(1);
      if (!/^\d+$/.test(id)) continue;
      const volParts = txt(4).split('/').map(s => s.trim());
      workingOrders.push({
        id, account: accountId || 'default',
        openTime: convertMT5DateString(txt(0), brokerOffsetHours), symbol: txt(2), type: txt(3).toLowerCase(),
        volume: parseFloat(volParts[0]) || 0,
        price: num(5), sl: txt(6), tp: txt(7),
        expiry: txt(8), state: (txt(9) || 'placed').toLowerCase(),
      });
    }

    else if (section === 'Deals') {
      // capture deposits/withdrawals: type column == 'balance'
      if (visible.length < 6) continue;
      const dealType = txt(3).toLowerCase();
      if (dealType === 'balance') {
        deposits.push({ time: convertMT5DateString(txt(0), brokerOffsetHours), amount: num(visible.length - 3), balance: num(visible.length - 2), comment: txt(visible.length - 1) });
      }
    }
  }

  const parseNum = (s) => { if (s == null) return null; const v = parseFloat(String(s).replace(/[^0-9.\-]/g, '')); return isNaN(v) ? null : v; };
  const account = {
    balance: parseNum(summary['Balance']),
    equity: parseNum(summary['Equity']),
    floatingPnL: parseNum(summary['Floating P/L']),
    freeMargin: parseNum(summary['Free Margin']),
    margin: parseNum(summary['Margin']),
    marginLevel: summary['Margin Level'] || null,
    credit: parseNum(summary['Credit Facility']),
  };

  return { positions, openPositions, workingOrders, deposits, account, accountId: accountId || 'default', accountName: accountName || 'Account', broker: broker || 'MT5' };
}

// ═══════════════ MT4 PARSER ═══════════════
async function parseMT4File(file, brokerOffsetHours = 2) {
  const buffer = await file.arrayBuffer();
  const bytes = new Uint8Array(buffer);
  let html;
  if (bytes[0] === 0xFF && bytes[1] === 0xFE) html = new TextDecoder('utf-16le').decode(buffer);
  else if (bytes[0] === 0xFE && bytes[1] === 0xFF) html = new TextDecoder('utf-16be').decode(buffer);
  else html = new TextDecoder('utf-8').decode(buffer);

  const doc = new DOMParser().parseFromString(html, 'text/html');
  const rows = Array.from(doc.querySelectorAll('tr'));

  // MT4 account info is in first row: "Account: 11080514" | "Name: ..." | "Currency: USD" | "Leverage:" | "date"
  let accountId = null, accountName = null;
  const firstRowCells = Array.from(rows[0]?.querySelectorAll('td') || []).map(td => td.textContent.trim());
  for (const cell of firstRowCells) {
    const accMatch = cell.match(/^Account:\s*(\d+)/);
    if (accMatch) accountId = accMatch[1];
    const nameMatch = cell.match(/^Name:\s*(.+)/);
    if (nameMatch) accountName = nameMatch[1].trim();
  }

  const positions = [], openPositions = [], workingOrders = [], deposits = [];
  const summary = {};
  let section = null;

  // MT4 column layout for closed trades:
  // [0]Ticket [1]OpenTime [2]Type [3]Size [4]Item [5]Price [6]S/L [7]T/P [8]CloseTime [9]ClosePrice [10]Commission [11]Taxes [12]Swap [13]Profit
  // MT4 column layout for open trades:
  // [0]Ticket [1]OpenTime [2]Type [3]Size [4]Item [5]Price [6]S/L [7]T/P [8](empty) [9]CurPrice [10]Commission [11]Taxes [12]Swap [13]Profit
  // MT4 column layout for working orders:
  // [0]Ticket [1]OpenTime [2]Type [3]Size [4]Item [5]Price [6]S/L [7]T/P [8]MarketPrice [9](empty)

  const MT4_TRADE_TYPES = ['buy','sell','buy limit','sell limit','buy stop','sell stop'];
  const MT4_CLOSED_TYPES = ['buy','sell']; // only these are actual closed trades
  const MT4_ORDER_TYPES  = ['buy limit','sell limit','buy stop','sell stop'];

  for (const tr of rows) {
    const cells = Array.from(tr.querySelectorAll('td')).map(td => td.textContent.trim().replace(/ /g,' '));
    if (!cells.length) continue;

    // Section detection — single cell rows
    const rowText = cells.join(' ').toLowerCase();
    if (cells.length <= 2) {
      if (rowText.includes('closed transactions')) { section = 'closed'; continue; }
      if (rowText.includes('open trades')) { section = 'open'; continue; }
      if (rowText.includes('working orders')) { section = 'orders'; continue; }
      if (rowText.includes('summary')) { section = 'summary'; continue; }
    }

    // Summary rows
    if (section === 'summary') {
      for (let i = 0; i < cells.length - 1; i++) {
        const label = cells[i].replace(':','').trim();
        if (/^(Balance|Equity|Floating P\/L|Free Margin|Margin|Credit Facility)$/i.test(label)) {
          const val = cells[i+1];
          if (val && !isNaN(parseFloat(val))) summary[label] = val;
        }
      }
      continue;
    }

    // Skip header rows (contain 'Ticket' or 'Type' as column headers)
    if (cells[0] === 'Ticket' || cells[2] === 'Type') continue;

    const num = (i) => { const v = parseFloat((cells[i]||'').replace(/[\s,]/g,'')); return isNaN(v) ? 0 : v; };
    const ticketId = cells[0];
    if (!/^\d+$/.test(ticketId)) continue; // skip non-trade rows

    const tradeType = (cells[2] || '').toLowerCase();

    // CLOSED trades
    if (section === 'closed') {
      if (tradeType === 'balance') {
        // Deposit/withdrawal
        deposits.push({
          time: convertMT5DateString(cells[1], brokerOffsetHours),
          amount: num(13) || num(4) || 0,
          balance: null,
          comment: cells[3] || ''
        });
        continue;
      }
      // Skip cancelled orders and non-trade types
      if (!MT4_CLOSED_TYPES.includes(tradeType) || cells[9] === 'cancelled') continue;
      // Only push if closeTime and closePrice look valid
      if (!cells[8] || !cells[9]) continue;

      positions.push({
        id: ticketId,
        account: accountId || 'default',
        openTime:   convertMT5DateString(cells[1], brokerOffsetHours),
        symbol:     cells[4].toUpperCase(),
        type:       tradeType,
        volume:     num(3),
        openPrice:  num(5),
        sl:         cells[6] || '0',
        tp:         cells[7] || '0',
        closeTime:  convertMT5DateString(cells[8], brokerOffsetHours),
        closePrice: num(9),
        commission: num(10),
        swap:       num(12),
        profit:     num(13),
      });
    }

    // OPEN trades
    else if (section === 'open') {
      if (!MT4_CLOSED_TYPES.includes(tradeType)) continue;
      openPositions.push({
        id: ticketId,
        account: accountId || 'default',
        openTime:     convertMT5DateString(cells[1], brokerOffsetHours),
        symbol:       cells[4].toUpperCase(),
        type:         tradeType,
        volume:       num(3),
        openPrice:    num(5),
        sl:           cells[6] || '0',
        tp:           cells[7] || '0',
        currentPrice: num(9),
        swap:         num(12),
        floatingPnL:  num(13),
      });
    }

    // WORKING ORDERS
    else if (section === 'orders') {
      if (!MT4_ORDER_TYPES.includes(tradeType)) continue;
      workingOrders.push({
        id: ticketId,
        account: accountId || 'default',
        openTime: convertMT5DateString(cells[1], brokerOffsetHours),
        symbol:   cells[4].toUpperCase(),
        type:     tradeType,
        volume:   num(3),
        price:    num(5),
        sl:       cells[6] || '0',
        tp:       cells[7] || '0',
        expiry:   '',
        state:    'placed',
      });
    }
  }

  const parseNum = (s) => { if (!s) return null; const v = parseFloat(String(s).replace(/[^0-9.\-]/g,'')); return isNaN(v) ? null : v; };
  const account = {
    balance:     parseNum(summary['Balance']),
    equity:      parseNum(summary['Equity']),
    floatingPnL: parseNum(summary['Floating P/L']),
    freeMargin:  parseNum(summary['Free Margin']),
    margin:      parseNum(summary['Margin']),
    marginLevel: null,
    credit:      parseNum(summary['Credit Facility']),
  };

  return { positions, openPositions, workingOrders, deposits, account, accountId: accountId || 'default', accountName: accountName || 'Account', broker: 'MT4' };
}

// ── Auto-detect terminal and dispatch to correct parser ──
async function parseReportFile(file, brokerOffsetHours) {
  const buffer = await file.arrayBuffer();
  const bytes = new Uint8Array(buffer);
  let htmlSnippet;
  if (bytes[0] === 0xFF && bytes[1] === 0xFE) htmlSnippet = new TextDecoder('utf-16le').decode(buffer.slice(0, 4000));
  else if (bytes[0] === 0xFE && bytes[1] === 0xFF) htmlSnippet = new TextDecoder('utf-16be').decode(buffer.slice(0, 4000));
  else htmlSnippet = new TextDecoder('utf-8').decode(buffer.slice(0, 4000));

  // MT4 detection: single table, "Ticket" column header, "Closed Transactions:" section label
  // MT5 detection: multiple tables, section headers in <th><div><b> elements, "Positions" section
  const isMT4 = /Closed Transactions:/i.test(htmlSnippet) || /Ticket.*Open Time.*Type.*Size.*Item/i.test(htmlSnippet);
  const isMT5 = /<b>\s*(Positions|Deals|Orders)\s*<\/b>/i.test(htmlSnippet);

  if (isMT4 && !isMT5) return parseMT4File(file, brokerOffsetHours);
  return parseMT5File(file, brokerOffsetHours);
}

// ═══════════════ TAG CATEGORIES ═══════════════
// Default categories mirror Tradezella's three core buckets. Each maps to a pill-* CSS variable
// so colors auto-adapt to light/dark theme. The 'mistake' category is special: items in a
// trade's `mistakes` array are automatically considered category=mistake regardless of map.
const DEFAULT_TAG_CATEGORIES = [
  { id: 'setup',   name: 'Setup',   color: 'violet', icon: '◈', system: true, desc: 'Strategies, entries, patterns' },
  { id: 'mistake', name: 'Mistake', color: 'red',    icon: 'ico0', system: true, desc: 'Execution errors to avoid' },
  { id: 'emotion', name: 'Emotion', color: 'amber',  icon: 'ico1', system: true, desc: 'Feelings, mindset, state' },
];
// Look up a category for a given tag. Falls back to 'setup' when unmapped — gives every tag
// a visual identity even before the user starts categorizing.
function getTagCategory(tag, isMistake, tagCategoryMap, categories) {
  if (isMistake) return categories.find(c => c.id === 'mistake') || categories[0];
  const catId = tagCategoryMap?.[tag] || 'setup';
  return categories.find(c => c.id === catId) || categories.find(c => c.id === 'setup') || categories[0];
}

// ═══════════════ HELPERS ═══════════════
const fmt = (n, d = 2) => n == null || isNaN(n) ? '–' : n.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
// Privacy mode mask: when enabled (window.__rfxPrivacy === true), money values are hidden behind
// a fixed-width mask. Length stays roughly the same so the layout doesn't shift on toggle.
// Useful for screen sharing or screenshotting without exposing real $ figures.
const _privMask = (n, signed) => {
  const sign = n < 0 ? '-' : (signed && n > 0 ? '+' : '');
  return `${sign}$•••`;
};
const fmtMoney = (n, signed = false) => {
  if (n == null || isNaN(n)) return '–';
  if (typeof window !== 'undefined' && window.__rfxPrivacy) return _privMask(n, signed);
  const sign = n < 0 ? '-' : (signed && n > 0 ? '+' : '');
  return `${sign}$${fmt(Math.abs(n))}`;
};
const fmtCompact = (n) => {
  if (n == null || isNaN(n)) return '–';
  if (typeof window !== 'undefined' && window.__rfxPrivacy) return _privMask(n, false);
  const abs = Math.abs(n); const sign = n < 0 ? '-' : '';
  if (abs >= 1000) return `${sign}$${(abs / 1000).toFixed(1)}k`;
  return `${sign}$${abs.toFixed(2)}`;
};
const parseMT5Date = (s) => {
  if (!s) return null;
  const [d, t] = s.split(' ');
  const [Y, M, D] = d.split('.').map(Number);
  const [h, m, sec] = (t || '00:00:00').split(':').map(Number);
  return new Date(Y, M - 1, D, h, m, sec);
};
const netPnL = (t) => t.profit + t.commission + t.swap;
const dayKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const holdSecs = (t) => { const o = parseMT5Date(t.openTime), c = parseMT5Date(t.closeTime); return o && c ? (c - o) / 1000 : 0; };
const fmtHold = (s) => s >= 86400 ? `${(s/86400).toFixed(1)}d` : s >= 3600 ? `${(s/3600).toFixed(1)}h` : s >= 60 ? `${Math.round(s/60)}m` : `${Math.round(s)}s`;

// ── Image compression ──
function compressImage(file) {
  return new Promise((resolve) => {
    const MAX_PX = 1920;   // max width or height
    const QUALITY = 0.85;  // 85% JPEG — visually lossless for charts
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      let { width, height } = img;
      // Only downscale — never upscale
      if (width > MAX_PX || height > MAX_PX) {
        if (width >= height) { height = Math.round(height * MAX_PX / width); width = MAX_PX; }
        else { width = Math.round(width * MAX_PX / height); height = MAX_PX; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext('2d');
      // White background (handles transparent PNGs cleanly)
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, width, height);
      ctx.drawImage(img, 0, 0, width, height);
      canvas.toBlob(
        (blob) => resolve(blob || file),
        'image/jpeg',
        QUALITY
      );
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); }; // fallback: use original
    img.src = url;
  });
}

// ── Supabase Storage — image uploads ──
async function supaUploadImage(userId, tradeId, attId, file) {
  const sb = getSupa();
  if (!sb) return null;
  // Compress before upload — max 1920px, 85% JPEG quality
  const compressed = await compressImage(file);
  const path = `${userId}/${tradeId}/${attId}.jpg`;
  const { error } = await sb.storage.from('attachments').upload(path, compressed, { upsert: true, contentType: 'image/jpeg' });
  if (error) { console.error('Storage upload error:', error); return null; }
  const { data } = sb.storage.from('attachments').getPublicUrl(path);
  return data?.publicUrl || null;
}

async function supaDeleteImage(userId, tradeId, attId, ext) {
  const sb = getSupa();

}

// Tiny IndexedDB wrapper to persist a FileSystemFileHandle (it can't go in localStorage)
const SYNC_DB = 'ramanfx_sync', SYNC_STORE = 'handles', SYNC_KEY = 'syncFile';
function idbOpen() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(SYNC_DB, 1);
    req.onupgradeneeded = () => req.result.createObjectStore(SYNC_STORE);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbSetHandle(handle) {
  const db = await idbOpen();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(SYNC_STORE, 'readwrite');
    tx.objectStore(SYNC_STORE).put(handle, SYNC_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function idbGetHandle() {
  const db = await idbOpen();
  return new Promise((resolve) => {
    const tx = db.transaction(SYNC_STORE, 'readonly');
    const req = tx.objectStore(SYNC_STORE).get(SYNC_KEY);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}
async function idbClearHandle() {
  const db = await idbOpen();
  return new Promise((resolve) => {
    const tx = db.transaction(SYNC_STORE, 'readwrite');
    tx.objectStore(SYNC_STORE).delete(SYNC_KEY);
    tx.oncomplete = () => resolve();
    tx.onerror = () => resolve();
  });
}

// ═══════════════ ANALYTICS ═══════════════
function computeStats(trades) {
  if (!trades.length) return null;
  const enriched = trades.map(t => ({ ...t, net: netPnL(t), openDate: parseMT5Date(t.openTime), closeDate: parseMT5Date(t.closeTime), holdSec: holdSecs(t) }));
  const totalNet = enriched.reduce((a, b) => a + b.net, 0);
  const wins = enriched.filter(t => t.net > 0), losses = enriched.filter(t => t.net < 0), scratches = enriched.filter(t => t.net === 0);
  const grossWin = wins.reduce((a, b) => a + b.net, 0), grossLoss = Math.abs(losses.reduce((a, b) => a + b.net, 0));
  const profitFactor = grossLoss > 0 ? grossWin / grossLoss : grossWin > 0 ? Infinity : 0;
  const avgWin = wins.length ? grossWin / wins.length : 0, avgLoss = losses.length ? -grossLoss / losses.length : 0;
  const expectancy = enriched.length ? totalNet / enriched.length : 0;
  const winRate = enriched.length ? wins.length / enriched.length * 100 : 0;
  const largestWin = wins.length ? Math.max(...wins.map(t => t.net)) : 0;
  const largestLoss = losses.length ? Math.min(...losses.map(t => t.net)) : 0;
  const bestTrade = enriched.length ? enriched.reduce((a, b) => b.net > a.net ? b : a) : null;
  const worstTrade = enriched.length ? enriched.reduce((a, b) => b.net < a.net ? b : a) : null;
  const totalVolume = enriched.reduce((a, b) => a + b.volume, 0);
  const avgHold = enriched.length ? enriched.reduce((a, b) => a + b.holdSec, 0) / enriched.length : 0;

  const sorted = [...enriched].filter(t => t.closeDate).sort((a, b) => a.closeDate - b.closeDate);
  let running = 0, peak = 0, maxDD = 0;
  const equity = sorted.map((t, i) => {
    running += t.net; peak = Math.max(peak, running);
    const dd = peak - running; maxDD = Math.max(maxDD, dd);
    return { i: i + 1, equity: running, drawdown: -dd, label: t.closeTime?.split(' ')[0] };
  });

  const byDay = {};
  for (const t of sorted) {
    const k = dayKey(t.closeDate);
    if (!byDay[k]) byDay[k] = { date: k, pnl: 0, trades: 0, wins: 0, losses: 0, volume: 0, items: [] };
    byDay[k].pnl += t.net; byDay[k].trades++; byDay[k].volume += t.volume; byDay[k].items.push(t);
    if (t.net > 0) byDay[k].wins++; else if (t.net < 0) byDay[k].losses++;
  }
  const daily = Object.values(byDay).sort((a, b) => a.date.localeCompare(b.date));

  let tempW = 0, tempL = 0, longestWinStreak = 0, longestLossStreak = 0;
  for (const t of sorted) {
    if (t.net > 0) { tempW++; tempL = 0; longestWinStreak = Math.max(longestWinStreak, tempW); }
    else if (t.net < 0) { tempL++; tempW = 0; longestLossStreak = Math.max(longestLossStreak, tempL); }
  }
  let curStreak = 0, curStreakSign = 0;
  if (sorted.length) { const last = sorted[sorted.length - 1]; if (last.net > 0) { curStreakSign = 1; curStreak = tempW; } else if (last.net < 0) { curStreakSign = -1; curStreak = tempL; } }

  const profDays = daily.filter(d => d.pnl > 0).length, losingDays = daily.filter(d => d.pnl < 0).length;
  const dayWinRate = daily.length ? profDays / daily.length * 100 : 0;
  const avgDailyPnL = daily.length ? daily.reduce((a, b) => a + b.pnl, 0) / daily.length : 0;
  const avgDailyVolume = daily.length ? daily.reduce((a, b) => a + b.volume, 0) / daily.length : 0;
  const avgRR = avgLoss !== 0 ? Math.abs(avgWin / avgLoss) : 0;

  // Sharpe & Sortino ratios from daily P&L (annualized, assuming ~252 trading days)
  const dailyReturns = daily.map(d => d.pnl);
  let sharpe = 0, sortino = 0;
  if (dailyReturns.length >= 2) {
    const mean = dailyReturns.reduce((a, b) => a + b, 0) / dailyReturns.length;
    const variance = dailyReturns.reduce((a, b) => a + (b - mean) ** 2, 0) / (dailyReturns.length - 1);
    const std = Math.sqrt(variance);
    sharpe = std > 0 ? (mean / std) * Math.sqrt(252) : 0;
    const downside = dailyReturns.filter(r => r < 0);
    const downVar = downside.length ? downside.reduce((a, b) => a + b * b, 0) / downside.length : 0;
    const downStd = Math.sqrt(downVar);
    sortino = downStd > 0 ? (mean / downStd) * Math.sqrt(252) : 0;
  }

  const range = Math.max(Math.abs(largestWin), Math.abs(largestLoss)) || 1;
  const bins = 14, binSize = (range * 2) / bins;
  const dist = Array.from({ length: bins }, (_, i) => ({ bin: -range + (i + 0.5) * binSize, count: 0 }));
  for (const t of enriched) { const idx = Math.min(bins - 1, Math.max(0, Math.floor((t.net + range) / binSize))); dist[idx].count++; }

  const timeScatter = enriched.filter(t => t.openDate).map(t => ({ hour: t.openDate.getHours() + t.openDate.getMinutes() / 60, pnl: t.net, win: t.net > 0 }));
  const exitTimeScatter = enriched.filter(t => t.closeDate).map(t => ({ hour: t.closeDate.getHours() + t.closeDate.getMinutes() / 60, pnl: t.net, win: t.net > 0 }));
  const durationScatter = enriched.map(t => ({ hold: Math.max(1, t.holdSec), pnl: t.net, win: t.net > 0 }));

  return {
    totalNet, wins: wins.length, losses: losses.length, scratches: scratches.length,
    winRate, profitFactor, avgWin, avgLoss, avgRR, expectancy, grossWin, grossLoss,
    largestWin, largestLoss, bestTrade, worstTrade, total: enriched.length,
    equity, daily, byDay, maxDD, curStreak, curStreakSign, longestWinStreak, longestLossStreak,
    profDays, losingDays, dayWinRate, dist, timeScatter, exitTimeScatter, durationScatter,
    totalVolume, avgHold, avgDailyPnL, avgDailyVolume, enriched, sharpe, sortino,
  };
}

function computeBySymbol(trades) {
  const m = {};
  for (const t of trades) {
    const net = netPnL(t);
    if (!m[t.symbol]) m[t.symbol] = { symbol: t.symbol, net: 0, count: 0, wins: 0, volume: 0 };
    m[t.symbol].net += net; m[t.symbol].count++; m[t.symbol].volume += t.volume;
    if (net > 0) m[t.symbol].wins++;
  }
  return Object.values(m).map(s => ({ ...s, winRate: s.count ? s.wins / s.count * 100 : 0 })).sort((a, b) => b.net - a.net);
}

function computeScore(stats) {
  if (!stats) return { score: 0, axes: [] };
  const winScore = Math.min(100, stats.winRate * 1.5);
  const pfScore = stats.profitFactor === Infinity ? 100 : Math.min(100, stats.profitFactor * 40);
  const ddScore = stats.maxDD > 0 && Math.abs(stats.totalNet) > 0 ? Math.max(0, 100 - (stats.maxDD / (stats.maxDD + Math.abs(stats.totalNet)) * 200)) : 50;
  const rrScore = Math.min(100, stats.avgRR * 50);
  const consistencyScore = (() => {
    if (!stats.daily.length) return 50;
    const mean = stats.daily.reduce((a, b) => a + b.pnl, 0) / stats.daily.length;
    const variance = stats.daily.reduce((a, b) => a + (b.pnl - mean) ** 2, 0) / stats.daily.length;
    const std = Math.sqrt(variance);
    if (mean <= 0) return 20;
    return Math.max(0, Math.min(100, 100 - (std / mean) * 20));
  })();
  const recoveryScore = stats.maxDD > 0 ? Math.min(100, Math.max(0, stats.totalNet / stats.maxDD * 40)) : 80;
  const axes = [
    { axis: 'Win %', value: winScore }, { axis: 'Profit Factor', value: pfScore },
    { axis: 'Avg W/L', value: rrScore }, { axis: 'Recovery', value: recoveryScore },
    { axis: 'Max DD', value: ddScore }, { axis: 'Consistency', value: consistencyScore },
  ];
  return { score: axes.reduce((a, b) => a + b.value, 0) / axes.length, axes };
}

function generateInsights(trades) {
  if (trades.length < 5) return [];
  const insights = [];
  const enriched = trades.map(t => ({ ...t, net: netPnL(t), openDate: parseMT5Date(t.openTime), closeDate: parseMT5Date(t.closeTime) }));
  const bySym = computeBySymbol(trades).filter(s => s.count >= 3);
  if (bySym.length) {
    const best = bySym[0], worst = bySym[bySym.length - 1];
    if (best.net > 0) insights.push({ type: 'positive', icon: 'up', title: `${best.symbol} is your edge`, text: `${fmtMoney(best.net)} across ${best.count} trades (${best.winRate.toFixed(0)}% win rate). Lean into setups here.` });
    if (worst.symbol !== best.symbol && worst.net < 0) insights.push({ type: 'negative', icon: 'down', title: `${worst.symbol} is bleeding you`, text: `${fmtMoney(worst.net)} across ${worst.count} trades. Sit out or paper trade until you find an edge.` });
  }
  const dirStats = { buy: { count: 0, net: 0 }, sell: { count: 0, net: 0 } };
  for (const t of enriched) if (dirStats[t.type]) { dirStats[t.type].count++; dirStats[t.type].net += t.net; }
  if (dirStats.buy.count >= 5 && dirStats.sell.count >= 5) {
    const diff = dirStats.buy.net - dirStats.sell.net;
    if (Math.abs(diff) > 50) { const better = diff > 0 ? 'long' : 'short'; insights.push({ type: 'info', icon: 'ico2', title: `${better === 'long' ? 'Long' : 'Short'} bias detected`, text: `You're ${fmtMoney(Math.abs(diff))} better on ${better}s. Longs ${fmtMoney(dirStats.buy.net)} (${dirStats.buy.count}) · Shorts ${fmtMoney(dirStats.sell.net)} (${dirStats.sell.count}).` }); }
  }
  const sorted = [...enriched].filter(t => t.closeDate && t.openDate).sort((a, b) => a.closeDate - b.closeDate);
  let revenge = [];
  for (let i = 0; i < sorted.length; i++) {
    const prev = sorted[i]; if (prev.net >= 0) continue;
    for (let j = i + 1; j < sorted.length; j++) { const next = sorted[j]; const diffMin = (next.openDate - prev.closeDate) / 60000; if (diffMin < 0) continue; if (diffMin > 60) break; revenge.push(next); }
  }
  if (revenge.length >= 3) {
    const revNet = revenge.reduce((a, b) => a + b.net, 0); const w = revenge.filter(t => t.net > 0).length;
    insights.push({ type: revNet < 0 ? 'warning' : 'info', icon: 'ico0', title: 'Revenge trading pattern', text: `${revenge.length} trades opened within 60min of a loss netted ${fmtMoney(revNet)} (${(w/revenge.length*100).toFixed(0)}% wins). ${revNet < 0 ? 'This is costing you — step away after losses.' : "You're handling losses well."}` });
  }
  const hourStats = {};
  for (const t of enriched) { if (!t.openDate) continue; const h = t.openDate.getHours(); if (!hourStats[h]) hourStats[h] = { count: 0, net: 0 }; hourStats[h].count++; hourStats[h].net += t.net; }
  const hourEntries = Object.entries(hourStats).filter(([, v]) => v.count >= 3);
  if (hourEntries.length) {
    const sH = [...hourEntries].sort((a, b) => b[1].net - a[1].net); const [bestH, bestHS] = sH[0]; const [worstH, worstHS] = sH[sH.length - 1];
    if (bestHS.net - worstHS.net > 30) insights.push({ type: 'info', icon: 'clock', title: `Power hour: ${bestH}:00`, text: `${fmtMoney(bestHS.net)} over ${bestHS.count} trades. Worst hour ${worstH}:00 lost ${fmtMoney(worstHS.net)} over ${worstHS.count} trades.` });
  }
  const wins = enriched.filter(t => t.net > 0), losses = enriched.filter(t => t.net < 0);
  if (wins.length && losses.length) {
    const avgW = wins.reduce((a, b) => a + b.net, 0) / wins.length, avgL = losses.reduce((a, b) => a + b.net, 0) / losses.length;
    const rr = Math.abs(avgW / avgL);
    if (rr < 1) insights.push({ type: 'warning', icon: 'ico0', title: 'Losers outsize your winners', text: `Avg win ${fmtMoney(avgW)} vs avg loss ${fmtMoney(avgL)}. R:R is ${rr.toFixed(2)}.` });
    else if (rr >= 1.5) insights.push({ type: 'positive', icon: 'good', title: 'Strong reward:risk', text: `Avg win ${fmtMoney(avgW)} vs avg loss ${fmtMoney(avgL)} = ${rr.toFixed(2)}R.` });
  }
  return insights;
}

// Build a compact context blob about the trader's recent activity. We deliberately summarize
// rather than dump raw rows so we don't blow the LLM context window — most coaching questions
// only need stats + recent trades. The summary is structured JSON for easy LLM parsing.
function buildAICoachContext(trades, notes, stats, riskRules, exitData, maxTrades = 50) {
  if (!trades || trades.length === 0) return { error: 'No trades yet' };
  // Sort by close time desc, take most recent
  const sorted = [...trades].sort((a, b) => (parseMT5Date(b.closeTime) || 0) - (parseMT5Date(a.closeTime) || 0));
  const recent = sorted.slice(0, maxTrades);
  // Flatten each trade into a minimal row + linked note + exit data
  const recentTrades = recent.map(t => {
    const n = notes?.[t.id] || {};
    const ed = exitData?.[t.id] || {};
    return {
      symbol: t.symbol,
      side: t.type,
      open: t.openTime,
      close: t.closeTime,
      entry: t.openPrice,
      exit: t.closePrice,
      sl: t.sl,
      tp: t.tp,
      volume: t.volume,
      netPnL: +(netPnL(t)).toFixed(2),
      tags: n.tags || [],
      mistakes: n.mistakes || [],
      rating: n.rating || null,
      note: n.note || null,
      // Exit quality if available
      mfeDol: ed.mfe != null && ed.dollarPerPt != null ? +(ed.mfe * ed.dollarPerPt).toFixed(2) : null,
      maeDol: ed.mae != null && ed.dollarPerPt != null ? +(ed.mae * ed.dollarPerPt).toFixed(2) : null,
      capturePct: ed.mfe > 0 && ed.profitPts > 0 ? +((ed.profitPts / ed.mfe) * 100).toFixed(1) : null,
    };
  });
  // High-level aggregate stats. Field names match computeStats() return shape exactly —
  // earlier this had wrong names (stats.net, stats.count) and threw at runtime.
  const summary = stats ? {
    totalTrades: stats.total,
    winRate: +(stats.winRate || 0).toFixed(1),
    netPnL: +(stats.totalNet || 0).toFixed(2),
    profitFactor: +(stats.profitFactor || 0).toFixed(2),
    avgWin: +(stats.avgWin || 0).toFixed(2),
    avgLoss: +(stats.avgLoss || 0).toFixed(2),
    largestWin: +(stats.largestWin || 0).toFixed(2),
    largestLoss: +(stats.largestLoss || 0).toFixed(2),
    avgRR: +(stats.avgRR || 0).toFixed(2),
    expectancy: +(stats.expectancy || 0).toFixed(2),
    tradingDays: stats.daily?.length || 0,
    profDays: stats.profDays || 0,
    losingDays: stats.losingDays || 0,
    dayWinRate: +(stats.dayWinRate || 0).toFixed(1),
    maxDrawdown: +(stats.maxDD || 0).toFixed(2),
    longestWinStreak: stats.longestWinStreak || 0,
    longestLossStreak: stats.longestLossStreak || 0,
    currentStreak: (stats.curStreakSign > 0 ? '+' : stats.curStreakSign < 0 ? '-' : '') + (stats.curStreak || 0),
    bestDay: stats.daily?.length ? [...stats.daily].sort((a,b) => b.pnl - a.pnl)[0] : null,
    worstDay: stats.daily?.length ? [...stats.daily].sort((a,b) => a.pnl - b.pnl)[0] : null,
  } : null;
  return {
    asOf: new Date().toISOString(),
    summary,
    riskRules,
    recentTrades,
    note: `Showing most recent ${recentTrades.length} of ${trades.length} total trades.`,
  };
}
// Call OpenAI-compatible chat completions API. Returns the assistant message text.
// Supports OpenAI (api.openai.com) and any compatible endpoint (Together, Groq, etc).
async function callAICoachAPI(messages, config) {
  const url = config.endpoint || 'https://api.openai.com/v1/chat/completions';
  const model = config.model || 'gpt-4o-mini';
  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${config.apiKey}`,
    },
    body: JSON.stringify({
      model,
      messages,
      temperature: 0.4,
      max_tokens: 1200,
    }),
  });
  if (!res.ok) {
    const errText = await res.text();
    throw new Error(`API error ${res.status}: ${errText.slice(0, 300)}`);
  }
  const data = await res.json();
  return data.choices?.[0]?.message?.content || '(no response)';
}

Your job:
