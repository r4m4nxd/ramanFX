// ═══════════════ WINS VS LOSSES PANE ═══════════════
// Side-by-side comparison of winning vs losing trades. Inspired by Tradezella's
// "Wins vs Losses" report. Lets the user see if losers are bigger/longer/at different times
// than winners — which is often the actual asymmetry that turns a profitable system unprofitable.
function ReportsWinsVsLossesPane({ trades }) {
  const { winners, losers, scratch } = useMemo(() => {
    const w = [], l = [], s = [];
    for (const t of trades) { const n = netPnL(t); if (n > 0) w.push({ ...t, net: n }); else if (n < 0) l.push({ ...t, net: n }); else s.push({ ...t, net: n }); }
    return { winners: w, losers: l, scratch: s };
  }, [trades]);
  // Compute aggregated stats for one bucket
  const bucketStats = (arr) => {
    if (!arr.length) return null;
    const sum = (key) => arr.reduce((a, t) => a + (t[key] || 0), 0);
    const avg = (key) => sum(key) / arr.length;
    const netTotal = sum('net');
    const volumes = arr.map(t => t.volume || 0).filter(v => v);
    const holds = arr.map(t => t.holdSec || 0).filter(v => v);
    return {
      count: arr.length,
      netTotal,
      avgNet: arr.length ? netTotal / arr.length : 0,
      largest: Math.max(...arr.map(t => Math.abs(t.net))),
      avgVolume: avg('volume'),
      avgHoldSec: holds.length ? holds.reduce((a, b) => a + b, 0) / holds.length : 0,
      mostCommonSymbol: (() => {
        const counts = {}; for (const t of arr) counts[t.symbol] = (counts[t.symbol] || 0) + 1;
        const top = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
        return top ? `${top[0]} (${top[1]})` : '—';
      })(),
    };
  };
  const winStats = bucketStats(winners), lossStats = bucketStats(losers);
  // Helper to render a side-by-side row
  const row = (label, winVal, lossVal, fmt = v => v, highlight = null) => (
    <div style={{ display: 'grid', gridTemplateColumns: '160px 1fr 1fr', gap: 16, padding: '12px 0', borderBottom: '1px solid var(--border)', alignItems: 'baseline' }}>
      <div style={{ fontSize: 12, color: 'var(--text2)', textTransform: 'uppercase', letterSpacing: '0.04em', fontWeight: 600 }}>{label}</div>
      <div className="tabnum" style={{ fontSize: 17, fontWeight: 600, color: highlight === 'win' ? 'var(--green-bright)' : 'var(--text)' }}>{winStats ? fmt(winVal) : '—'}</div>
      <div className="tabnum" style={{ fontSize: 17, fontWeight: 600, color: highlight === 'loss' ? 'var(--red)' : 'var(--text)' }}>{lossStats ? fmt(lossVal) : '—'}</div>
    </div>
  );
  if (!winners.length && !losers.length) return <Card style={{ padding: 40, textAlign: 'center', color: 'var(--text3)' }}>No closed trades yet to compare.</Card>;
  const total = winners.length + losers.length + scratch.length;
  const winRate = total ? (winners.length / total) * 100 : 0;
  // Insight: are winners and losers asymmetric? An auto-generated takeaway helps users notice.
  const winLossRatio = lossStats?.avgNet ? Math.abs(winStats?.avgNet / lossStats.avgNet) : 0;
  const holdRatio = lossStats?.avgHoldSec ? (winStats?.avgHoldSec || 0) / lossStats.avgHoldSec : 0;
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <Card style={{ padding: 22 }}>
        {/* Header bar showing win rate split */}
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18, flexWrap: 'wrap', gap: 12 }}>
          <div>
            <div style={{ fontSize: 11, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 600 }}>Win rate</div>
            <div className="tabnum" style={{ fontSize: 28, fontWeight: 700 }}>{winRate.toFixed(1)}%</div>
          </div>
          <div style={{ flex: 1, maxWidth: 400 }}>
            <div style={{ display: 'flex', height: 14, borderRadius: 'var(--r-sm)', overflow: 'hidden', border: '1px solid var(--border)' }}>
              <div style={{ width: `${winRate}%`, background: 'var(--green)', transition: 'width 0.5s' }} />
              <div style={{ flex: 1, background: 'var(--red)' }} />
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 6, fontSize: 11, color: 'var(--text3)' }}>
              <span style={{ color: 'var(--green-bright)' }}>{winners.length} wins</span>
              <span style={{ color: 'var(--red)' }}>{losers.length} losses</span>
            </div>
          </div>
        </div>
        {/* Two-column header */}
        <div style={{ display: 'grid', gridTemplateColumns: '160px 1fr 1fr', gap: 16, padding: '8px 0', borderBottom: '2px solid var(--border)' }}>
          <div></div>
          <div style={{ fontSize: 12, color: 'var(--green-bright)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700 }}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M6 9H4.5a2.5 2.5 0 010-5H6"/><path d="M18 9h1.5a2.5 2.5 0 000-5H18"/><path d="M4 22h16M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22"/><path d="M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22"/><path d="M18 2H6v7a6 6 0 0012 0V2z"/></svg> Winners</div>
          <div style={{ fontSize: 12, color: 'var(--red)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 700 }}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Losers</div>
        </div>
        {/* Stat rows */}
        {row('Count', winStats?.count, lossStats?.count)}
        {row('Total $', winStats?.netTotal, lossStats?.netTotal, v => fmtMoney(v, true), 'win')}
        {row('Average $', winStats?.avgNet, lossStats?.avgNet, v => fmtMoney(v, true))}
        {row('Largest single $', winStats?.largest, lossStats?.largest, v => fmtMoney(v))}
        {row('Avg volume (lots)', winStats?.avgVolume, lossStats?.avgVolume, v => v.toFixed(2))}
        {row('Avg hold time', winStats?.avgHoldSec, lossStats?.avgHoldSec, v => fmtHold(v))}
        {row('Most common symbol', winStats?.mostCommonSymbol, lossStats?.mostCommonSymbol)}
      </Card>
      {/* Insight callout — auto-generated based on the asymmetries detected */}
      {(winStats && lossStats) && (
        <Card style={{ padding: 18, borderLeft: '3px solid var(--violet)' }}>
          <div style={{ fontSize: 11, color: 'var(--violet-light)', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 700, marginBottom: 10 }}>What this tells you</div>
          <ul style={{ display: 'flex', flexDirection: 'column', gap: 10, listStyle: 'none', padding: 0, fontSize: 13, color: 'var(--text2)', lineHeight: 1.6 }}>
            <li>
              <strong style={{ color: 'var(--text)' }}>Win/loss ratio:</strong> Your average win is {winLossRatio.toFixed(2)}× your average loss.
              {winLossRatio < 1 && <span style={{ color: 'var(--red)' }}> Losers are bigger than winners — even a 60% win rate barely breaks even.</span>}
              {winLossRatio >= 1 && winLossRatio < 1.5 && <span style={{ color: '#fbbf24' }}> Slim margin — you need to keep win rate above {(100 / (1 + winLossRatio)).toFixed(0)}% to stay profitable.</span>}
              {winLossRatio >= 1.5 && <span style={{ color: 'var(--green-bright)' }}> Healthy asymmetry — winners are meaningfully bigger than losers.</span>}
            </li>
            <li>
              <strong style={{ color: 'var(--text)' }}>Hold time:</strong> You hold winners for {fmtHold(winStats.avgHoldSec)} vs losers for {fmtHold(lossStats.avgHoldSec)}.
              {holdRatio < 0.8 && <span style={{ color: 'var(--red)' }}> Cutting winners short and holding losers — the classic disposition effect.</span>}
              {holdRatio >= 0.8 && holdRatio < 1.5 && <span style={{ color: 'var(--text2)' }}> Similar hold times — your exits don't show obvious bias.</span>}
              {holdRatio >= 1.5 && <span style={{ color: 'var(--green-bright)' }}> Letting winners run, cutting losers — good exit discipline.</span>}
            </li>
            <li>
              <strong style={{ color: 'var(--text)' }}>Position size:</strong> Avg lot size on winners {winStats.avgVolume.toFixed(2)} vs losers {lossStats.avgVolume.toFixed(2)}.
              {lossStats.avgVolume > winStats.avgVolume * 1.3 && <span style={{ color: 'var(--red)' }}> Bigger on losers than winners — likely sizing up after losses.</span>}
            </li>
          </ul>
        </Card>
      )}
    </div>
  );
}

// ═══════════════ STRATEGIES ═══════════════
function Strategies({ strategies, trades, notes, onSave, onDelete }) {
  const [editing, setEditing] = useState(null);
  const stats = useMemo(() => {
    const map = {}; for (const p of strategies) map[p.id] = { ...p, trades: [], net: 0, wins: 0 };
    for (const t of trades) { const pid = notes[t.id]?.strategyId; if (pid && map[pid]) { const n = netPnL(t); map[pid].trades.push(t); map[pid].net += n; if (n > 0) map[pid].wins++; } }
    return Object.values(map).map(p => ({ ...p, count: p.trades.length, winRate: p.trades.length ? p.wins / p.trades.length * 100 : 0, avg: p.trades.length ? p.net / p.trades.length : 0 }));
  }, [strategies, trades, notes]);
  const inp = { width: '100%', fontSize: 13, background: 'var(--panel2)', border: '1px solid var(--border2)', borderRadius: 'var(--r-sm)', padding: 8, color: 'var(--text)', outline: 'none' };
  return (
    <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      {!editing && (
        <button onClick={() => setEditing({ name: '', description: '', rules: '' })} style={{ width: '100%', background: 'var(--panel)', border: '1px dashed var(--border2)', borderRadius: 'var(--r-lg)', padding: 24, color: 'var(--text2)', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, fontSize: 13, transition: 'background 0.12s var(--ease-out), color 0.12s var(--ease-out), border-color 0.12s var(--ease-out), opacity 0.12s var(--ease-out)' }}
          onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--violet)'; e.currentTarget.style.color = 'var(--violet-light)'; }} onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border2)'; e.currentTarget.style.color = 'var(--text2)'; }}>+ Define a new strategy</button>
      )}
      {editing && (
        <Card style={{ padding: 18 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 12 }}><div style={{ fontWeight: 600 }}>{editing.id ? 'Edit strategy' : 'New strategy'}</div><button style={btnStyle('ghost')} onClick={() => setEditing(null)}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button></div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12 }}>
            <input value={editing.name} onChange={e => setEditing({ ...editing, name: e.target.value })} placeholder="Strategy name (e.g. 'London open breakout')" style={inp} />
            <textarea value={editing.description} onChange={e => setEditing({ ...editing, description: e.target.value })} placeholder="Short description" rows={2} style={{ ...inp, resize: 'vertical' }} />
            <textarea value={editing.rules} onChange={e => setEditing({ ...editing, rules: e.target.value })} placeholder="Entry / exit / risk rules. Be specific." rows={5} style={{ ...inp, resize: 'vertical' }} />
            <div style={{ display: 'flex', gap: 8 }}>
              <button style={{ ...btnStyle('primary'), opacity: editing.name.trim() ? 1 : 0.4 }} disabled={!editing.name.trim()} onClick={() => { if (editing.name.trim()) { onSave(editing); setEditing(null); } }}>Save strategy</button>
              <button style={btnStyle('ghost')} onClick={() => setEditing(null)}>Cancel</button>
            </div>
          </div>
        </Card>
      )}
      {stats.length === 0 && !editing && <div style={{ textAlign: 'center', padding: 40, color: 'var(--text3)', fontSize: 13 }}>Strategies are your trading playbooks. Define one, then assign trades from Trade View.</div>}
      {stats.map(p => (
        <Card key={p.id} style={{ padding: 18 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 12 }}>
            <div style={{ flex: 1 }}><div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 4 }}><div style={{ fontWeight: 600 }}>{p.name}</div><Pill color="violet">{p.count} trades</Pill></div>{p.description && <div style={{ fontSize: 13, color: 'var(--text2)' }}>{p.description}</div>}</div>
            <div style={{ display: 'flex', gap: 4 }}>
              <button style={{ ...btnStyle('ghost'), padding: 6 }} onClick={() => setEditing(p)}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg></button>
              <button style={{ ...btnStyle('ghost'), padding: 6, color: 'var(--red)' }} onClick={() => { if (confirm(`Delete strategy "${p.name}"?`)) onDelete(p.id); }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
            </div>
          </div>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(120px,1fr))', gap: 8, marginBottom: 12 }}>
            {[['Net P&L', fmtMoney(p.net, true), p.net >= 0 ? 'var(--green-bright)' : 'var(--red)'], ['Win rate', p.count ? `${p.winRate.toFixed(0)}%` : '—'], ['Avg / trade', p.count ? fmtMoney(p.avg, true) : '—', p.avg >= 0 ? 'var(--green-bright)' : 'var(--red)'], ['W / L', `${p.wins} / ${p.count - p.wins}`]].map(([l, v, c], i) => (
              <div key={i} style={{ background: 'var(--panel2)', borderRadius: 'var(--r-md)', padding: 10 }}><div style={{ fontSize: 10, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.04em' }}>{l}</div><div className="tabnum" style={{ fontSize: 17, fontWeight: 600, color: c || 'var(--text)' }}>{v}</div></div>
            ))}
          </div>
          {p.rules && <div style={{ background: 'var(--inset-bg)', border: '1px solid var(--inset-border)', borderRadius: 'var(--r-md)', padding: 12 }}><div style={{ fontSize: 10, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.04em', marginBottom: 6 }}>Rules</div><div style={{ fontSize: 13, color: 'var(--text2)', whiteSpace: 'pre-wrap' }}>{p.rules}</div></div>}
        </Card>
      ))}
    </div>
  );
}

// ═══════════════ TAG LIBRARY MODAL ═══════════════
// Single screen where the user can:
//   - See every tag they've ever used, grouped by category
//   - Drag/click to reassign tags to different categories
//   - Add custom categories (beyond the default Setup/Mistake/Emotion)
//   - See per-tag trade count + total P&L
// Modeled on Tradezella's "Tag Management" page.
function TagLibrary({ open, onClose, allNotes, tagCategoryMap, onSaveTagCategoryMap, tagCategories, onSaveCategory, onDeleteCategory, trades }) {
  const [newCatName, setNewCatName] = useState('');
  const [adding, setAdding] = useState(false);
  // Build a flat list of every tag (from notes.tags + notes.mistakes) with stats.
  const tagStats = useMemo(() => {
    const map = new Map();
    const tradesById = new Map(trades.map(t => [t.id, t]));
    for (const [tradeId, n] of Object.entries(allNotes || {})) {
      const t = tradesById.get(tradeId);
      const net = t ? netPnL(t) : 0;
      for (const tag of (n.tags || [])) {
        if (!map.has(tag)) map.set(tag, { tag, isMistake: false, count: 0, totalPnL: 0 });
        const row = map.get(tag); row.count++; row.totalPnL += net;
      }
      for (const tag of (n.mistakes || [])) {
        // Mistakes go into their own implicit category — still tracked for stats
        if (!map.has(`m_${tag}`)) map.set(`m_${tag}`, { tag, isMistake: true, count: 0, totalPnL: 0 });
        const row = map.get(`m_${tag}`); row.count++; row.totalPnL += net;
      }
    }
    return [...map.values()].sort((a, b) => b.count - a.count);
  }, [allNotes, trades]);
  // Group tags by category
  const byCategory = useMemo(() => {
    const groups = {};
    for (const cat of tagCategories) groups[cat.id] = { cat, tags: [] };
    for (const row of tagStats) {
      const cat = getTagCategory(row.tag, row.isMistake, tagCategoryMap, tagCategories);
      if (cat && groups[cat.id]) groups[cat.id].tags.push(row);
    }
    return Object.values(groups);
  }, [tagStats, tagCategoryMap, tagCategories]);
  const changeCategory = (tag, newCatId) => {
    onSaveTagCategoryMap({ ...tagCategoryMap, [tag]: newCatId });
  };
  const addCategory = () => {
    const name = newCatName.trim();
    if (!name) return;
    const id = `c_${Date.now()}`;
    // Custom categories pick from a rotating palette
    const palette = ['blue', 'green', 'zinc'];
    const color = palette[tagCategories.filter(c => !c.system).length % palette.length];
    onSaveCategory({ id, name, color, icon: '◇' });
    setNewCatName(''); setAdding(false);
  };
  return (
    <Modal open={open} onClose={onClose} width={780}>
      <div style={{ padding: 22 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
          <div style={{ fontSize: 18, fontWeight: 600 }}>Tag Library</div>
          <div style={{ fontSize: 12, color: 'var(--text3)' }}>{tagStats.length} tags total</div>
        </div>
        <div style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 18 }}>Organize your tags into categories so reports and chip colors stay consistent. Click a tag to reassign it.</div>
        {tagStats.length === 0 ? (
          <div style={{ padding: 40, textAlign: 'center', color: 'var(--text3)', fontSize: 13 }}>No tags yet — add some from any trade's detail page.</div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14, maxHeight: 500, overflowY: 'auto' }}>
            {byCategory.map(group => (
              <div key={group.cat.id} style={{ background: 'var(--inset-bg)', border: '1px solid var(--inset-border)', borderRadius: 'var(--r-md)', padding: 12 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 10 }}>
                  <span style={{ display: 'inline-flex', alignItems: 'center', justifyContent: 'center', width: 22, height: 22, borderRadius: 5, background: `var(--pill-${group.cat.color}-bg)`, color: `var(--pill-${group.cat.color}-fg)`, fontSize: 12 }}>{renderIcon(group.cat.icon, 13)}</span>
                  <div style={{ fontWeight: 600, fontSize: 13 }}>{group.cat.name}</div>
                  <div style={{ fontSize: 11, color: 'var(--text3)' }}>{group.tags.length} tag{group.tags.length !== 1 ? 's' : ''}</div>
                  {!group.cat.system && (
                    <button onClick={() => { if (confirm(`Delete category "${group.cat.name}"? Tags in it will move to Setup.`)) { onDeleteCategory(group.cat.id); }}} style={{ marginLeft: 'auto', background: 'transparent', border: 'none', color: 'var(--text3)', cursor: 'pointer', fontSize: 13 }}
                      onMouseEnter={e => e.currentTarget.style.color = 'var(--red)'} onMouseLeave={e => e.currentTarget.style.color = 'var(--text3)'}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg></button>
                  )}
                </div>
                {group.tags.length === 0 ? (
                  <div style={{ fontSize: 11, color: 'var(--text3)', fontStyle: 'italic', padding: '4px 0' }}>No tags in this category yet.</div>
                ) : (
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 6 }}>
                    {group.tags.map(row => (
                      <div key={`${row.isMistake ? 'm_' : ''}${row.tag}`} style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '5px 8px', background: 'var(--panel)', border: '1px solid var(--border)', borderRadius: 6 }}>
                        <span style={{ fontSize: 12, color: 'var(--text)', flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{row.tag}</span>
                        <span className="tabnum" style={{ fontSize: 10, color: row.totalPnL >= 0 ? 'var(--green-bright)' : 'var(--red)' }}>{fmtCompact(row.totalPnL)}</span>
                        <span style={{ fontSize: 10, color: 'var(--text3)' }}>×{row.count}</span>
                        {/* Category picker dropdown — only shown for non-mistake tags */}
                        {!row.isMistake && (
                          <select value={tagCategoryMap[row.tag] || 'setup'} onChange={e => changeCategory(row.tag, e.target.value)}
                            title="Move to category"
                            style={{ fontSize: 10, padding: '1px 4px', background: 'var(--panel2)', color: 'var(--text2)', border: '1px solid var(--border)', borderRadius: 4, cursor: 'pointer' }}>
                            {tagCategories.filter(c => c.id !== 'mistake').map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                          </select>
                        )}
                      </div>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
        {/* Add category */}
        <div style={{ marginTop: 14, padding: 12, background: 'var(--inset-bg)', border: '1px dashed var(--border2)', borderRadius: 8 }}>
          {adding ? (
            <div style={{ display: 'flex', gap: 8 }}>
              <input autoFocus value={newCatName} onChange={e => setNewCatName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addCategory(); if (e.key === 'Escape') { setAdding(false); setNewCatName(''); } }} placeholder="Category name (e.g. Market Condition)" style={{ flex: 1, fontSize: 12, padding: '6px 8px', background: 'var(--panel2)', border: '1px solid var(--border2)', borderRadius: 'var(--r-sm)', color: 'var(--text)', outline: 'none' }} />
              <button style={btnStyle('primary')} onClick={addCategory}>Add</button>
              <button style={btnStyle('ghost')} onClick={() => { setAdding(false); setNewCatName(''); }}>Cancel</button>
            </div>
          ) : (
            <button onClick={() => setAdding(true)} style={{ background: 'transparent', border: 'none', color: 'var(--text3)', fontSize: 12, cursor: 'pointer', padding: 0 }}
              onMouseEnter={e => e.currentTarget.style.color = 'var(--violet-light)'} onMouseLeave={e => e.currentTarget.style.color = 'var(--text3)'}>
              + Add custom category
            </button>
          )}
        </div>
        <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: 14 }}>
          <button style={btnStyle('primary')} onClick={onClose}>Done</button>
        </div>
      </div>
    </Modal>
  );
}

// ═══════════════ NOTEBOOK (with folders, favorites, templates) ═══════════════
// Tradezella-style notebook with:
//   - Default folders: All notes (virtual), Favorites (virtual), Daily Journal (virtual,
//     pulls from dayNotes), Trade Notes (virtual, pulls from trade.notes), My Notes (default).
//   - User can create custom folders. Each folder can have a template that auto-populates
//     when a new note is created in that folder.
//   - Notes have favorite flag + folderId + tags.
const DEFAULT_FOLDERS = [
  { id: 'all', name: 'All notes', virtual: true, system: true, icon: 'notebook' },
  { id: 'favorites', name: 'Favorites', virtual: true, system: true, icon: 'star' },
  { id: 'trade-notes', name: 'Trade Notes', virtual: true, system: true, icon: 'trade' },
  { id: 'daily-journal', name: 'Daily Journal', virtual: true, system: true, icon: 'calendar_nb' },
  { id: 'my-notes', name: 'My Notes', system: true, icon: 'edit' },
];
function Notebook({ entries, onSave, onDelete, folders, onSaveFolder, onDeleteFolder, trades, notes, dayNotes }) {
  const [selectedFolder, setSelectedFolder] = useState('all');
  const [expandedFolders, setExpandedFolders] = useState({ 'all': true, 'my-notes': true });
  const [selected, setSelected] = useState(null);
  const [editing, setEditing] = useState(false);
  const [search, setSearch] = useState('');
  const [addingFolder, setAddingFolder] = useState(false);
  const [newFolderName, setNewFolderName] = useState('');
  const [editingTemplate, setEditingTemplate] = useState(null); // folderId being template-edited
  const [showFolderMenu, setShowFolderMenu] = useState(null); // folderId with menu open
  // Combine default + user folders. User-saved folders WIN — they may contain template/name
  // overrides for system folders. Iterate user-first so dedup keeps the override.
  const allFolders = useMemo(() => {
    const seen = new Set();
    const out = [];
    // First pass: anything the user has saved (may include overrides for system folders)
    for (const f of (folders || [])) {
      if (!seen.has(f.id)) { seen.add(f.id); out.push(f); }
    }
    // Second pass: defaults — only add if user didn't already override
    for (const f of DEFAULT_FOLDERS) {
      if (!seen.has(f.id)) { seen.add(f.id); out.push(f); }
    }
    // Re-sort so default folders appear in their canonical order (system first, then user-created)
    const defaultIds = DEFAULT_FOLDERS.map(f => f.id);
    out.sort((a, b) => {
      const ai = defaultIds.indexOf(a.id), bi = defaultIds.indexOf(b.id);
      if (ai === -1 && bi === -1) return 0; // both custom — preserve insertion order
      if (ai === -1) return 1; // custom after system
      if (bi === -1) return -1;
      return ai - bi;
    });
    // Merge in default fields (icon, virtual, system) on user overrides so they don't lose styling
    return out.map(f => {
      const d = DEFAULT_FOLDERS.find(x => x.id === f.id);
      return d ? { ...d, ...f } : f;
    });
  }, [folders]);
  // Build virtual entries from trades (notes attached to a trade) and dayNotes
  const tradeNoteEntries = useMemo(() => {
    if (!notes) return [];
    return Object.entries(notes).filter(([id, n]) => n?.note && n.note.trim()).map(([tradeId, n]) => {
      const t = trades?.find(t => t.id === tradeId);
      return {
        id: `t_${tradeId}`,
        title: t ? `${t.symbol} · ${t.closeTime?.split(' ')[0] || ''}` : 'Trade note',
        body: n.note,
        updatedAt: n.updatedAt || Date.now(),
        folderId: 'trade-notes',
        virtual: true, // can't edit from notebook (edit via trade detail page)
        sourceId: tradeId,
        sourceType: 'trade',
      };
    });
  }, [notes, trades]);
  const dayNoteEntries = useMemo(() => {
    if (!dayNotes) return [];
    return Object.entries(dayNotes).filter(([day, text]) => text && text.trim()).map(([day, text]) => ({
      id: `d_${day}`,
      title: day,
      body: text,
      updatedAt: Date.now(), // dayNotes doesn't track timestamps; show as recent
      folderId: 'daily-journal',
      virtual: true,
      sourceId: day,
      sourceType: 'day',
    }));
  }, [dayNotes]);
  // Filtered entries based on selected folder + search
  const filteredEntries = useMemo(() => {
    let pool;
    if (selectedFolder === 'all') pool = [...entries, ...tradeNoteEntries, ...dayNoteEntries];
    else if (selectedFolder === 'favorites') pool = entries.filter(e => e.favorite);
    else if (selectedFolder === 'trade-notes') pool = tradeNoteEntries;
    else if (selectedFolder === 'daily-journal') pool = dayNoteEntries;
    else pool = entries.filter(e => (e.folderId || 'my-notes') === selectedFolder);
    if (search.trim()) {
      const q = search.toLowerCase();
      pool = pool.filter(e => (e.title || '').toLowerCase().includes(q) || (e.body || '').toLowerCase().includes(q));
    }
    return pool.sort((a, b) => b.updatedAt - a.updatedAt);
  }, [entries, tradeNoteEntries, dayNoteEntries, selectedFolder, search]);
  // Note count per folder (used in sidebar)
  const folderCounts = useMemo(() => {
    const counts = {};
    counts['all'] = entries.length + tradeNoteEntries.length + dayNoteEntries.length;
    counts['favorites'] = entries.filter(e => e.favorite).length;
    counts['trade-notes'] = tradeNoteEntries.length;
    counts['daily-journal'] = dayNoteEntries.length;
    for (const f of allFolders) {
      if (f.virtual) continue;
      counts[f.id] = entries.filter(e => (e.folderId || 'my-notes') === f.id).length;
    }
    return counts;
  }, [entries, tradeNoteEntries, dayNoteEntries, allFolders]);
  const current = filteredEntries.find(e => e.id === selected) || (selected && !selected.startsWith('t_') && !selected.startsWith('d_') ? entries.find(e => e.id === selected) : null);
  const inp = { width: '100%', fontSize: 13, background: 'var(--panel2)', border: '1px solid var(--border2)', borderRadius: 'var(--r-sm)', padding: 8, color: 'var(--text)', outline: 'none' };
  // Create a new note in the current folder (or my-notes if a virtual folder is selected).
  // Pre-populate with template if folder has one.
  const newEntry = () => {
    const folderId = (selectedFolder === 'all' || selectedFolder === 'favorites' || selectedFolder === 'trade-notes' || selectedFolder === 'daily-journal') ? 'my-notes' : selectedFolder;
    const folder = allFolders.find(f => f.id === folderId);
    const templateBody = folder?.template || '';
    const e = { id: `n_${Date.now()}`, title: 'Untitled', body: templateBody, updatedAt: Date.now(), folderId, favorite: false };
    onSave(e); setSelected(e.id); setEditing(true);
  };
  const handleDelete = (id) => {
    if (id?.startsWith('t_') || id?.startsWith('d_')) { alert('To delete this note, go to the trade or day where it was created.'); return; }
    if (confirm('Delete this note permanently?')) { onDelete(id); setSelected(null); setEditing(false); }
  };
  const toggleFavorite = (e) => onSave({ ...e, favorite: !e.favorite, updatedAt: e.updatedAt });
  const moveToFolder = (e, newFolderId) => { onSave({ ...e, folderId: newFolderId, updatedAt: Date.now() }); };
  const addFolder = () => {
    const name = newFolderName.trim();
    if (!name) return;
    const id = `f_${Date.now()}`;
    onSaveFolder({ id, name });
    setNewFolderName(''); setAddingFolder(false);
    setSelectedFolder(id); setExpandedFolders(prev => ({ ...prev, [id]: true }));
  };
  const removeFolder = (id) => {
    if (!confirm('Delete this folder? Notes inside will be moved to "My Notes".')) return;
    // Reassign all notes from this folder to my-notes
    entries.filter(e => e.folderId === id).forEach(e => onSave({ ...e, folderId: 'my-notes' }));
    onDeleteFolder(id);
    if (selectedFolder === id) setSelectedFolder('my-notes');
  };
  const saveTemplate = (folderId, template) => {
    const f = allFolders.find(x => x.id === folderId);
    if (!f) return;
    // System folders' templates are stored separately too — onSaveFolder handles both
    onSaveFolder({ ...f, template });
    setEditingTemplate(null);
  };
  // Print a note (or save as PDF via the browser's print dialog).
  // Strategy: render an off-screen `.print-note-target` element with clean light-mode markup,
  // set `body.printing-note` so the @media print CSS hides everything else, call window.print(),
  // then clean up. The user picks "Save as PDF" from their browser's print dialog destination.
  const printNote = (note) => {
    if (!note) return;
    const folderName = allFolders.find(f => f.id === (note.folderId || 'my-notes'))?.name || 'My Notes';
    const dateStr = new Date(note.updatedAt).toLocaleString();
    const escape = (s) => (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    let target = document.querySelector('.print-note-target');
    if (!target) {
      target = document.createElement('div');
      target.className = 'print-note-target';
      document.body.appendChild(target);
    }
    target.innerHTML = `
      <h1>${escape(note.title || 'Untitled')}</h1>
      <div class="print-meta">${escape(folderName)} · Updated ${escape(dateStr)}${note.virtual ? ' · ' + (note.sourceType === 'trade' ? 'Trade note' : 'Daily journal entry') : ''}</div>
      <div class="print-body">${escape(note.body) || '<em>(empty note)</em>'}</div>
      <div class="print-footer">${escape(BRAND)} — exported ${new Date().toLocaleDateString()}</div>
    `;
    document.body.classList.add('printing-note');
    setTimeout(() => {
      window.print();
      document.body.classList.remove('printing-note');
    }, 50);
  };
  return (
    <div className="fade-in force-stack" style={{ display: 'grid', gridTemplateColumns: '280px 1fr', gap: 14, minHeight: 600 }}>
      {/* ── Folder sidebar ── */}
      <Card style={{ padding: 0, maxHeight: 800, overflowY: 'auto', display: 'flex', flexDirection: 'column' }}>
        {/* Search + add folder header */}
        <div style={{ padding: 12, borderBottom: '1px solid var(--border)' }}>
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search notes…" style={{ ...inp, fontSize: 12 }} />
        </div>
        {/* Folder list */}
        <div style={{ padding: 8, flex: 1 }}>
          {allFolders.map(folder => {
            const isOpen = expandedFolders[folder.id];
            const isSelected = selectedFolder === folder.id;
            const folderEntries = folder.virtual
              ? (folder.id === 'all' ? [...entries, ...tradeNoteEntries, ...dayNoteEntries] : folder.id === 'favorites' ? entries.filter(e => e.favorite) : folder.id === 'trade-notes' ? tradeNoteEntries : dayNoteEntries)
              : entries.filter(e => (e.folderId || 'my-notes') === folder.id);
            const sorted = [...folderEntries].sort((a, b) => b.updatedAt - a.updatedAt);
            return (
              <Fragment key={folder.id}>
                {/* Folder row */}
                <div onClick={() => { setSelectedFolder(folder.id); setExpandedFolders(prev => ({ ...prev, [folder.id]: !prev[folder.id] })); }}
                  style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '7px 8px', borderRadius: 'var(--r-sm)', cursor: 'pointer', background: isSelected ? 'var(--violet-tint)' : 'transparent', color: isSelected ? 'var(--violet-light)' : 'var(--text)', fontSize: 13, fontWeight: 500, transition: 'background 0.12s var(--ease-out), color 0.12s var(--ease-out), opacity 0.12s var(--ease-out)', position: 'relative' }}
                  onMouseEnter={e => { if (!isSelected) e.currentTarget.style.background = 'var(--hover-tint)'; }}
                  onMouseLeave={e => { if (!isSelected) e.currentTarget.style.background = 'transparent'; }}>
                  <span style={{ fontSize: 10, color: 'var(--text3)', width: 10 }}>{isOpen ? '▾' : '▸'}</span>
                  <span style={{ width: 16, height: 16, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{renderIcon(folder.icon || 'notebook', 14)}</span>
                  <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{folder.name}</span>
                  <span style={{ fontSize: 10, color: 'var(--text3)' }}>{folderCounts[folder.id] || 0}</span>
                  {/* Folder menu for non-virtual folders */}
                  {!folder.virtual && (
                    <button onClick={ev => { ev.stopPropagation(); setShowFolderMenu(showFolderMenu === folder.id ? null : folder.id); }}
                      style={{ background: 'transparent', border: 'none', color: 'var(--text3)', cursor: 'pointer', fontSize: 14, padding: '0 2px', lineHeight: 1 }}>⋯</button>
                  )}
                  {/* Folder context menu */}
                  {showFolderMenu === folder.id && (
                    <div style={{ position: 'absolute', top: '100%', right: 4, marginTop: 2, background: 'var(--panel)', border: '1px solid var(--border)', borderRadius: 'var(--r-sm)', boxShadow: 'var(--shadow-elev)', zIndex: 30, minWidth: 140 }} onClick={ev => ev.stopPropagation()}>
                      <button onClick={() => { setEditingTemplate(folder.id); setShowFolderMenu(null); }} style={{ width: '100%', padding: '8px 12px', textAlign: 'left', background: 'transparent', border: 'none', color: 'var(--text)', fontSize: 12, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}
                        onMouseEnter={e => e.currentTarget.style.background = 'var(--hover-tint)'} onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg> Edit template
                      </button>
                      {!folder.system && (
                        <button onClick={() => { removeFolder(folder.id); setShowFolderMenu(null); }} style={{ width: '100%', padding: '8px 12px', textAlign: 'left', background: 'transparent', border: 'none', color: 'var(--red)', fontSize: 12, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: 6 }}
                          onMouseEnter={e => e.currentTarget.style.background = 'var(--hover-tint)'} onMouseLeave={e => e.currentTarget.style.background = 'transparent'}>
                          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg> Delete folder
                        </button>
                      )}
                    </div>
                  )}
                </div>
                {/* Folder contents (notes) */}
                {isOpen && sorted.length > 0 && (
                  <div style={{ marginLeft: 22, marginBottom: 4 }}>
                    {sorted.slice(0, 50).map(e => (
                      <div key={e.id} onClick={() => { setSelected(e.id); setEditing(false); }}
                        style={{ padding: '5px 8px', borderRadius: 5, cursor: 'pointer', background: selected === e.id ? 'var(--violet-tint)' : 'transparent', borderLeft: selected === e.id ? '2px solid var(--violet)' : '2px solid transparent', transition: 'border-color 0.1s var(--ease-out), background 0.1s var(--ease-out)' }}
                        onMouseEnter={ev => { if (selected !== e.id) ev.currentTarget.style.background = 'var(--hover-tint)'; }}
                        onMouseLeave={ev => { if (selected !== e.id) ev.currentTarget.style.background = 'transparent'; }}>
                        <div style={{ fontSize: 12, color: 'var(--text)', fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', display: 'flex', alignItems: 'center', gap: 4 }}>
                          {e.favorite && <span style={{ color: '#fbbf24', fontSize: 10 }}><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></span>}
                          <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis' }}>{e.title || 'Untitled'}</span>
                        </div>
                        <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 1 }}>{new Date(e.updatedAt).toLocaleDateString()}{e.virtual ? ' · linked' : ''}</div>
                      </div>
                    ))}
                  </div>
                )}
              </Fragment>
            );
          })}
          {/* Add folder row */}
          {addingFolder ? (
            <div style={{ display: 'flex', gap: 4, padding: '6px 8px', marginTop: 4 }}>
              <input autoFocus value={newFolderName} onChange={e => setNewFolderName(e.target.value)} onKeyDown={e => { if (e.key === 'Enter') addFolder(); if (e.key === 'Escape') { setAddingFolder(false); setNewFolderName(''); } }} placeholder="Folder name…" style={{ ...inp, fontSize: 12, padding: '4px 6px' }} />
              <button onClick={addFolder} style={{ ...btnStyle('primary'), padding: '4px 8px', fontSize: 11 }}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg></button>
            </div>
          ) : (
            <button onClick={() => setAddingFolder(true)} style={{ width: '100%', padding: '8px 10px', marginTop: 6, background: 'transparent', border: '1px dashed var(--border2)', borderRadius: 'var(--r-sm)', color: 'var(--text3)', fontSize: 12, cursor: 'pointer', textAlign: 'left' }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--violet)'; e.currentTarget.style.color = 'var(--violet-light)'; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border2)'; e.currentTarget.style.color = 'var(--text3)'; }}>
              + Add folder
            </button>
          )}
        </div>
      </Card>
      {/* ── Note view/editor ── */}
      <Card style={{ padding: 18, position: 'relative' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <button style={btnStyle('primary')} onClick={newEntry}>+ New note</button>
          {current && (
            <div style={{ display: 'flex', gap: 6 }}>
              {/* Print/PDF button — works for both virtual and regular notes */}
              <button onClick={() => printNote(current)} title="Print or save as PDF" style={{ ...btnStyle('ghost'), padding: '6px 10px' }}><svg width='13' height='13' viewBox='0 0 24 24' fill='none' stroke='currentColor' strokeWidth='1.5' strokeLinecap='round' strokeLinejoin='round'><path d='M6 9V2h12v7'/><path d='M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2'/><rect x='6' y='14' width='12' height='8' rx='1'/></svg> Print / PDF</button>
              {!current.virtual && (
                <Fragment>
                  <button onClick={() => toggleFavorite(current)} title={current.favorite ? 'Unfavorite' : 'Favorite'} style={{ ...btnStyle('ghost'), padding: '6px 10px', color: current.favorite ? '#fbbf24' : 'var(--text2)' }}><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></button>
                  {!editing && <button style={btnStyle('secondary')} onClick={() => setEditing(true)}>Edit</button>}
                  <button style={btnStyle('danger')} onClick={() => handleDelete(current.id)}>Delete</button>
                </Fragment>
              )}
            </div>
          )}
        </div>
        {!current ? (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', minHeight: 400, color: 'var(--text3)', fontSize: 13, gap: 8, textAlign: 'center' }}>
            <div style={{ fontSize: 32, opacity: 0.4 }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></div>
            <div>{filteredEntries.length === 0 ? `No notes in ${allFolders.find(f => f.id === selectedFolder)?.name || 'this folder'}.` : 'Select a note from the sidebar to view it.'}</div>
            {filteredEntries.length === 0 && <button style={btnStyle('secondary')} onClick={newEntry}>+ Create your first note here</button>}
          </div>
        ) : current.virtual ? (
          // Virtual notes (from trade/day) are read-only inside Notebook
          <div>
            <div style={{ fontSize: 20, fontWeight: 600 }}>{current.title}</div>
            <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 3, letterSpacing: '-0.01em', marginBottom: 16 }}>
              {current.sourceType === 'trade' ? 'Linked to trade — edit on the trade detail page' : 'Daily journal entry — edit from Day View'}
            </div>
            <div style={{ fontSize: 13, color: 'var(--text2)', whiteSpace: 'pre-wrap', lineHeight: 1.7 }}>{current.body}</div>
          </div>
        ) : editing ? (
          <NotebookEditor key={current.id} entry={current} folders={allFolders} onSave={e => { onSave(e); setEditing(false); }} onCancel={() => setEditing(false)} onDelete={() => handleDelete(current.id)} onMove={folderId => moveToFolder(current, folderId)} inp={inp} />
        ) : (
          <div>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 4 }}>
              <div style={{ fontSize: 20, fontWeight: 600 }}>{current.title}</div>
            </div>
            <div style={{ fontSize: 11, color: 'var(--text3)', marginBottom: 16, display: 'flex', alignItems: 'center', gap: 8 }}>
              Updated {new Date(current.updatedAt).toLocaleString()}
              <span style={{ padding: '1px 6px', borderRadius: 4, background: 'var(--violet-tint)', color: 'var(--violet-light)', fontSize: 10 }}>{allFolders.find(f => f.id === (current.folderId || 'my-notes'))?.name || 'My Notes'}</span>
            </div>
            <div style={{ fontSize: 13, color: 'var(--text2)', whiteSpace: 'pre-wrap', lineHeight: 1.7 }}>{current.body || <span style={{ color: 'var(--text3)', fontStyle: 'italic' }}>Empty note — click Edit to add content.</span>}</div>
          </div>
        )}
      </Card>
      {/* Template editor modal */}
      {editingTemplate && (
        <Modal open={true} onClose={() => setEditingTemplate(null)} width={560}>
          <TemplateEditor folder={allFolders.find(f => f.id === editingTemplate)} onSave={template => saveTemplate(editingTemplate, template)} onCancel={() => setEditingTemplate(null)} inp={inp} />
        </Modal>
      )}
    </div>
  );
}
// Note editor with folder picker
function NotebookEditor({ entry, folders, onSave, onCancel, onDelete, onMove, inp }) {
  const [title, setTitle] = useState(entry.title), [body, setBody] = useState(entry.body);
  const [folderId, setFolderId] = useState(entry.folderId || 'my-notes');
  const customFolders = folders.filter(f => !f.virtual);
  return (
    <div style={{ display: 'flex', flexDirection: 'column', gap: 12, height: '100%' }}>
      <input value={title} onChange={e => setTitle(e.target.value)} placeholder="Title" style={{ fontSize: 20, fontWeight: 600, background: 'transparent', border: 'none', borderBottom: '1px solid var(--border)', paddingBottom: 8, outline: 'none', color: 'var(--text)' }} />
      <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
        <span style={{ fontSize: 10, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.05em', fontWeight: 600 }}>Folder</span>
        <select value={folderId} onChange={e => setFolderId(e.target.value)} style={{ ...inp, width: 'auto', fontSize: 12, padding: '4px 8px' }}>
          {customFolders.map(f => <option key={f.id} value={f.id}>{f.name}</option>)}
        </select>
      </div>
      <textarea value={body} onChange={e => setBody(e.target.value)} placeholder="Write your thoughts, market analysis, lessons learned…" style={{ ...inp, flex: 1, minHeight: 400, resize: 'vertical', lineHeight: 1.7 }} />
      <div style={{ display: 'flex', gap: 8 }}>
        <button style={btnStyle('primary')} onClick={() => onSave({ ...entry, title, body, folderId, updatedAt: Date.now() })}>Save</button>
        <button style={btnStyle('ghost')} onClick={onCancel}>Cancel</button>
        <button style={{ ...btnStyle('danger'), marginLeft: 'auto' }} onClick={onDelete}>Delete</button>
      </div>
    </div>
  );
}
// Per-folder template editor — content auto-fills new notes created in this folder
function TemplateEditor({ folder, onSave, onCancel, inp }) {
  const [template, setTemplate] = useState(folder?.template || '');
  return (
    <div style={{ padding: 20 }}>
      <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 4 }}>Template for "{folder?.name}"</div>
      <div style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 12 }}>This text will auto-fill every new note you create in this folder. Useful for daily journals, trade recaps, watchlists, etc.</div>
      <textarea value={template} onChange={e => setTemplate(e.target.value)} placeholder={"Examples for Daily Journal:\n\nPre-Market Game Plan:\n\nWatchlist:\n\nWhat I Did Great:\n\nMistakes I Made:\n\nOverall Recap:"} style={{ ...inp, width: '100%', minHeight: 280, resize: 'vertical', lineHeight: 1.6, fontFamily: 'ui-monospace, monospace', fontSize: 12 }} />
      <div style={{ display: 'flex', gap: 8, marginTop: 14 }}>
        <button style={btnStyle('primary')} onClick={() => onSave(template)}>Save template</button>
        <button style={btnStyle('ghost')} onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

// ═══════════════ CALENDAR PAGE ═══════════════
function CalendarPage({ trades, onDayClick }) {
  const stats = useMemo(() => computeStats(trades), [trades]);
  // Month vs Year mode — Year mode shows 12 mini-calendars (one per month) with cells colored
  // by P&L, matching Tradezella's "Yearly Calendar" widget. Click any month tile to jump to it.
  const [mode, setMode] = useState('month');
  const [yearOffset, setYearOffset] = useState(0); // 0 = current year, -1 = previous
  if (!stats) return <div style={{ textAlign: 'center', padding: 40, color: 'var(--text3)' }}>No trades yet.</div>;
  const toggle = (m, label) => (
    <button onClick={() => setMode(m)} style={{ padding: '7px 18px', fontSize: 12, borderRadius: 'var(--r-sm)', border: 'none', cursor: 'pointer', background: mode === m ? 'var(--violet)' : 'transparent', color: mode === m ? '#fff' : 'var(--text2)', transition: 'background 0.12s var(--ease-out), color 0.12s var(--ease-out), border-color 0.12s var(--ease-out), opacity 0.12s var(--ease-out)' }}>{label}</button>
  );
  return (
    <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'inline-flex', background: 'var(--panel)', border: '1px solid var(--border)', borderRadius: 'var(--r-md)', padding: 3, alignSelf: 'flex-start' }}>
        {toggle('month', 'Month')}
        {toggle('year', 'Year')}
      </div>
      {mode === 'month' ? (
        <div className="force-stack" style={{ display: 'grid', gridTemplateColumns: 'minmax(0,1fr) 380px', gap: 14 }}>
          <CalendarView stats={stats} onDayClick={onDayClick} />
          <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}><DrawdownChart stats={stats} /><ScatterCard stats={stats} kind="time" /></div>
        </div>
      ) : (
        <YearlyCalendar stats={stats} yearOffset={yearOffset} setYearOffset={setYearOffset} onMonthClick={() => setMode('month')} />
      )}
    </div>
  );
}
// ═══════════════ YEARLY CALENDAR ═══════════════
// Compact overview of a full year. Each month is a 7-col mini-calendar with cells colored by
// daily P&L intensity. Stats per month appear under each grid. Inspired by Tradezella's
// "Yearly Calendar" dashboard widget — designed to expose seasonal patterns at a glance.
function YearlyCalendar({ stats, yearOffset, setYearOffset, onMonthClick }) {
  const year = new Date().getFullYear() + yearOffset;
  const months = useMemo(() => {
    const out = [];
    let yearlyTotal = 0, yearlyTrades = 0;
    for (let m = 0; m < 12; m++) {
      const firstDay = new Date(year, m, 1), lastDay = new Date(year, m + 1, 0);
      const days = [];
      for (let i = 0; i < firstDay.getDay(); i++) days.push(null);
      let monthPnL = 0, monthTrades = 0, tradingDays = 0;
      for (let d = 1; d <= lastDay.getDate(); d++) {
        const date = new Date(year, m, d);
        const k = dayKey(date);
        const data = stats?.byDay?.[k];
        days.push({ day: d, key: k, data });
        if (data) { monthPnL += data.pnl; monthTrades += data.trades; tradingDays++; }
      }
      yearlyTotal += monthPnL; yearlyTrades += monthTrades;
      out.push({ month: m, name: firstDay.toLocaleString('default', { month: 'long' }), days, pnl: monthPnL, trades: monthTrades, tradingDays });
    }
    return { months: out, yearlyTotal, yearlyTrades };
  }, [stats, year]);
  const maxAbs = useMemo(() => Math.max(...(stats?.daily || []).map(d => Math.abs(d.pnl)), 100), [stats]);
  const colorFor = (pnl) => {
    if (pnl == null || pnl === 0) return null;
    const a = 0.22 + Math.min(1, Math.abs(pnl) / maxAbs) * 0.43;
    return pnl > 0 ? `rgba(38,166,154,${a})` : `rgba(248,113,113,${a})`;
  };
  const navBtn = { padding: '4px 10px', borderRadius: 'var(--r-sm)', background: 'transparent', border: '1px solid var(--border)', color: 'var(--text2)', cursor: 'pointer', fontSize: 12 };
  return (
    <Card style={{ padding: 18 }}>
      {/* Year header with prev/next + total */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 18, flexWrap: 'wrap', gap: 12 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <button style={navBtn} onClick={() => setYearOffset(yearOffset - 1)}>‹</button>
          <div style={{ fontSize: 18, fontWeight: 600, minWidth: 60, textAlign: 'center' }}>{year}</div>
          <button style={navBtn} onClick={() => setYearOffset(yearOffset + 1)} disabled={yearOffset >= 0} title={yearOffset >= 0 ? 'Already on current year' : ''}>›</button>
          <button style={{ ...navBtn, fontSize: 10, padding: '4px 10px', textTransform: 'uppercase', letterSpacing: '0.05em' }} onClick={() => setYearOffset(0)}>This year</button>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 14, fontSize: 12 }}>
          <span style={{ color: 'var(--text3)' }}>Yearly P&L:</span>
          <span className="tabnum" style={{ fontWeight: 600, padding: '4px 10px', borderRadius: 'var(--r-sm)', background: months.yearlyTotal >= 0 ? 'var(--pill-green-bg)' : 'var(--pill-red-bg)', color: months.yearlyTotal >= 0 ? 'var(--pill-green-fg)' : 'var(--pill-red-fg)' }}>{fmtMoney(months.yearlyTotal, true)}</span>
          <span style={{ color: 'var(--text3)' }}>{months.yearlyTrades} trades</span>
        </div>
      </div>
      {/* 4x3 grid of months. On narrow widths it collapses to 2x6 or 1x12 */}
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(220px, 1fr))', gap: 14 }}>
        {months.months.map(m => (
          <div key={m.month} style={{ background: 'var(--panel2)', borderRadius: 'var(--r-md)', padding: 12, border: '1px solid var(--border)' }}>
            {/* Month header */}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 8 }}>
              <div style={{ fontSize: 13, fontWeight: 600 }}>{m.name}</div>
              {m.trades > 0 ? (
                <div className="tabnum" style={{ fontSize: 12, fontWeight: 600, color: m.pnl >= 0 ? 'var(--green-bright)' : 'var(--red)' }}>{fmtCompact(m.pnl)}</div>
              ) : (
                <div style={{ fontSize: 10, color: 'var(--text3)' }}>no trades</div>
              )}
            </div>
            {/* Mini-calendar grid: 7 weekday headers, then 6 weeks max of cells */}
            <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7, 1fr)', gap: 2 }}>
              {['S','M','T','W','T','F','S'].map((d, i) => (
                <div key={i} style={{ fontSize: 9.5, color: 'var(--text3)', textAlign: 'center', fontWeight: 600 }}>{d}</div>
              ))}
              {m.days.map((cell, i) => {
                if (!cell) return <div key={i} />;
                const c = colorFor(cell.data?.pnl);
                return (
                  <div key={i} title={cell.data ? `${cell.key}: ${fmtMoney(cell.data.pnl, true)} · ${cell.data.trades}t` : cell.key}
                    style={{ aspectRatio: '1', borderRadius: 2, background: c || 'transparent', border: cell.data ? '1px solid transparent' : '1px solid var(--calendar-empty-border)', fontSize: 9.5, color: cell.data ? (cell.data.pnl >= 0 ? 'var(--cell-text-green)' : 'var(--cell-text-red)') : 'var(--text3)', display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: cell.data ? 'pointer' : 'default' }}>
                    {cell.day}
                  </div>
                );
              })}
            </div>
            {/* Footer with day count */}
            {m.trades > 0 && (
              <div style={{ marginTop: 8, fontSize: 10, color: 'var(--text3)' }}>{m.tradingDays} days · {m.trades} trades</div>
            )}
          </div>
        ))}
      </div>
    </Card>
  );
}

// ═══════════════ PLAYBOOK (user's S&D + trendline strategy) ═══════════════
function Playbook({ playbookState, onSavePlaybookState }) {
  // Interactive pre-trade checklist; score out of total checks
  const checks = playbookState.checks || {};
  const [pair, setPair] = useState(playbookState.pair || 0);
  const completed = PLAYBOOK_CHECKS.filter(c => checks[c.id]).length;
  const pct = (completed / PLAYBOOK_CHECKS.length) * 100;
  const grade = pct === 100 ? { label: 'A+ — full alignment', color: 'var(--green-bright)' } : pct >= 80 ? { label: 'High probability', color: 'var(--green-bright)' } : pct >= 55 ? { label: 'Needs confirmation', color: '#fbbf24' } : { label: 'Low probability — skip', color: 'var(--red)' };
  const toggle = (id) => { const next = { ...checks, [id]: !checks[id] }; onSavePlaybookState({ ...playbookState, checks: next, pair }); };
  const reset = () => onSavePlaybookState({ ...playbookState, checks: {}, pair });
  const groups = [...new Set(PLAYBOOK_CHECKS.map(c => c.group))];
  const tf = TIMEFRAME_PAIRS[pair];

  return (
    <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      <Card style={{ padding: 18 }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', flexWrap: 'wrap', gap: 12, marginBottom: 4 }}>

          <button style={btnStyle('secondary')} onClick={reset}>Reset checklist</button>

      {/* Score banner */}
      <Card style={{ padding: 18 }}>
        <div style={{ display: 'grid', gridTemplateColumns: '1fr auto', gap: 16, alignItems: 'center' }}>
          <div>
            <div style={{ display: 'flex', alignItems: 'baseline', gap: 10 }}>
              <div className="tabnum" style={{ fontSize: 30, fontWeight: 700, color: grade.color }}>{completed}/{PLAYBOOK_CHECKS.length}</div>
              <div style={{ fontSize: 14, fontWeight: 600, color: grade.color }}>{grade.label}</div>
            </div>
            <div style={{ width: '100%', height: 8, background: 'var(--chart-grid)', borderRadius: 'var(--r-full)', overflow: 'hidden', marginTop: 10 }}>
              <div style={{ height: '100%', width: `${pct}%`, background: grade.color, transition: 'width 0.4s' }} />
            </div>
          </div>
        </div>
      </Card>

      {/* Timeframe pair selector */}
      <Card style={{ padding: 18 }}>
        <div style={{ fontWeight: 600, marginBottom: 4 }}>Timeframe pairing</div>
        <div style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 14 }}>Identify your HTF / MTF / LTF set before taking an impulse entry</div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginBottom: 16 }}>
          {TIMEFRAME_PAIRS.map((p, i) => (
            <button key={i} onClick={() => { setPair(i); onSavePlaybookState({ ...playbookState, checks, pair: i }); }}
              style={{ padding: '8px 12px', borderRadius: 'var(--r-md)', border: `1px solid ${pair === i ? 'var(--violet)' : 'var(--border2)'}`, background: pair === i ? 'rgba(16,185,129,0.12)' : 'var(--panel2)', color: pair === i ? 'var(--violet-light)' : 'var(--text2)', cursor: 'pointer', fontSize: 12, transition: 'background 0.12s var(--ease-out), color 0.12s var(--ease-out), border-color 0.12s var(--ease-out), opacity 0.12s var(--ease-out)' }}>
              {p.htf} · {p.mtf} · {p.ltf}
            </button>
          ))}
        </div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3,1fr)', gap: 10 }}>
          {[['HTF — trend', tf.htf], ['MTF — structure', tf.mtf], ['LTF — entry', tf.ltf]].map(([label, val], i) => (
            <div key={i} style={{ background: 'var(--panel2)', borderRadius: 'var(--r-md)', padding: 14, textAlign: 'center' }}>

      {/* Full rules reference */}
      <Card style={{ padding: 18 }}>
        <div style={{ fontWeight: 600, marginBottom: 4 }}>Rules reference</div>

          {PLAYBOOK_RULES.map((r, i) => (
            <div key={i} style={{ display: 'flex', gap: 12, padding: '10px 12px', background: 'var(--panel2)', borderRadius: 'var(--r-md)', fontSize: 13, color: 'var(--text2)' }}>

              <span style={{ lineHeight: 1.5 }}>{r}</span>
            </div>
          ))}
        </div>
        <div style={{ marginTop: 14, padding: 12, background: 'rgba(16,185,129,0.06)', border: '1px solid rgba(16,185,129,0.2)', borderRadius: 'var(--r-md)', fontSize: 12, color: 'var(--text2)' }}>
          Tip: tag your trades with these setups in Trade View (e.g. "WOW", "PCP", "fresh-zone") so the Reports insights can tell you which part of this system actually makes you money.
        </div>
      </Card>
    </div>
  );
}

// ═══════════════ ACCOUNT SUMMARY + OPEN POSITIONS + WORKING ORDERS ═══════════════

  const liveFloat = openPositions && openPositions.length ? openPositions.reduce((a, b) => a + (b.floatingPnL || 0) + (b.swap || 0), 0) : snapshot.floatingPnL;
  const items = [
    { label: 'Balance', value: fmtMoney(snapshot.balance), hint: 'Closed-trade account balance' },
    { label: 'Equity', value: fmtMoney(snapshot.equity), hint: 'Balance + floating P/L', accent: snapshot.equity >= snapshot.balance ? 'var(--green-bright)' : 'var(--red)' },
    { label: 'Floating P/L', value: fmtMoney(liveFloat, true), hint: 'Unrealized P/L on open positions', accent: liveFloat >= 0 ? 'var(--green-bright)' : 'var(--red)' },

    { label: 'Margin used', value: fmtMoney(snapshot.margin), hint: 'Margin locked by open positions' },

  return (
    <Card style={{ padding: 0, overflow: 'hidden' }}>

  );
}

  const locked = status.locked;

  const pctTrades = Math.min(100, status.count / Math.max(1, rules.maxDailyTrades) * 100);
  return (
    <Card style={{ padding: 0, overflow: 'hidden', border: locked ? '2px solid var(--red)' : (status.warnings.length ? '1px solid #f59e0b' : '1px solid var(--border)'), background: locked ? 'rgba(248,113,113,0.06)' : 'var(--panel)' }}>

            <div style={{ fontWeight: 700, fontSize: 15, color: locked ? 'var(--red)' : 'var(--text)' }}>

      )}
    </Card>
  );
}

// ═══════════════ PRE-TRADE GATE ═══════════════
// Forces the user to affirmatively check rules + playbook before saying OK-to-enter.
function PreTradeGate({ open, onClose, status, rules }) {
  const [proposedSize, setProposedSize] = useState('');
  const [proposedRisk, setProposedRisk] = useState('');
  const [checks, setChecks] = useState({
    plannedSize: false, slDefined: false, riskCalculated: false, htfAligned: false,
    properZone: false, notChasing: false, notRevenge: false, notFomo: false, willingLose: false,
  });
  const [confirmed, setConfirmed] = useState('');
  useEffect(() => { if (open) { setChecks({ plannedSize: false, slDefined: false, riskCalculated: false, htfAligned: false, properZone: false, notChasing: false, notRevenge: false, notFomo: false, willingLose: false }); setConfirmed(''); setProposedSize(''); setProposedRisk(''); } }, [open]);
  if (!open) return null;
  const size = parseFloat(proposedSize), risk = parseFloat(proposedRisk);
  const sizeBreach = !isNaN(size) && size > rules.maxPositionSizeLots;
  const sizeEscalation = !isNaN(size) && status.avgSize > 0 && size > status.avgSize * rules.maxSizeIncreaseFactor;
  const riskBreach = !isNaN(risk) && risk > rules.maxSingleTradeRisk;
  const wouldExceedDaily = !isNaN(risk) && (status.lossToday + risk) > rules.maxDailyLoss;
  const allChecked = Object.values(checks).every(v => v);
  const blockers = [
    ...status.breaches.map(b => b.text),
    ...(sizeBreach ? [`Proposed size ${size} lot exceeds your max ${rules.maxPositionSizeLots} lot.`] : []),
    ...(sizeEscalation ? [`Proposed size ${size} lot is more than ${rules.maxSizeIncreaseFactor}× today's average (${status.avgSize.toFixed(3)} lot) — that's escalation, not strategy.`] : []),
    ...(riskBreach ? [`Trade risk $${risk} exceeds your max single-trade risk $${rules.maxSingleTradeRisk}.`] : []),
    ...(wouldExceedDaily ? [`This trade's risk would push today's loss past your $${rules.maxDailyLoss} daily limit.`] : []),
    ...(!allChecked ? ['You must affirm every checklist item.'] : []),
    ...(confirmed.toUpperCase() !== 'I WILL FOLLOW MY PLAN' ? ['You must type the affirmation exactly.'] : []),
  ];
  const greenLight = blockers.length === 0;
  const checkRow = (key, label, severe = false) => (
    <label style={{ display: 'flex', alignItems: 'flex-start', gap: 10, padding: '9px 10px', borderRadius: 'var(--r-sm)', cursor: 'pointer', background: checks[key] ? 'rgba(38,166,154,0.06)' : 'transparent', border: `1px solid ${checks[key] ? 'rgba(38,166,154,0.25)' : 'var(--border)'}`, marginBottom: 6 }}>
      <input type="checkbox" checked={checks[key]} onChange={e => setChecks({ ...checks, [key]: e.target.checked })} style={{ marginTop: 2, accentColor: 'var(--green)', cursor: 'pointer' }} />
      <span style={{ fontSize: 13, lineHeight: 1.4, color: severe ? '#fbbf24' : 'var(--text2)' }}>{label}</span>
    </label>
  );
  return (
    <Modal open={open} onClose={onClose} width={680}>
      <div style={{ padding: '16px 22px', borderBottom: '1px solid var(--border)', display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexShrink: 0 }}>
        <div>
          <div style={{ fontWeight: 700, fontSize: 16 }}>Pre-trade gate</div>
          <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>Affirm every item before clicking buy / sell in your terminal</div>
        </div>

          </div>
          <div>
            <label style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600, display: 'block', marginBottom: 6 }}>$ at risk (entry → SL)</label>
            <input type="number" step="0.01" value={proposedRisk} onChange={e => setProposedRisk(e.target.value)} placeholder={`max $${rules.maxSingleTradeRisk}`} style={{ ...inputStyle, width: '100%', fontSize: 14, borderColor: riskBreach || wouldExceedDaily ? 'var(--red)' : 'var(--border2)' }} />
            {wouldExceedDaily && <div style={{ fontSize: 11, color: 'var(--red)', marginTop: 4 }}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Would breach daily cap</div>}
          </div>
        </div>
        <div style={{ fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text2)', fontWeight: 600, fontFamily: "'Geist', sans-serif", marginBottom: 8 }}>Strategy checks</div>
        {checkRow('plannedSize', 'My size is planned, not based on how I feel.')}
        {checkRow('slDefined', 'My stop-loss price is decided BEFORE I click buy/sell, not after.')}
        {checkRow('riskCalculated', 'I calculated the dollar risk. It fits my single-trade limit.')}
        {checkRow('htfAligned', 'HTF, MTF and LTF are aligned with the direction I am taking.')}
        {checkRow('properZone', 'This is a WOW / Fresh zone / PCP near a trendline (not a random entry).')}
        <div style={{ fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text2)', fontWeight: 600, fontFamily: "'Geist', sans-serif", marginTop: 14, marginBottom: 8 }}>Mind checks</div>
        {checkRow('notChasing', 'I am NOT entering because price already moved away from my level.', true)}
        {checkRow('notRevenge', 'I am NOT trying to win back a recent loss.', true)}
        {checkRow('notFomo', 'I am NOT entering because of FOMO — I would still take this trade if the move just started.', true)}
        {checkRow('willingLose', 'If this trade hits my stop, I will accept the loss, log it, and not retaliate.', true)}
        <div style={{ marginTop: 16 }}>
          <label style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600, display: 'block', marginBottom: 6 }}>Type to confirm: <span style={{ fontFamily: 'ui-monospace,monospace', color: 'var(--text)' }}>I will follow my plan</span></label>
          <input value={confirmed} onChange={e => setConfirmed(e.target.value)} placeholder="Type the words above" style={{ ...inputStyle, width: '100%', fontSize: 14 }} />
        </div>
        <div style={{ marginTop: 18, padding: 14, borderRadius: 'var(--r-md)', background: greenLight ? 'rgba(38,166,154,0.1)' : 'rgba(248,113,113,0.08)', border: `1.5px solid ${greenLight ? 'var(--green)' : 'var(--red)'}` }}>
          <div style={{ fontWeight: 700, fontSize: 15, color: greenLight ? 'var(--green-bright)' : 'var(--red)', marginBottom: greenLight ? 0 : 8 }}>
            {greenLight ? 'Clear to trade' : <span style={{display:'inline-flex',alignItems:'center',gap:5}}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M4.93 4.93l14.14 14.14"/></svg> DO NOT ENTER</span>}
          </div>
          {!greenLight && blockers.map((b, i) => <div key={i} style={{ fontSize: 13, color: 'var(--text2)', marginTop: 4 }}>• {b}</div>)}
        </div>
      </div>
    </Modal>
  );
}

        <input type="number" step={step} value={r[key]} onChange={e => update(key, parseFloat(e.target.value) || 0)} style={{ ...inputStyle, width: 110, fontSize: 14 }} />

            <div style={{ fontSize: 13, color: 'var(--text3)', marginTop: 4, maxWidth: 640 }}>These are <strong>your</strong> hard limits. The pre-trade gate and dashboard banner check against them. You can change them — but changing them mid-day to escape a breach is exactly the kind of self-deception this is designed to stop. Edit when you are calm, not after a loss.</div>
          </div>
          <button style={{ ...btnStyle('primary'), opacity: saved ? 0.6 : 1 }} onClick={() => { onSave(r); setSaved(true); setTimeout(() => setSaved(false), 2000); }}>{saved ? 'Saved' : 'Save rules'}</button>
        </div>
      </Card>
      <Card style={{ padding: 18 }}>
        <div style={{ fontWeight: 600, marginBottom: 14 }}>Per-day limits</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 18 }}>
          {num('maxDailyLoss', 'Max daily loss', '$', "If your day's running loss reaches this amount, the app marks you locked. Pick a number that hurts a little but doesn't take a week to recover from.", 5)}
          {num('maxDailyTrades', 'Max daily trade count', 'trades', 'Hard cap on number of closed trades per day. Over-trading is a top reason traders blow up.', 1)}
          {num('maxConsecutiveLosses', 'Cooldown trigger', 'losses in a row', 'After N losses back-to-back, the gate forces a cooldown wait.', 1)}
          {num('cooldownMinutes', 'Cooldown duration', 'minutes', 'Mandatory pause after the consecutive-loss trigger fires. Walk away, do not stare at charts.', 5)}
        </div>
      </Card>
      <Card style={{ padding: 18 }}>
        <div style={{ fontWeight: 600, marginBottom: 14 }}>Per-trade limits</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(280px, 1fr))', gap: 18 }}>
          {num('maxSingleTradeRisk', 'Max risk per trade', '$', 'Entry-to-SL distance × dollar-per-point × lot size. Should be no more than 1-2% of your account.', 5)}
          {num('maxPositionSizeLots', 'Max position size', 'lots', 'Hard cap on any single position. Helps prevent the "one big trade" that gives back the week.', 0.01)}
          {num('maxSizeIncreaseFactor', 'Max size escalation', '× today\'s avg', 'A new trade larger than this multiple of your current daily average is flagged as escalation, not strategy.', 0.5)}
        </div>
      </Card>
      <Card style={{ padding: 18 }}>
        <div style={{ fontWeight: 600, marginBottom: 8 }}>Why these rules?</div>
        <div style={{ fontSize: 13, color: 'var(--text2)', lineHeight: 1.7 }}>
          The journal can't stop you from clicking buy in MT5, but it can be the thing you check before each trade and the thing that holds the receipt afterward. Most blowup days follow the same shape: a win streak builds confidence, then one over-sized chase erases the gains. Daily caps stop the bleeding before the cascade. Single-trade caps stop the one-trade blowup. The size-escalation rule catches the moment you start thinking "this time I'll size up." If you fight these limits often, the right move is to look harder at your strategy — not the limits.
        </div>
