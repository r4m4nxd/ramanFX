// ═══════════════ TAG PICKER ═══════════════
// Reusable component for selecting tags from a known universe + adding new ones.
// - allTags: array of { tag, count } already in use across all notes (sorted by count desc)
// - value: array of currently-selected tags for THIS trade
// - onChange(nextArray): called when selection changes
// - accent: 'violet' (tags) or 'red' (mistakes) for visual distinction
function TagPicker({ allTags, value, onChange, accent = 'violet', placeholder = 'Type to search or add new…', emptyText = 'No tags yet — type one below to start.', onPurgeTag = null, tagCategoryMap = null, tagCategories = null, defaultCategoryId = null, onManageTagLibrary = null }) {
  const [input, setInput] = useState('');
  const norm = (s) => s.trim().toLowerCase().replace(/\s+/g, '-');
  const selected = value || [];
  const isPicked = (t) => selected.includes(t);
  const addTag = (raw) => {
    const t = norm(raw);
    if (!t || selected.includes(t)) { setInput(''); return; }
    onChange([...selected, t]);
    setInput('');
  };
  const removeTag = (t) => onChange(selected.filter(x => x !== t));
  const purgeFromLibrary = (e, tag, count) => {
    e.stopPropagation();
    if (!onPurgeTag) return;
    if (!confirm(`Remove "${tag}" from the library?\n\nIt is used on ${count} trade${count !== 1 ? 's' : ''}. This will delete it from all of them — you can't undo this.`)) return;
    onPurgeTag(tag);
    if (selected.includes(tag)) onChange(selected.filter(x => x !== tag));
  };
  const filter = norm(input);
  const suggestions = (allTags || []).filter(({ tag }) => !isPicked(tag) && (filter === '' || tag.includes(filter)));
  const exactMatch = filter && allTags?.some(({ tag }) => tag === filter);
  const canCreateNew = filter && !exactMatch && !isPicked(filter);
  const handleKeyDown = (e) => {
    if (e.key === 'Enter' || e.key === ',' || e.key === 'Tab') {
      if (input.trim()) { e.preventDefault(); addTag(input); }
    } else if (e.key === 'Backspace' && !input && selected.length > 0) {
      removeTag(selected[selected.length - 1]);
    }
  };
  // Compute per-chip color based on tag category. Falls back to the static accent prop if no
  // categorization data is provided (backward-compatible — mistake picker still works as before).
  const chipColorFor = (tag) => {
    if (tagCategories && tagCategoryMap !== null && defaultCategoryId !== 'mistake') {
      const cat = getTagCategory(tag, false, tagCategoryMap, tagCategories);
      // Map category color name to pill-* CSS vars
      const color = cat?.color || accent;
      return {
        bg: `var(--pill-${color}-bg)`,
        fg: `var(--pill-${color}-fg)`,
        border: `var(--pill-${color}-border)`,
      };
    }
    // Legacy single-accent rendering (used by mistakes picker)
    return {
      bg: accent === 'red' ? 'rgba(248,113,113,0.18)' : 'rgba(16,185,129,0.16)',
      fg: accent === 'red' ? '#ff8a87' : 'var(--violet-light)',
      border: accent === 'red' ? 'rgba(248,113,113,0.45)' : 'rgba(16,185,129,0.28)',
    };
  };
  return (
    <div>
      {/* Selected tag chips — each colored by its category if categories are wired up */}
      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, padding: '7px 8px', minHeight: 36, alignItems: 'center', background: 'var(--panel2)', border: '1px solid var(--border2)', borderRadius: 8 }}>
        {selected.map(t => {
          const c = chipColorFor(t);
          return (
            <span key={t} style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontSize: 12, padding: '3px 4px 3px 9px', borderRadius: 'var(--r-sm)', background: c.bg, border: `1px solid ${c.border}`, color: c.fg, fontWeight: 500 }}>
              {t}
              <button onClick={() => removeTag(t)} title="Remove from this trade" style={{ background: 'transparent', border: 'none', color: c.fg, cursor: 'pointer', fontSize: 14, lineHeight: 1, padding: '0 4px', borderRadius: 3, opacity: 0.7 }}
                onMouseEnter={e => { e.currentTarget.style.opacity = '1'; }} onMouseLeave={e => { e.currentTarget.style.opacity = '0.7'; }}>×</button>
            </span>
          );
        })}
        <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={handleKeyDown} placeholder={selected.length === 0 ? placeholder : ''}
          style={{ flex: 1, minWidth: 100, background: 'transparent', border: 'none', outline: 'none', color: 'var(--text)', fontSize: 13, fontFamily: 'inherit', padding: '2px 4px' }} />
      </div>
      {/* Suggestion chips — also colored by category */}
      <div style={{ marginTop: 8 }}>
        {(!allTags || allTags.length === 0) ? (
          <div style={{ fontSize: 11, color: 'var(--text3)', fontStyle: 'italic', padding: '4px 2px' }}>{emptyText}</div>
        ) : (
          <Fragment>
            <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600, marginBottom: 5, display: 'flex', alignItems: 'center', gap: 8 }}>
              <span>{filter ? `Matches "${filter}"` : `Existing (${allTags.length})`}</span>
              {canCreateNew && <span style={{ fontStyle: 'italic', textTransform: 'none', letterSpacing: 0, color: 'var(--violet-light)' }}>· press Enter to create new</span>}
              {onPurgeTag && !filter && allTags.length > 0 && <span style={{ fontStyle: 'italic', textTransform: 'none', letterSpacing: 0, color: 'var(--text3)' }}>· tap × on a chip to delete from library</span>}
              {/* Tag Library button — opens the categorization modal */}
              {onManageTagLibrary && (
                <button onClick={onManageTagLibrary} style={{ marginLeft: 'auto', background: 'transparent', border: '1px solid var(--border)', borderRadius: 5, color: 'var(--text2)', fontSize: 10, padding: '2px 8px', cursor: 'pointer', textTransform: 'none', letterSpacing: 0, fontWeight: 500 }}
                  onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--violet)'; e.currentTarget.style.color = 'var(--violet-light)'; }}
                  onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.color = 'var(--text2)'; }}>
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg> Manage categories
                </button>
              )}
            </div>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 4, maxHeight: 130, overflowY: 'auto' }}>
              {suggestions.length === 0 && filter && (
                <div style={{ fontSize: 11, color: 'var(--text3)', padding: '2px 4px' }}>No match — press Enter to add "{filter}" as new.</div>
              )}
              {suggestions.length === 0 && !filter && selected.length > 0 && (
                <div style={{ fontSize: 11, color: 'var(--text3)', padding: '2px 4px', fontStyle: 'italic' }}>All existing tags already selected.</div>
              )}
              {suggestions.slice(0, 30).map(({ tag, count }) => {
                const c = chipColorFor(tag);
                return (
                  <div key={tag} style={{ display: 'inline-flex', alignItems: 'stretch', borderRadius: 5, border: `1px solid ${c.border}`, overflow: 'hidden' }}>
                    <button onClick={() => addTag(tag)} title={`Add to this trade · used in ${count} trade${count !== 1 ? 's' : ''}`}
                      style={{ display: 'inline-flex', alignItems: 'center', gap: 4, fontSize: 11.5, padding: '3px 8px', background: 'transparent', border: 'none', color: c.fg, cursor: 'pointer', fontFamily: 'inherit', transition: 'background 0.12s var(--ease-out), color 0.12s var(--ease-out), opacity 0.12s var(--ease-out)' }}
                      onMouseEnter={e => { e.currentTarget.style.background = c.bg; }}
                      onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; }}>
                      + {tag}<span style={{ fontSize: 10, color: 'var(--text3)', fontWeight: 400 }}>×{count}</span>
                    </button>
                    {onPurgeTag && (
                      <button onClick={(e) => purgeFromLibrary(e, tag, count)} title={`Delete "${tag}" from library (removes from all ${count} trades)`}
                        style={{ padding: '0 6px', fontSize: 13, background: 'transparent', border: 'none', borderLeft: `1px solid ${c.border}`, color: 'var(--text3)', cursor: 'pointer', fontFamily: 'inherit', transition: 'background 0.12s var(--ease-out), color 0.12s var(--ease-out), opacity 0.12s var(--ease-out)' }}
                        onMouseEnter={e => { e.currentTarget.style.background = 'rgba(248,113,113,0.12)'; e.currentTarget.style.color = '#ff8a87'; }}
                        onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = 'var(--text3)'; }}>×</button>
                    )}
                  </div>
                );
              })}
              {suggestions.length > 30 && <span style={{ fontSize: 11, color: 'var(--text3)', padding: '3px 6px' }}>+{suggestions.length - 30} more — keep typing to narrow</span>}
            </div>
          </Fragment>
        )}
      </div>
    </div>
  );
}

// Compute the universe of tags from all notes — for tags OR mistakes (which key is passed in).
function gatherTagUniverse(allNotes, key = 'tags') {
  const counts = new Map();
  for (const n of Object.values(allNotes || {})) {
    const arr = Array.isArray(n?.[key]) ? n[key] : [];
    for (const raw of arr) {
      const t = (raw || '').trim().toLowerCase();
      if (!t) continue;
      counts.set(t, (counts.get(t) || 0) + 1);
    }
  }
  return Array.from(counts.entries()).map(([tag, count]) => ({ tag, count })).sort((a, b) => b.count - a.count || a.tag.localeCompare(b.tag));
}

// ═══════════════ DETAILED TRADE PAGE ═══════════════
function DetailedTradePage({ trade, note, strategies, attachments, allNotes, onSaveNote, onSaveAttachments, onClose, onPurgeTag, exitData, tagCategoryMap, tagCategories, onOpenTagLibrary }) {
  // Compute MAE/MFE estimation. (We don't have tick data, so approximate from open/close and SL/TP.)
  const net = netPnL(trade);
  const profit = net >= 0;
  const hold = holdSecs(trade);
  const [text, setText] = useState(note.note || '');
  const [tags, setTags] = useState(Array.isArray(note.tags) ? note.tags.map(t => t.toLowerCase()) : []);
  const [rating, setRating] = useState(note.rating || 0);
  const [strategyId, setStrategyId] = useState(note.strategyId || '');
  const [mistakes, setMistakes] = useState(Array.isArray(note.mistakes) ? note.mistakes.map(t => t.toLowerCase()) : []);
  const [saved, setSaved] = useState(false);
  const [pane, setPane] = useState('stats');
  const fileRef = useRef();
  const [lightbox, setLightbox] = useState(null);
  const allTags = useMemo(() => gatherTagUniverse(allNotes, 'tags'), [allNotes]);
  const allMistakes = useMemo(() => gatherTagUniverse(allNotes, 'mistakes'), [allNotes]);
  useEffect(() => { setSaved(false); }, [text, tags, rating, strategyId, mistakes]);
  const save = () => { onSaveNote({ note: text, tags, rating, strategyId: strategyId || null, mistakes, updatedAt: Date.now() }); setSaved(true); setTimeout(() => setSaved(false), 1800); };

  // Compute RamanFX Scale value for this trade (0-100, where 50 is breakeven)
  const rfxScale = (() => {
    if (net === 0) return 50;
    const target = trade.tp ? parseFloat(trade.tp) : null;
    const stop = trade.sl ? parseFloat(trade.sl) : null;
    if (target && stop && trade.openPrice) {
      const reward = Math.abs(target - trade.openPrice);
      const risk = Math.abs(trade.openPrice - stop);
      if (risk > 0) return Math.max(0, Math.min(100, 50 + (net > 0 ? (reward / risk) * 25 : -(risk / reward) * 25)));
    }
    return profit ? 75 : 25;
  })();

  const tradeAttachments = attachments[trade.id] || [];
  const [uploading, setUploading] = React.useState(false);
  const onFiles = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (!files.length) return;
    setUploading(true);
    const newAttachments = await Promise.all(files.map(async (f) => {
      const attId = `att_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
      // Try Supabase Storage first if user is logged in
      if (_supaUser) {
        const url = await supaUploadImage(_supaUser.id, (trade.account || 'default') + '_' + trade.id, attId, f);
        if (url) {
          return { id: attId, name: f.name, type: f.type, storageUrl: url, size: f.size, addedAt: Date.now() };
        }
      }
      // Fallback: base64 (offline or not logged in) — still compress first
      const compBlob = await compressImage(f);
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => resolve({ id: attId, name: f.name, type: f.type, dataUrl: ev.target.result, size: compBlob.size, addedAt: Date.now() });
        reader.readAsDataURL(compBlob);
      });
    }));
    setUploading(false);
    const next = [...tradeAttachments, ...newAttachments];
    onSaveAttachments(trade.id, next);
  };
  const removeAttachment = async (id) => {
    const att = tradeAttachments.find(a => a.id === id);
    // Delete from Storage if it was uploaded there
    if (att && att.storageUrl && _supaUser) {
      const ext = att.name.split('.').pop() || 'jpg';
      await supaDeleteImage(_supaUser.id, (trade.account || 'default') + '_' + trade.id, id, ext);
    }
    onSaveAttachments(trade.id, tradeAttachments.filter(a => a.id !== id));
  };

  const strategy = strategies.find(s => s.id === strategyId);

  return (
    <div className="fade-in">
      <div style={{ display: 'flex', alignItems: 'center', gap: 12, marginBottom: 14, flexWrap: 'wrap' }}>
        <button style={btnStyle('ghost')} onClick={onClose}>← Back</button>
        <div style={{ fontFamily: 'ui-monospace,monospace', fontSize: 22, fontWeight: 700 }}>{trade.symbol}</div>
        <Pill color={trade.type === 'buy' ? 'blue' : 'amber'}>{trade.type}</Pill>
        <Pill color={profit ? 'green' : net === 0 ? 'zinc' : 'red'}>{profit ? 'WIN' : net === 0 ? 'SCRATCH' : 'LOSS'}</Pill>
        <div style={{ color: 'var(--text3)', fontSize: 13 }}>{trade.closeTime?.split(' ')[0]}</div>
        <div style={{ marginLeft: 'auto', display: 'flex', alignItems: 'center', gap: 12 }}>
          <div style={{ textAlign: 'right' }}>
            <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)' }}>Net P&L</div>
            <div className="tabnum" style={{ fontSize: 24, fontWeight: 700, color: profit ? 'var(--green-bright)' : 'var(--red)' }}>{fmtMoney(net, true)}</div>
          </div>
        </div>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: useMobile() ? '1fr' : 'minmax(0,360px) minmax(0,1fr)', gap: 14 }}>
        {/* LEFT — stat panel */}
        <Card style={{ padding: 18 }}>
          <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', marginBottom: 4 }}>Net P&L</div>
          <div className="tabnum" style={{ fontSize: 28, fontWeight: 700, color: profit ? 'var(--green-bright)' : 'var(--red)', marginBottom: 14 }}>{fmtMoney(net, true)}</div>
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, fontSize: 13 }}>
            <Field label="Side" value={trade.type.toUpperCase()} />
            <Field label="Position ID" value={trade.id} mono />
            <Field label="Open Price" value={trade.openPrice} mono />
            <Field label="Close Price" value={trade.closePrice} mono />
            <Field label="Volume (lots)" value={trade.volume} mono />
            <Field label="Hold Time" value={fmtHold(hold)} mono />
            <Field label="Stop Loss" value={trade.sl || '—'} mono />
            <Field label="Take Profit" value={trade.tp || '—'} mono />
            <Field label="Open Time" value={trade.openTime?.split(' ')[1] || '—'} mono />
            <Field label="Close Time" value={trade.closeTime?.split(' ')[1] || '—'} mono />
            <Field label="Commission" value={fmt(trade.commission)} mono />
            <Field label="Swap" value={fmt(trade.swap)} mono />
            <Field label="Gross P&L" value={fmtMoney(trade.profit, true)} mono />
          </div>

          <div style={{ marginTop: 16, paddingTop: 14, borderTop: '1px solid var(--border)' }}>
            <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', marginBottom: 6 }}>RamanFX Scale</div>
            <div style={{ height: 10, background: 'var(--chart-grid)', borderRadius: 'var(--r-full)', position: 'relative', overflow: 'hidden' }}>
              <div style={{ position: 'absolute', top: 0, bottom: 0, width: 1, background: 'var(--border2)', left: '50%' }} />
              <div style={{ position: 'absolute', top: 0, bottom: 0, height: '100%', borderRadius: 'var(--r-full)', background: profit ? 'var(--green)' : 'var(--red)', ...(profit ? { left: '50%', width: `${rfxScale - 50}%` } : { right: '50%', width: `${50 - rfxScale}%` }) }} />
            </div>
            <div style={{ display: 'flex', justifyContent: 'space-between', marginTop: 4, fontSize: 10, color: 'var(--text3)' }}><span>Max Loss</span><span>Max Profit</span></div>
          </div>

          {/* Exit-quality insights — auto-generated from MAE/MFE/forward-time data if present */}
          {exitData && (() => {
            const insights = generateExitInsights(trade, exitData);
            const { mae, mfe, profitPts, t30m, t1h, t4h, t12h, t1d, dollarPerPt } = exitData;
            // Convert points to dollars using this position's specific ratio
            const toD = (pts) => pts != null && dollarPerPt != null ? pts * dollarPerPt : null;
            let mfeDol = toD(mfe);
            let maeDol = toD(mae);
            const tradeNet = (trade.profit || 0) + (trade.commission || 0) + (trade.swap || 0);
            // ── SANITY RECONCILIATION ──
            // The CSV is exported by a third-party MQL5 script and can have scale mismatches with
            // the journal — e.g., when the CSV row reflects a partial fill and the journal records
            // the whole position. Detect inconsistencies and either repair them or flag the data
            // as suspect so we don't display misleading numbers.
            //   Invariant 1: MFE_$ >= tradeNet   (peak must be at least where you closed)
            //   Invariant 2: MAE_$ <= min(0, tradeNet)   (worst point must be at least as bad as either zero or closed)
            // If either is violated, the CSV's $/pt ratio is wrong for this trade. We mark the data
            // suspect and show a banner instead of misleading numbers.
            let suspectData = false;
            if (mfeDol != null && tradeNet > mfeDol + 0.5) { // half-dollar tolerance for rounding
              suspectData = true;
            }
            if (maeDol != null && maeDol > Math.min(0, tradeNet) + 0.5) {
              suspectData = true;
            }
            const t30mDol = toD(t30m), t1hDol = toD(t1h), t4hDol = toD(t4h), t12hDol = toD(t12h), t1dDol = toD(t1d);
            const fmtD = (d) => d == null ? '—' : (d >= 0 ? '+$' : '-$') + Math.abs(d).toFixed(2);
            const levelStyle = {
              warning: { border: 'rgba(248,113,113,0.35)', bg: 'rgba(248,113,113,0.06)', accent: 'var(--red)' },
              caution: { border: 'rgba(251,191,36,0.35)', bg: 'rgba(251,191,36,0.05)', accent: '#fbbf24' },
              good:    { border: 'rgba(38,166,154,0.35)', bg: 'rgba(38,166,154,0.06)', accent: 'var(--green-bright)' },
            };
            // ── Mini "journey" chart ──
            // Shows the dollar range of this trade from MAE (worst) to MFE (best), with markers for
            // entry ($0), exit (where you actually closed), and the unrealized peak. The "left on
            // the table" gap between Exit and MFE is shaded so it visually screams at you.
            // ── Mini "journey" chart ──
            // Built with HTML/CSS (not SVG) so text never gets distorted by viewBox scaling.
            // Three vertical zones: top labels (MAE/MFE), center track, bottom labels (exit + gap).
            // Layout uses absolute positioning percentages off a relative parent for crisp rendering.
            const renderJourney = () => {
              if (mfeDol == null && maeDol == null) return null;
              const exit = tradeNet;
              // Compute axis range — symmetric around zero, padded
              const points = [0, exit];
              if (mfeDol != null) points.push(mfeDol);
              if (maeDol != null) points.push(maeDol);
              const min = Math.min(...points);
              const max = Math.max(...points);
              const range = max - min || 1;
              const pad = range * 0.10;
              const axisMin = min - pad, axisMax = max + pad;
              const axisRange = axisMax - axisMin;
              // Each marker's horizontal position as a percentage (0..100) of the chart's inner width
              const pct = (v) => ((v - axisMin) / axisRange) * 100;
              const zeroPct = pct(0);
              const exitPct = pct(exit);
              const mfePct = mfeDol != null ? pct(mfeDol) : null;
              const maePct = maeDol != null ? pct(maeDol) : null;
              const leftOnTable = (mfeDol != null && mfeDol > 0 && exit < mfeDol) ? mfeDol - exit : null;
              // Determine the FRAMING of the give-back caption.
              // Case A — closed in profit but below MFE: classic "left money on the table"
              //          (you really did leave realized profit behind that you could have taken).
              // Case B — closed in loss but MFE was positive at some point: NOT "left on the table"
              //          (the +$X was unrealized; the trade reversed and stopped out). The honest
              //          framing is "could have escaped with +$mfe instead of taking the loss."
              const giveBackMode = leftOnTable == null ? null
                : exit > 0 ? 'left' // closed positive → really did leave profit
                : 'missed';        // closed negative → missed an escape window
              // Determine whether the exit label should go below the track (default) or above,
              // to avoid colliding with MAE/MFE labels. If exit is within 12% of MAE or MFE,
              // and the label could overlap, flip the exit label to the other side.
              const tooCloseToMae = maePct != null && Math.abs(exitPct - maePct) < 14;
              const tooCloseToMfe = mfePct != null && Math.abs(exitPct - mfePct) < 14;
              // If close to MAE (which is labeled below by default in our new layout? no — we put
              // MAE+MFE labels ABOVE the track, and exit BELOW. So no overlap in normal case.)
              // But labels themselves are wide. Shift exit label horizontally if it would push past edges.
              return (
                <div style={{ marginBottom: 14, padding: '14px 14px 12px', background: 'var(--panel)', border: '1px solid var(--border)', color: 'var(--text)', borderRadius: 8 }}>
                  <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text3)', fontWeight: 700, marginBottom: 14 }}>The trade's journey ($)</div>
                  {/* Outer relative container holds all three zones */}
                  <div style={{ position: 'relative', height: 130, width: '100%' }}>
                    {/* ── TOP ZONE (height ~46px) — MAE label on left side of zero, MFE label on right ── */}
                    {maePct != null && maeDol < 0 && (
                      <div style={{ position: 'absolute', left: `${maePct}%`, top: 0, transform: 'translateX(-50%)', textAlign: 'center', whiteSpace: 'nowrap', zIndex: 2 }}>
                        <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--chart-tick)', fontWeight: 600, marginBottom: 2 }}>WORST (MAE)</div>
                        <div className="tabnum" style={{ fontSize: 15, fontWeight: 700, color: 'var(--red)' }}>{fmtD(maeDol)}</div>
                      </div>
                    )}
                    {mfePct != null && mfeDol > 0 && (
                      <div style={{ position: 'absolute', left: `${mfePct}%`, top: 0, transform: 'translateX(-50%)', textAlign: 'center', whiteSpace: 'nowrap', zIndex: 2 }}>
                        <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--chart-tick)', fontWeight: 600, marginBottom: 2 }}>BEST (MFE)</div>
                        <div className="tabnum" style={{ fontSize: 15, fontWeight: 700, color: 'var(--green-bright)' }}>{fmtD(mfeDol)}</div>
                      </div>
                    )}
                    {/* ── CENTER ZONE — the track itself ── */}
                    <div style={{ position: 'absolute', left: 0, right: 0, top: 55, height: 20 }}>
                      {/* Base track */}
                      <div style={{ position: 'absolute', left: '2%', right: '2%', top: 9, height: 2, background: 'var(--chart-tooltip-border)', borderRadius: 1 }} />
                      {/* Red bar from MAE to zero */}
                      {maePct != null && maeDol < 0 && (
                        <div style={{ position: 'absolute', left: `${maePct}%`, width: `${zeroPct - maePct}%`, top: 7, height: 6, background: 'var(--red)', opacity: 0.6, borderRadius: 3 }} />
                      )}
                      {/* Green bar from zero to MFE */}
                      {mfePct != null && mfeDol > 0 && (
                        <div style={{ position: 'absolute', left: `${zeroPct}%`, width: `${mfePct - zeroPct}%`, top: 7, height: 6, background: 'var(--green)', opacity: 0.6, borderRadius: 3 }} />
                      )}
                      {/* Zero baseline marker */}
                      <div style={{ position: 'absolute', left: `${zeroPct}%`, top: 0, transform: 'translateX(-50%)', width: 2, height: 20, background: 'var(--chart-baseline)', borderRadius: 1 }} />
                      {/* MAE dot */}
                      {maePct != null && maeDol < 0 && (
                        <div style={{ position: 'absolute', left: `${maePct}%`, top: 4, transform: 'translateX(-50%)', width: 14, height: 14, borderRadius: '50%', background: 'var(--red)', border: '2px solid #0c0c0e', boxShadow: '0 0 0 1px var(--red)' }} />
                      )}
                      {/* MFE dot */}
                      {mfePct != null && mfeDol > 0 && (
                        <div style={{ position: 'absolute', left: `${mfePct}%`, top: 4, transform: 'translateX(-50%)', width: 14, height: 14, borderRadius: '50%', background: 'var(--green-bright)', border: '2px solid #0c0c0e', boxShadow: '0 0 0 1px var(--green-bright)' }} />
                      )}
                      {/* Exit marker — diamond shape rotated square */}
                      <div style={{ position: 'absolute', left: `${exitPct}%`, top: 3, transform: 'translateX(-50%) rotate(45deg)', width: 14, height: 14, background: exit >= 0 ? 'var(--green-bright)' : 'var(--red)', border: '2px solid #0c0c0e', zIndex: 3 }} />
                    </div>
                    {/* ── BOTTOM ZONE — "$0" label + exit label + give-back highlight ── */}
                    {/* $0 baseline label — only show if it won't visually collide with the exit label */}
                    {Math.abs(exitPct - zeroPct) > 6 && (
                      <div style={{ position: 'absolute', left: `${zeroPct}%`, top: 80, transform: 'translateX(-50%)', fontSize: 10, color: 'var(--text3)', fontWeight: 500 }}>$0</div>
                    )}
                    {/* Exit label — sits below the track, with name + value stacked */}
                    <div style={{ position: 'absolute', left: `${exitPct}%`, top: 80, transform: 'translateX(-50%)', textAlign: 'center', whiteSpace: 'nowrap', zIndex: 4 }}>
                      <div className="tabnum" style={{ fontSize: 15, fontWeight: 700, color: exit >= 0 ? 'var(--green-bright)' : 'var(--red)' }}>{fmtD(exit)}</div>
                      <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--chart-tick)', fontWeight: 600, marginTop: 1 }}>YOU CLOSED</div>
                    </div>
                  </div>
                  {/* Give-back caption — different language for winners (truly left profit) vs losers (missed an escape) */}
                  {leftOnTable != null && leftOnTable > 0.01 && giveBackMode === 'left' && (
                    <div style={{ marginTop: 8, padding: '7px 11px', background: 'rgba(251,191,36,0.10)', border: '1px solid rgba(251,191,36,0.35)', borderRadius: 'var(--r-sm)', fontSize: 12, color: '#fbbf24', fontWeight: 600, textAlign: 'center' }}>
                      ⤴ Left <span className="tabnum">{fmtD(leftOnTable).replace('+', '')}</span> on the table (peak − exit)
                    </div>
                  )}
                  {leftOnTable != null && leftOnTable > 0.01 && giveBackMode === 'missed' && (
                    <div style={{ marginTop: 8, padding: '7px 11px', background: 'rgba(251,191,36,0.10)', border: '1px solid rgba(251,191,36,0.35)', borderRadius: 'var(--r-sm)', fontSize: 12, color: '#fbbf24', fontWeight: 600, textAlign: 'center' }}>
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Could have escaped with <span className="tabnum" style={{ color: 'var(--green-bright)' }}>+${(mfeDol || 0).toFixed(2)}</span> · instead took <span className="tabnum" style={{ color: 'var(--red)' }}>{fmtD(exit)}</span>
                    </div>
                  )}
                </div>
              );
            };
            return (
              <div style={{ marginTop: 16, paddingTop: 14, borderTop: '1px solid var(--border)' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 10 }}>
                  <span style={{ color: 'var(--violet-light)', fontSize: 13 }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></span>
                  <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600 }}>Exit quality (MAE / MFE data)</div>
                </div>
                {/* Suspect-data warning — shown when CSV-derived MFE/MAE conflict with the journal's actual closed P&L.
                    This typically means the CSV row captured only a partial fill of a position the journal recorded
                    in full, so the points-to-dollars ratio is off. Rather than show misleading numbers, we flag it. */}
                {suspectData && (
                  <div style={{ padding: '10px 12px', background: 'rgba(251,191,36,0.08)', border: '1px solid rgba(251,191,36,0.4)', borderRadius: 'var(--r-md)', marginBottom: 12 }}>
                    <div style={{ fontWeight: 600, fontSize: 12.5, color: '#fbbf24', marginBottom: 3 }}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg> Exit data looks inconsistent</div>
                    <div style={{ fontSize: 13, color: 'var(--text)', lineHeight: 1.6 }}>
                      The CSV reports a peak (MFE) of {fmtD(mfeDol)} but you closed at {fmtD(tradeNet)} — that's impossible (your peak can't be below your exit). This usually means the trade closed in partial fills and the CSV captured only one fill while the journal recorded the whole position. The MAE/MFE numbers below are <strong>unreliable for this trade</strong>; treat them as approximations only.
                    </div>
                  </div>
                )}
                {/* The mini journey chart — only shown when data is consistent */}
                {!suspectData && renderJourney()}
                {/* The numbers — DOLLARS when reliable, points-only fallback when suspect */}
                {!suspectData && (
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(110px, 1fr))', gap: 8, marginBottom: 12 }}>
                    {mfeDol != null && (
                      <div style={{ padding: '8px 10px', background: 'rgba(38,166,154,0.06)', border: '1px solid rgba(38,166,154,0.25)', borderRadius: 7 }}>
                        <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600 }}>MFE — best point</div>
                        <div className="tabnum" style={{ fontSize: 14, fontWeight: 700, color: 'var(--green-bright)' }}>{fmtD(mfeDol)}</div>
                        <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 1 }}>{mfe?.toLocaleString()}pt</div>
                      </div>
                    )}
                    {maeDol != null && (
                      <div style={{ padding: '8px 10px', background: 'rgba(248,113,113,0.06)', border: '1px solid rgba(248,113,113,0.25)', borderRadius: 7 }}>
                        <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600 }}>MAE — worst point</div>
                        <div className="tabnum" style={{ fontSize: 14, fontWeight: 700, color: 'var(--red)' }}>{fmtD(maeDol)}</div>
                        <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 1 }}>{mae?.toLocaleString()}pt</div>
                      </div>
                    )}
                    {profitPts != null && mfe != null && mfe > 0 && profitPts > 0 && (
                      <div style={{ padding: '8px 10px', background: 'var(--panel)', border: '1px solid var(--border)', color: 'var(--text)', borderRadius: 7 }}>
                        <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600 }}>Capture rate</div>
                        <div className="tabnum" style={{ fontSize: 14, fontWeight: 700, color: 'var(--text)' }}>{((profitPts / mfe) * 100).toFixed(0)}%</div>
                        <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 1 }}>of peak kept</div>
                      </div>
                    )}
                    {/* Tile changes meaning based on whether the trade closed positive or negative. */}
                    {mfeDol != null && mfeDol > 0 && tradeNet < mfeDol && tradeNet > 0 && (
                      <div style={{ padding: '8px 10px', background: 'rgba(251,191,36,0.06)', border: '1px solid rgba(251,191,36,0.25)', borderRadius: 7 }}>
                        <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600 }}>Left on table</div>
                        <div className="tabnum" style={{ fontSize: 14, fontWeight: 700, color: '#fbbf24' }}>{fmtD(mfeDol - tradeNet)}</div>
                        <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 1 }}>peak − exit profit</div>
                      </div>
                    )}
                    {mfeDol != null && mfeDol > 0 && tradeNet <= 0 && (
                      <div style={{ padding: '8px 10px', background: 'rgba(251,191,36,0.06)', border: '1px solid rgba(251,191,36,0.25)', borderRadius: 7 }}>
                        <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600 }}>Missed escape</div>
                        <div className="tabnum" style={{ fontSize: 14, fontWeight: 700, color: '#fbbf24' }}>+${mfeDol.toFixed(2)}</div>
                        <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 1 }}>could have exited here</div>
                      </div>
                    )}
                  </div>
                )}
                {/* Suspect-data fallback — show raw points only, no dollar conversion */}
                {suspectData && (
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(110px, 1fr))', gap: 8, marginBottom: 12 }}>
                    {mfe != null && (
                      <div style={{ padding: '8px 10px', background: 'var(--panel2)', border: '1px dashed var(--border2)', borderRadius: 'var(--r-sm)', opacity: 0.7 }}>
                        <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600 }}>MFE (raw points)</div>
                        <div className="tabnum" style={{ fontSize: 14, fontWeight: 700, color: 'var(--green-bright)' }}>+{mfe.toLocaleString()}pt</div>
                        <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 1 }}>$ conversion unreliable</div>
                      </div>
                    )}
                    {mae != null && (
                      <div style={{ padding: '8px 10px', background: 'var(--panel2)', border: '1px dashed var(--border2)', borderRadius: 'var(--r-sm)', opacity: 0.7 }}>
                        <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600 }}>MAE (raw points)</div>
                        <div className="tabnum" style={{ fontSize: 14, fontWeight: 700, color: 'var(--red)' }}>{mae.toLocaleString()}pt</div>
                        <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 1 }}>$ conversion unreliable</div>
                      </div>
                    )}
                  </div>
                )}
                {/* Forward-time mini ladder — only shown when data is consistent */}
                {!suspectData && (t30mDol != null || t1hDol != null || t4hDol != null || t12hDol != null || t1dDol != null) && (
                  <div style={{ padding: 10, background: 'var(--panel)', border: '1px solid var(--border)', color: 'var(--text)', borderRadius: 'var(--r-sm)', marginBottom: 12 }}>
                    <div style={{ fontSize: 9, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600, marginBottom: 8 }}>What if you'd held longer? ($ value)</div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', gap: 4, fontSize: 11 }}>
                      {[['+30m', t30mDol], ['+1h', t1hDol], ['+4h', t4hDol], ['+12h', t12hDol], ['+1d', t1dDol]].map(([label, val]) => (
                        <div key={label} style={{ textAlign: 'center', minWidth: 0, flex: 1 }}>
                          <div style={{ color: 'var(--text3)', fontSize: 10 }}>{label}</div>
                          <div className="tabnum" style={{ color: val == null ? 'var(--text3)' : val >= 0 ? 'var(--green-bright)' : 'var(--red)', fontWeight: 600 }}>{fmtD(val)}</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                {/* The insights themselves — only shown when data is reliable */}
                {!suspectData && insights.length > 0 && (
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                    {insights.map((ins, idx) => {
                      const s = levelStyle[ins.level] || levelStyle.caution;
                      return (
                        <div key={idx} style={{ padding: '10px 12px', background: s.bg, border: `1px solid ${s.border}`, borderRadius: 8 }}>
                          <div style={{ fontWeight: 600, fontSize: 12.5, color: s.accent, marginBottom: 3 }}>{ins.title}</div>
                          <div style={{ fontSize: 13, color: 'var(--text)', lineHeight: 1.6 }}>{ins.body}</div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </div>
            );
          })()}

          <div style={{ marginTop: 16, paddingTop: 14, borderTop: '1px solid var(--border)' }}>
            <label style={{ fontSize: 10, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.05em', display: 'block', marginBottom: 6 }}>Strategy</label>
            <select value={strategyId} onChange={e => setStrategyId(e.target.value)} style={{ ...inputStyle, width: '100%', cursor: 'pointer' }}>
              <option value="">— Select Strategy —</option>{strategies.map(p => <option key={p.id} value={p.id}>{p.name}</option>)}
            </select>
            {strategy?.description && <div style={{ marginTop: 6, fontSize: 11, color: 'var(--text3)' }}>{strategy.description}</div>}
          </div>

          <div style={{ marginTop: 14 }}>
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 6 }}>
              <label style={{ fontSize: 10, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Trade Rating</label>
              <div style={{ display: 'flex', gap: 3 }}>
                {[1, 2, 3, 4, 5].map(n => (
                  <span key={n} onClick={() => setRating(n === rating ? 0 : n)} style={{ cursor: 'pointer', fontSize: 18, lineHeight: 1, color: n <= rating ? '#fbbf24' : 'var(--border2)', transition: 'color 0.15s' }}><svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></span>
                ))}
              </div>
            </div>
          </div>

          <div style={{ marginTop: 14 }}>
            <label style={{ fontSize: 10, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.05em', display: 'block', marginBottom: 6 }}>Setups / Tags</label>
            <TagPicker allTags={allTags} value={tags} onChange={setTags} accent="violet" placeholder="Type a tag, press Enter…" emptyText="No tags yet — type one to start your tag library." onPurgeTag={onPurgeTag ? (t) => onPurgeTag(t, 'tags') : null} tagCategoryMap={tagCategoryMap} tagCategories={tagCategories} defaultCategoryId="setup" onManageTagLibrary={onOpenTagLibrary} />
          </div>

          <div style={{ marginTop: 14 }}>
            <label style={{ fontSize: 10, fontWeight: 600, color: 'var(--text3)', textTransform: 'uppercase', letterSpacing: '0.05em', display: 'block', marginBottom: 6 }}>Mistakes</label>
            <TagPicker allTags={allMistakes} value={mistakes} onChange={setMistakes} accent="red" placeholder="Type a mistake, press Enter…" emptyText="No mistakes logged yet (a good problem to have)." onPurgeTag={onPurgeTag ? (t) => onPurgeTag(t, 'mistakes') : null} />
          </div>

          <div style={{ marginTop: 14, display: 'flex', alignItems: 'center', gap: 10 }}>
            <button style={btnStyle('primary')} onClick={save}>Save</button>
            {saved && <span style={{ fontSize: 12, color: 'var(--green-bright)' }}><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6L9 17l-5-5"/></svg> Saved</span>}
          </div>
        </Card>

        {/* RIGHT — tabs */}
        <Card style={{ padding: 0, overflow: 'hidden' }}>
          <div style={{ display: 'flex', borderBottom: '1px solid var(--border)' }}>

function computeByDayOfWeek(trades) {
  const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const m = days.map(d => ({ day: d, trades: 0, wins: 0, losses: 0, net: 0, volume: 0 }));
  for (const t of trades) {
    const close = parseMT5Date(t.closeTime); if (!close) continue;
    const n = netPnL(t); const bucket = m[close.getDay()];
    bucket.trades++; bucket.net += n; bucket.volume += t.volume;
    if (n > 0) bucket.wins++; else if (n < 0) bucket.losses++;
  }
  return m.map(d => ({ ...d, winRate: d.trades ? d.wins / d.trades * 100 : 0 }));
}

function computeByHour(trades) {
  const hours = Array.from({ length: 24 }, (_, i) => ({ hour: i, label: `${String(i).padStart(2, '0')}:00`, trades: 0, wins: 0, net: 0 }));
  for (const t of trades) { const open = parseMT5Date(t.openTime); if (!open) continue; const h = open.getHours(); const n = netPnL(t); hours[h].trades++; hours[h].net += n; if (n > 0) hours[h].wins++; }
  return hours.map(h => ({ ...h, winRate: h.trades ? h.wins / h.trades * 100 : 0 }));
}

function computeByVolume(trades) {
  const bins = [{ k: '<0.01', max: 0.01 }, { k: '0.01-0.05', max: 0.05 }, { k: '0.05-0.10', max: 0.10 }, { k: '0.10-0.50', max: 0.50 }, { k: '0.50-1.00', max: 1.00 }, { k: '1.00+', max: Infinity }];
  const out = bins.map(b => ({ bucket: b.k, trades: 0, wins: 0, net: 0 }));
  for (const t of trades) { const n = netPnL(t); const idx = bins.findIndex(b => t.volume <= b.max); out[idx].trades++; out[idx].net += n; if (n > 0) out[idx].wins++; }
  return out.filter(o => o.trades > 0).map(o => ({ ...o, winRate: o.trades ? o.wins / o.trades * 100 : 0 }));
}

function ReportsComparePane({ trades }) {
  const symbols = useMemo(() => [...new Set(trades.map(t => t.symbol))].sort(), [trades]);
  const initG = () => ({ symbol: '', side: 'all', startDate: '', endDate: '', minVol: '', maxVol: '' });
  const [g1, setG1] = useState(initG);
  const [g2, setG2] = useState(initG);
  const [run, setRun] = useState(false);

  const filterTrades = (g) => trades.filter(t => {
    if (g.symbol && t.symbol !== g.symbol) return false;
    if (g.side !== 'all' && t.type !== g.side) return false;
    const close = parseMT5Date(t.closeTime);
    if (g.startDate && close) { const sd = new Date(g.startDate); if (close < sd) return false; }
    if (g.endDate && close) { const ed = new Date(g.endDate); ed.setHours(23, 59, 59); if (close > ed) return false; }
    const mn = parseFloat(g.minVol), mx = parseFloat(g.maxVol);
    if (!isNaN(mn) && t.volume < mn) return false;
    if (!isNaN(mx) && t.volume > mx) return false;
    return true;
  });

  const summary = (list) => {
    if (!list.length) return null;
    const net = list.reduce((a, b) => a + netPnL(b), 0);
    const wins = list.filter(t => netPnL(t) > 0).length;
    const losses = list.filter(t => netPnL(t) < 0).length;
    const winR = list.length ? wins / list.length * 100 : 0;
    const grossW = list.filter(t => netPnL(t) > 0).reduce((a, b) => a + netPnL(b), 0);
    const grossL = Math.abs(list.filter(t => netPnL(t) < 0).reduce((a, b) => a + netPnL(b), 0));
    const pf = grossL > 0 ? grossW / grossL : grossW > 0 ? Infinity : 0;
    let cum = 0;
    const equity = [...list].sort((a, b) => (parseMT5Date(a.closeTime) || 0) - (parseMT5Date(b.closeTime) || 0)).map((t, i) => ({ i: i + 1, equity: (cum += netPnL(t)), label: t.closeTime?.split(' ')[0] }));
    return { net, wins, losses, winR, pf, equity, count: list.length, avg: list.length ? net / list.length : 0 };
  };

  const r1 = run ? summary(filterTrades(g1)) : null;
  const r2 = run ? summary(filterTrades(g2)) : null;

  const groupForm = (g, setG, num) => (
    <Card style={{ padding: 16 }}>
      <div style={{ fontWeight: 600, marginBottom: 12 }}>Group #{num}</div>
      <div style={{ display: 'grid', gap: 10, gridTemplateColumns: 'auto 1fr', alignItems: 'center', fontSize: 13 }}>
        <label style={{ color: 'var(--text2)' }}>Symbol</label>
        <select value={g.symbol} onChange={e => setG({ ...g, symbol: e.target.value })} style={{ ...inputStyle, cursor: 'pointer' }}>
          <option value="">All symbols</option>{symbols.map(s => <option key={s} value={s}>{s}</option>)}
        </select>
        <label style={{ color: 'var(--text2)' }}>Side</label>
        <select value={g.side} onChange={e => setG({ ...g, side: e.target.value })} style={{ ...inputStyle, cursor: 'pointer' }}>
          <option value="all">All</option><option value="buy">Buy / Long</option><option value="sell">Sell / Short</option>
        </select>
        <label style={{ color: 'var(--text2)' }}>Start date</label>
        <input type="date" value={g.startDate} onChange={e => setG({ ...g, startDate: e.target.value })} style={inputStyle} />
        <label style={{ color: 'var(--text2)' }}>End date</label>
        <input type="date" value={g.endDate} onChange={e => setG({ ...g, endDate: e.target.value })} style={inputStyle} />
        <label style={{ color: 'var(--text2)' }}>Min volume</label>
        <input type="number" step="0.01" value={g.minVol} onChange={e => setG({ ...g, minVol: e.target.value })} placeholder="any" style={inputStyle} />
        <label style={{ color: 'var(--text2)' }}>Max volume</label>
        <input type="number" step="0.01" value={g.maxVol} onChange={e => setG({ ...g, maxVol: e.target.value })} placeholder="any" style={inputStyle} />
      </div>
    </Card>
  );

  const resultCard = (r, num) => (
    <Card style={{ padding: 18 }}>
      <div style={{ fontWeight: 600, marginBottom: 12 }}>Group #{num} results</div>
      {!r ? <div style={{ padding: 24, textAlign: 'center', color: 'var(--text3)' }}>No trades match these filters.</div> : (
        <Fragment>
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(110px,1fr))', gap: 12, marginBottom: 14 }}>
            <SummaryStat label="Net P&L" value={fmtMoney(r.net, true)} accent={r.net >= 0 ? 'var(--green-bright)' : 'var(--red)'} />
            <SummaryStat label="Trades" value={r.count} />
            <SummaryStat label="Win %" value={`${r.winR.toFixed(0)}%`} />
            <SummaryStat label="W / L" value={`${r.wins} / ${r.losses}`} />
            <SummaryStat label="Profit factor" value={r.pf === Infinity ? '∞' : r.pf.toFixed(2)} accent={r.pf >= 1 ? 'var(--green-bright)' : 'var(--red)'} />
            <SummaryStat label="Avg / trade" value={fmtMoney(r.avg, true)} accent={r.avg >= 0 ? 'var(--green-bright)' : 'var(--red)'} />
          </div>
          <ResponsiveContainer width="100%" height={180}>
            <AreaChart data={r.equity}>
              <defs><linearGradient id={`cg${num}`} x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={r.net >= 0 ? '#4ade80' : '#f87171'} stopOpacity={0.4} /><stop offset="100%" stopColor={r.net >= 0 ? '#4ade80' : '#f87171'} stopOpacity={0} /></linearGradient></defs>
              <CartesianGrid strokeDasharray="1 4" stroke="var(--chart-grid)" />
              <XAxis dataKey="label" tick={{ fontSize: 9, fill: 'var(--chart-tick)' }} axisLine={{ stroke: 'var(--chart-axis)' }} tickLine={false} interval="preserveStartEnd" />
              <YAxis tick={{ fontSize: 10, fill: 'var(--chart-tick)' }} axisLine={false} tickLine={false} tickFormatter={fmtCompact} />
              <ReferenceLine y={0} stroke="var(--chart-baseline)" strokeDasharray="2 2" />
              <Tooltip contentStyle={{ background: 'var(--chart-tooltip-bg)', border: '1px solid var(--chart-tooltip-border)', borderRadius: 'var(--r-md)', fontSize: 12, color: 'var(--chart-tooltip-text)' }} labelStyle={{ color: 'var(--chart-tooltip-text)', fontWeight: 600 }} itemStyle={{ color: 'var(--chart-tooltip-text)' }} formatter={v => [fmtMoney(v), 'Equity']} />

            </AreaChart>
          </ResponsiveContainer>
        </Fragment>
      )}
    </Card>
  );

  return (
    <Fragment>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(320px,1fr))', gap: 14 }}>
        {groupForm(g1, setG1, 1)}{groupForm(g2, setG2, 2)}
      </div>
      <div style={{ display: 'flex', gap: 8, justifyContent: 'flex-end' }}>
        <button style={btnStyle('secondary')} onClick={() => { setG1(initG()); setG2(initG()); setRun(false); }}>Reset</button>
        <button style={btnStyle('primary')} onClick={() => setRun(true)}>Generate report</button>
      </div>
      {run && (
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit,minmax(320px,1fr))', gap: 14 }}>
          {resultCard(r1, 1)}{resultCard(r2, 2)}
        </div>
      )}
    </Fragment>
  );
}
