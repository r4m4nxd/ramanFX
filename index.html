// ═══════════════ DATE RANGE FILTER ═══════════════
function DateRangeFilter({ value, onChange }) {
  const isMobile = useMobile();
  const [open, setOpen] = useState(false);
  const [customFrom, setCustomFrom] = useState('');
  const [customTo, setCustomTo] = useState('');
  const [pos, setPos] = useState({ top: 0, left: 0, width: 'auto' });
  const ref = useRef(null);
  const btnRef = useRef(null);
  const computePos = () => {
    const el = btnRef.current; if (!el) return;
    const r = el.getBoundingClientRect();
    const vw = window.innerWidth, vh = window.innerHeight;
    const DROPDOWN_W = isMobile ? Math.min(vw - 16, 340) : 300;
    const margin = 8;
    let left = r.right - DROPDOWN_W;          // right-align to button by default
    if (left < margin) left = margin;          // clamp left
    if (left + DROPDOWN_W > vw - margin) left = vw - DROPDOWN_W - margin; // clamp right
    let top = r.bottom + 6;
    // If too close to bottom, flip above
    if (top + 380 > vh && r.top > 380) top = r.top - 380 - 6;
    if (top < margin) top = margin;
    setPos({ top, left, width: DROPDOWN_W });
  };
  useEffect(() => {
    if (!open) return;
    computePos();
    const onScrollOrResize = () => computePos();
    const close = (e) => { if (ref.current && !ref.current.contains(e.target) && btnRef.current && !btnRef.current.contains(e.target)) setOpen(false); };
    document.addEventListener('mousedown', close);
    document.addEventListener('touchstart', close);
    window.addEventListener('resize', onScrollOrResize);
    window.addEventListener('scroll', onScrollOrResize, true);
    return () => {
      document.removeEventListener('mousedown', close);
      document.removeEventListener('touchstart', close);
      window.removeEventListener('resize', onScrollOrResize);
      window.removeEventListener('scroll', onScrollOrResize, true);
    };
  }, [open, isMobile]);

  const startOfDay = (d) => { const x = new Date(d); x.setHours(0, 0, 0, 0); return x; };
  const endOfDay = (d) => { const x = new Date(d); x.setHours(23, 59, 59, 999); return x; };
  const now = () => new Date();

  const presets = [
    { id: 'all', label: 'All time', range: () => ({ from: null, to: null, label: 'All time' }) },
    { id: 'today', label: 'Today', range: () => ({ from: startOfDay(now()), to: endOfDay(now()), label: 'Today' }) },
    { id: 'yesterday', label: 'Yesterday', range: () => { const d = now(); d.setDate(d.getDate() - 1); return { from: startOfDay(d), to: endOfDay(d), label: 'Yesterday' }; } },
    { id: '7d', label: 'Last 7 days', range: () => { const t = now(); const f = new Date(); f.setDate(f.getDate() - 7); return { from: startOfDay(f), to: t, label: 'Last 7 days' }; } },
    { id: '30d', label: 'Last 30 days', range: () => { const t = now(); const f = new Date(); f.setDate(f.getDate() - 30); return { from: startOfDay(f), to: t, label: 'Last 30 days' }; } },
    { id: '90d', label: 'Last 90 days', range: () => { const t = now(); const f = new Date(); f.setDate(f.getDate() - 90); return { from: startOfDay(f), to: t, label: 'Last 90 days' }; } },
    { id: 'thismonth', label: 'This month', range: () => { const n = now(); return { from: new Date(n.getFullYear(), n.getMonth(), 1), to: endOfDay(n), label: 'This month' }; } },
    { id: 'lastmonth', label: 'Last month', range: () => { const n = now(); const f = new Date(n.getFullYear(), n.getMonth() - 1, 1); const t = new Date(n.getFullYear(), n.getMonth(), 0, 23, 59, 59); return { from: f, to: t, label: 'Last month' }; } },
    { id: 'thisyear', label: 'This year', range: () => { const n = now(); return { from: new Date(n.getFullYear(), 0, 1), to: endOfDay(n), label: 'This year' }; } },
    { id: 'lastyear', label: 'Last year', range: () => { const n = now(); return { from: new Date(n.getFullYear() - 1, 0, 1), to: new Date(n.getFullYear() - 1, 11, 31, 23, 59, 59), label: 'Last year' }; } },
  ];

  const apply = (preset) => { onChange(preset.range()); setOpen(false); };
  const applyCustom = () => {
    if (!customFrom && !customTo) return;
    const from = customFrom ? new Date(customFrom + 'T00:00:00') : null;
    const to = customTo ? new Date(customTo + 'T23:59:59') : null;
    const fmtD = (s) => { if (!s) return '...'; const [y, m, d] = s.split('-'); return `${m}/${d}/${y.slice(2)}`; };
    onChange({ from, to, label: `${fmtD(customFrom)} → ${fmtD(customTo)}` });
    setOpen(false);
  };
  const isActive = !!(value?.from || value?.to);
  const fmtDate = (d, opts = { weekday: 'short', month: 'short', day: 'numeric' }) => d.toLocaleDateString(undefined, opts);
  const buttonText = (() => {
    if (!value?.from && !value?.to) return 'All time';
    const from = value.from, to = value.to;
    if (from && to) {
      const sameDay = from.toDateString() === to.toDateString();
      if (sameDay) return fmtDate(from, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
      const sameYear = from.getFullYear() === to.getFullYear();
      if (sameYear) return `${fmtDate(from)} → ${fmtDate(to)}, ${to.getFullYear()}`;
      return `${fmtDate(from, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })} → ${fmtDate(to, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}`;
    }
    if (from) return `From ${fmtDate(from, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}`;
    return `Until ${fmtDate(to, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })}`;
  })();
  const subLabel = isActive && value.label && value.label !== buttonText ? value.label : null;
  return (
    <Fragment>
      <button ref={btnRef} onClick={() => setOpen(!open)}
        style={{ display: 'inline-flex', alignItems: 'center', gap: 8, padding: '5px 12px', fontSize: 12, fontWeight: 500, borderRadius: 'var(--r-md)', border: `1px solid ${isActive ? 'var(--violet)' : 'var(--border2)'}`, background: isActive ? 'rgba(16,185,129,0.12)' : 'var(--panel2)', color: isActive ? 'var(--violet-light)' : 'var(--text)', cursor: 'pointer', transition: 'background 0.12s var(--ease-out), color 0.12s var(--ease-out), border-color 0.12s var(--ease-out), opacity 0.12s var(--ease-out)', textAlign: 'left', lineHeight: 1.2 }}>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start' }}>
          <span>{buttonText}</span>
          {subLabel && <span style={{ fontSize: 9.5, textTransform: 'uppercase', letterSpacing: '0.04em', color: isActive ? 'rgba(122,107,255,0.7)' : 'var(--text3)', marginTop: 1 }}>{subLabel}</span>}
        </span>
        <span style={{ marginLeft: 2, opacity: 0.7 }}>▾</span>
      </button>
      {open && (
        <div ref={ref} className="fade-in" style={{ position: 'fixed', top: pos.top, left: pos.left, width: pos.width, background: 'var(--panel)', border: '1px solid var(--border2)', borderRadius: 'var(--r-md)', padding: 12, zIndex: 1000, boxShadow: '0 14px 40px rgba(0,0,0,0.7)', maxHeight: 'calc(100vh - 20px)', overflowY: 'auto' }}>
          <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600, marginBottom: 8, paddingLeft: 4 }}>Quick select</div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 1 }}>
            {presets.map(p => {
              const active = value?.label === p.label;
              return (
                <button key={p.id} onClick={() => apply(p)}
                  style={{ padding: '7px 10px', textAlign: 'left', background: active ? 'rgba(16,185,129,0.12)' : 'transparent', border: 'none', color: active ? 'var(--violet-light)' : 'var(--text2)', cursor: 'pointer', fontSize: 13, borderRadius: 6 }}
                  onMouseEnter={e => { if (!active) e.currentTarget.style.background = 'var(--hover-tint)'; }}
                  onMouseLeave={e => { if (!active) e.currentTarget.style.background = 'transparent'; }}>
                  {p.label}
                </button>
              );
            })}
          </div>
          <div style={{ borderTop: '1px solid var(--border)', marginTop: 8, paddingTop: 12 }}>
            <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', fontWeight: 600, marginBottom: 8, paddingLeft: 4 }}>Custom range</div>
            <div style={{ display: 'flex', gap: 6, alignItems: 'center', marginBottom: 8 }}>
              <input type="date" value={customFrom} onChange={e => setCustomFrom(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 0 }} />
              <span style={{ color: 'var(--text3)' }}>→</span>
              <input type="date" value={customTo} onChange={e => setCustomTo(e.target.value)} style={{ ...inputStyle, flex: 1, minWidth: 0 }} />
            </div>
            <button style={{ ...btnStyle('primary'), width: '100%', justifyContent: 'center' }} onClick={applyCustom}>Apply</button>
          </div>
        </div>
      )}
    </Fragment>
  );
}

// ═══════════════ AI COACH ═══════════════
// Chat-based AI assistant that answers questions about the trader's actual data.
// Architecture:
//  - User provides their own API key (OpenAI-compatible, default gpt-4o-mini).
//  - Each message exchange POSTs to /v1/chat/completions with:
//      [system prompt, trade context JSON, ...conversation history, user question]
//  - Trade context = compact JSON summary built by buildAICoachContext() in logic.js.
//  - Conversations persist to localStorage so the user can revisit them.
//  - Quick prompts give starting questions for new users.
//
// Privacy: API key is stored in browser localStorage only. Trade data is sent to the
// configured endpoint with each request. Tell users this in the settings panel.
function AICoach({ trades, notes, stats, riskRules, exitData, config, onSaveConfig, conversations, onSaveConvos }) {
  const [activeConvoId, setActiveConvoId] = useState(conversations?.[0]?.id || null);
  const [input, setInput] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [showSettings, setShowSettings] = useState(!config?.apiKey); // show settings on first run
  const [tempConfig, setTempConfig] = useState(config || { apiKey: '', model: 'gpt-4o-mini', endpoint: '' });
  const messagesEndRef = useRef(null);
  // Auto-scroll on new messages
  useEffect(() => { messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }); }, [activeConvoId, conversations, loading]);
  const isMobile = useMobile();
  const activeConvo = conversations?.find(c => c.id === activeConvoId);
  const inp = { width: '100%', fontSize: 13, background: 'var(--panel2)', border: '1px solid var(--border2)', borderRadius: 'var(--r-sm)', padding: 8, color: 'var(--text)', outline: 'none' };
  const newConvo = () => {
    const c = { id: `ai_${Date.now()}`, title: 'New conversation', messages: [], createdAt: Date.now(), updatedAt: Date.now() };
    const next = [c, ...(conversations || [])];
    onSaveConvos(next);
    setActiveConvoId(c.id);
    setInput('');
    setError(null);
  };
  const deleteConvo = (id) => {
    if (!confirm('Delete this conversation?')) return;
    const next = conversations.filter(c => c.id !== id);
    onSaveConvos(next);
    if (activeConvoId === id) setActiveConvoId(next[0]?.id || null);
  };
  const saveConfigAndClose = () => {
    onSaveConfig(tempConfig);
    setShowSettings(false);
  };
  // Auto-title a conversation from its first user message (first 40 chars)
  const titleFromMessage = (text) => {
    const cleaned = text.replace(/\s+/g, ' ').trim();
    return cleaned.length > 40 ? cleaned.slice(0, 40) + '…' : cleaned;
  };
  const send = async (text) => {
    const q = (text ?? input).trim();
    if (!q) return;
    if (!config?.apiKey) { setError('Add your API key in settings first.'); setShowSettings(true); return; }
    setError(null);
    setInput('');
    // Ensure we have an active conversation
    let convo = activeConvo;
    let convoId = activeConvoId;
    let allConvos = conversations || [];
    if (!convo) {
      convo = { id: `ai_${Date.now()}`, title: titleFromMessage(q), messages: [], createdAt: Date.now(), updatedAt: Date.now() };
      convoId = convo.id;
      allConvos = [convo, ...allConvos];
      setActiveConvoId(convoId);
    }
    // Append user message
    const userMsg = { role: 'user', content: q, ts: Date.now() };
    convo = { ...convo, messages: [...convo.messages, userMsg], updatedAt: Date.now() };
    if (convo.messages.length === 1) convo.title = titleFromMessage(q);
    allConvos = allConvos.map(c => c.id === convoId ? convo : c);
    onSaveConvos(allConvos);
    setLoading(true);
    try {
      // Build context payload — gets injected as a system message after the main prompt
      const context = buildAICoachContext(trades, notes, stats, riskRules, exitData);
      const messages = [
        { role: 'system', content: AI_COACH_SYSTEM_PROMPT },
        { role: 'system', content: `Trader's current data:\n\n${JSON.stringify(context, null, 2)}` },
        ...convo.messages.map(m => ({ role: m.role, content: m.content })),
      ];
      const reply = await callAICoachAPI(messages, config);
      const aiMsg = { role: 'assistant', content: reply, ts: Date.now() };
      convo = { ...convo, messages: [...convo.messages, aiMsg], updatedAt: Date.now() };
      allConvos = allConvos.map(c => c.id === convoId ? convo : c);
      onSaveConvos(allConvos);
    } catch (e) {
      setError(e.message || 'Failed to call AI');
    } finally {
      setLoading(false);
    }
  };
  // Quick prompts shown for new/empty conversations
  const quickPrompts = [
    { icon: 'ico8', label: 'Review my last week', text: 'Review my trading from the last 7 days. What patterns do you see — good and bad?' },
    { icon: 'ico0', label: 'Find my biggest mistakes', text: 'Looking at my trade data, what are the 3 most expensive mistakes I keep making? Cite specific trades.' },
    { icon: 'good', label: 'My best setup', text: 'Which setup or symbol has been most profitable for me? Should I do more of it or is it noise?' },
    { icon: '⋯', label: 'Am I revenge trading?', text: 'Look for revenge-trading patterns in my data — sizing up after losses, trading more frequently after a bad day, etc.' },
    { icon: '⏰', label: 'Time-of-day patterns', text: 'When do I make money and when do I lose money during the day? Should I adjust my hours?' },
    { icon: 'ico2', label: 'How to improve next week', text: 'Based on my actual data, what are the 3 specific things I should focus on this coming week to improve?' },

  // ── Chat view ──

      </Card>
      {/* Chat thread */}
      <Card style={{ padding: 0, display: 'flex', flexDirection: 'column', maxHeight: 800 }}>

            <div style={{ fontSize: 14, fontWeight: 600 }}>{activeConvo?.title || 'AI Coach'}</div>

        <div style={{ flex: 1, overflowY: 'auto', padding: 18, display: 'flex', flexDirection: 'column', gap: 14 }}>
          {(!activeConvo || activeConvo.messages.length === 0) ? (
            // Welcome screen with quick prompts
            <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 18, padding: '20px 0' }}>
              <div style={{ fontSize: 40, opacity: 0.7 }}><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.1" strokeLinecap="round" strokeLinejoin="round"><path d="M9.5 2A2.5 2.5 0 017 4.5v0A2.5 2.5 0 019.5 7h5A2.5 2.5 0 0117 4.5v0A2.5 2.5 0 0114.5 2h-5z"/><path d="M9 7v10M15 7v10M9 12h6M7 17a2 2 0 001 3.732M17 17a2 2 0 01-1 3.732"/></svg></div>
              <div style={{ textAlign: 'center', maxWidth: 420 }}>
                <div style={{ fontSize: 16, fontWeight: 600, marginBottom: 6 }}>Ask anything about your trading</div>
                <div style={{ fontSize: 12, color: 'var(--text3)' }}>The coach reads your last {Math.min(trades?.length || 0, 50)} trades + stats and gives evidence-based feedback.</div>
              </div>
              <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: 8, width: '100%', maxWidth: 520 }}>
                {quickPrompts.map((qp, i) => (
                  <button key={i} onClick={() => send(qp.text)} disabled={loading} style={{ padding: 12, background: 'var(--panel)', border: '1px solid var(--border)', color: 'var(--text)', borderRadius: 'var(--r-md)', cursor: 'pointer', textAlign: 'left', display: 'flex', alignItems: 'center', gap: 10, fontSize: 12, color: 'var(--text)', transition: 'background 0.12s var(--ease-out), color 0.12s var(--ease-out), opacity 0.12s var(--ease-out)' }}
                    onMouseEnter={e => { e.currentTarget.style.borderColor = 'var(--violet)'; e.currentTarget.style.background = 'var(--hover-tint)'; }}
                    onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--border)'; e.currentTarget.style.background = 'var(--panel2)'; }}>
                    <span style={{ fontSize: 18 }}>{renderIcon(qp.icon, 16)}</span>
                    <span>{qp.label}</span>
                  </button>
                ))}
              </div>
            </div>
          ) : (
            activeConvo.messages.map((m, i) => (
              <div key={i} style={{ display: 'flex', flexDirection: 'column', alignItems: m.role === 'user' ? 'flex-end' : 'flex-start' }}>
                <div style={{ maxWidth: '88%', padding: '10px 14px', borderRadius: 'var(--r-md)', background: m.role === 'user' ? 'var(--violet-tint)' : 'var(--panel2)', border: `1px solid ${m.role === 'user' ? 'rgba(16,185,129,0.28)' : 'var(--border)'}`, fontSize: 13, lineHeight: 1.6, color: 'var(--text)', whiteSpace: 'pre-wrap' }}>
                  {m.content}
                </div>
                <div style={{ fontSize: 10, color: 'var(--text3)', marginTop: 3, padding: '0 8px' }}>{m.role === 'user' ? 'You' : 'Coach'} · {new Date(m.ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</div>
              </div>
            ))
          )}
          {loading && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '8px 14px', color: 'var(--text3)', fontSize: 12 }}>
              <div style={{ display: 'flex', gap: 4 }}>
                {[0, 1, 2].map(i => <div key={i} style={{ width: 6, height: 6, borderRadius: 'var(--r-full)', background: 'var(--violet-light)', opacity: 0.4, animation: `aiCoachPulse 1.2s infinite ${i * 0.2}s` }} />)}
              </div>
              Coach is thinking…
            </div>
          )}
          {error && (
            <div style={{ padding: 10, background: 'rgba(248,113,113,0.1)', border: '1px solid rgba(248,113,113,0.4)', borderRadius: 'var(--r-md)', color: 'var(--red)', fontSize: 12 }}>
              <strong>Error:</strong> {error}
            </div>
          )}
          <div ref={messagesEndRef} />
        </div>
        {/* Input row */}
        <div style={{ padding: 12, borderTop: '1px solid var(--border)', display: 'flex', gap: 8 }}>
          <input value={input} onChange={e => setInput(e.target.value)} onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } }} placeholder="Ask anything about your trading…" disabled={loading} style={{ ...inp, flex: 1 }} />
          <button onClick={() => send()} disabled={loading || !input.trim()} style={btnStyle('primary')}>Send</button>
        </div>
      </Card>
    </div>
  );
}

  // Effective width: 60px when collapsed on PC, 220px otherwise. Mobile drawer always 260px.

      {/* Collapse/expand toggle button — bottom of sidebar on PC only.
          Symbol points the direction the sidebar will move when clicked. */}
      {!isMobile && (
        <button onClick={() => setCollapsed(!collapsed)} title={collapsed ? 'Expand sidebar' : 'Collapse sidebar'}
          style={{ marginTop: 8, padding: isCollapsed ? '10px 0' : '8px 12px', background: 'transparent', border: 'none', color: 'var(--sidebar-text)', cursor: 'pointer', fontSize: 14, borderRadius: 'var(--r-md)', display: 'flex', alignItems: 'center', justifyContent: isCollapsed ? 'center' : 'flex-start', gap: 11, transition: 'background 0.12s var(--ease-out), color 0.12s var(--ease-out), border-color 0.12s var(--ease-out), opacity 0.12s var(--ease-out)' }}
          onMouseEnter={e => { e.currentTarget.style.background = 'var(--sidebar-hover-bg)'; e.currentTarget.style.color = 'var(--sidebar-text-hover)'; }}
          onMouseLeave={e => { e.currentTarget.style.background = 'transparent'; e.currentTarget.style.color = 'var(--sidebar-text)'; }}>
          <span style={{ fontSize: 16, width: 16, textAlign: 'center' }}>{collapsed ? '»' : '«'}</span>
          {!isCollapsed && <span style={{ fontSize: 12 }}>Collapse</span>}
        </button>
      )}
    </aside>
  );
  return (
    <Fragment>
      {aside}
      {isMobile && mobileOpen && (
        <div onClick={() => setMobileOpen(false)} style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.5)', backdropFilter: 'blur(2px)', zIndex: 49 }} />
      )}
    </Fragment>
  );
}

// ═══════════════ EXIT ANALYSIS PAGE ═══════════════
// Surfaces what the MAE/MFE/forward-time CSV data reveals about exit quality.
// Built specifically to answer "when should I have closed?"
function ExitAnalysisPage({ trades, exitData, onOpenTrade }) {
  const isMobile = useMobile();
  const enriched = useMemo(() => trades.map(t => ({ ...t, net: netPnL(t) })), [trades]);
  const stats = useMemo(() => computeExitStats(enriched, exitData), [enriched, exitData]);

  // Empty state — no CSV imported yet
  if (stats.total === 0) {
    return (
      <div className="fade-in">
        <Card style={{ padding: 32, textAlign: 'center' }}>
          <div style={{ fontSize: 32, marginBottom: 14 }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg></div>
          <div style={{ fontSize: 17, fontWeight: 600, marginBottom: 8 }}>Exit Analysis</div>
          <div style={{ fontSize: 13, color: 'var(--text2)', marginBottom: 18, maxWidth: 540, margin: '0 auto 18px', lineHeight: 1.6 }}>
            This page answers the question: <strong style={{ color: 'var(--text)' }}>"When should I have closed?"</strong> using MAE/MFE excursion data.
            Import the CSV from MQL5 script <a href="https://www.mql5.com/en/code/72326" target="_blank" rel="noreferrer" style={{ color: 'var(--violet-light)' }}>#72326</a> (free, runs in MT5) to unlock it.
          </div>
          <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 14 }}>Use the <strong style={{ color: 'var(--text2)' }}><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg> MAE/MFE CSV</strong> button in the header (or Settings on mobile) to upload the file.</div>
        </Card>
        {/* Explainer card */}
        <Card style={{ padding: 18, marginTop: 14 }}>
          <div style={{ fontWeight: 600, marginBottom: 12 }}>What is MAE / MFE?</div>
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : '1fr 1fr', gap: 14 }}>
            <div style={{ padding: 14, background: 'rgba(38,166,154,0.06)', border: '1px solid rgba(38,166,154,0.25)', borderRadius: 10 }}>
              <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--green-bright)', fontWeight: 700, marginBottom: 6 }}>MFE — Maximum Favorable Excursion</div>
              <div style={{ fontSize: 13, color: 'var(--text2)', lineHeight: 1.55 }}>The <strong style={{ color: 'var(--text)' }}>best point</strong> a trade reached in your favor before you closed it. Example: you bought XAUUSD at $4500. Price ran up to $4550 (you were up <strong style={{ color: 'var(--green-bright)' }}>+$50 unrealized</strong>), then dropped back. You closed at $4520 with only +$20 — your MFE was +$50.</div>
            </div>
            <div style={{ padding: 14, background: 'rgba(248,113,113,0.06)', border: '1px solid rgba(248,113,113,0.25)', borderRadius: 10 }}>
              <div style={{ fontSize: 11, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--red)', fontWeight: 700, marginBottom: 6 }}>MAE — Maximum Adverse Excursion</div>
              <div style={{ fontSize: 13, color: 'var(--text2)', lineHeight: 1.55 }}>The <strong style={{ color: 'var(--text)' }}>worst point</strong> a trade was against you before you closed it. Example: you bought XAUUSD at $4500. Price dropped to $4480 (you were down <strong style={{ color: 'var(--red)' }}>-$20 unrealized</strong>), then recovered. You closed at $4515 with +$15 — your MAE was -$20.</div>
            </div>
          </div>
          <div style={{ marginTop: 14, padding: 12, background: 'var(--panel)', border: '1px solid var(--border)', color: 'var(--text)', borderRadius: 'var(--r-md)', fontSize: 12.5, color: 'var(--text2)', lineHeight: 1.6 }}>
            <strong style={{ color: 'var(--violet-light)' }}>Why it matters:</strong> If most of your winners' MFE was much bigger than what you actually took home, you're <em>cutting winners early</em>. If your losers' MAE shows they went deeply against you fast, your entries are off. The script also calculates "if you'd held to T+1h / 4h / 1d, what would you have made?" — answering whether more patience would have helped or hurt.
          </div>
        </Card>
      </div>
    );
  }

  // Compute headline KPIs
  const captureColor = stats.avgCapture >= 70 ? 'var(--green-bright)' : stats.avgCapture >= 50 ? '#fbbf24' : 'var(--red)';
  const captureLabel = stats.avgCapture >= 70 ? 'Strong exits' : stats.avgCapture >= 50 ? 'Room to grow' : 'Cutting winners short';
  // Calculate the dollar leak — sum of money lost on trades that were profitable but turned into losses
  const dollarLeak = stats.turnedLossDollars;

  // Forward-time bar data — using dollar aggregates (computed by computeExitStats)
  const forwardBars = [
    { label: 'Actually closed', dol: stats.forwardSumsDol.actual, n: stats.forwardCounts.actual, key: 'actual' },
    { label: 'Held to T+30m', dol: stats.forwardSumsDol.t30m, n: stats.forwardCounts.t30m, key: 't30m' },
    { label: 'Held to T+1h', dol: stats.forwardSumsDol.t1h, n: stats.forwardCounts.t1h, key: 't1h' },
    { label: 'Held to T+4h', dol: stats.forwardSumsDol.t4h, n: stats.forwardCounts.t4h, key: 't4h' },
    { label: 'Held to T+12h', dol: stats.forwardSumsDol.t12h, n: stats.forwardCounts.t12h, key: 't12h' },
    { label: 'Held to T+1d', dol: stats.forwardSumsDol.t1d, n: stats.forwardCounts.t1d, key: 't1d' },
  ];
  const maxForwardAbs = Math.max(...forwardBars.map(b => Math.abs(b.dol)), 1);
  const bestForward = forwardBars.reduce((a, b) => b.dol > a.dol ? b : a);
  const actualForward = forwardBars[0];

  return (
    <div className="fade-in" style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
      {/* Header */}
      <Card style={{ padding: 18 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 4, flexWrap: 'wrap', gap: 8 }}>
          <div style={{ fontSize: 17, fontWeight: 600, display: 'flex', alignItems: 'center', gap: 8 }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Exit Analysis</div>
          <div style={{ fontSize: 12, color: 'var(--text3)' }}>Analyzing {stats.total} trades with MAE/MFE data</div>
        </div>
        <div style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 2 }}>Answers the question: "When should I have closed?" — all values shown in dollars</div>
      </Card>

      {/* Headline KPIs */}
      <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr 1fr' : 'repeat(4, 1fr)', gap: 12 }}>
        <Card style={{ padding: 14 }}>
          <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text3)', fontWeight: 700, marginBottom: 6 }}>MFE Capture</div>
          <div className="tabnum" style={{ fontSize: 28, fontWeight: 700, color: captureColor, lineHeight: 1 }}>{stats.avgCapture.toFixed(0)}%</div>
          <div style={{ fontSize: 11, color: captureColor, marginTop: 4, fontWeight: 600 }}>{captureLabel}</div>
          <div style={{ fontSize: 10.5, color: 'var(--text3)', marginTop: 3 }}>Median {stats.medianCapture.toFixed(0)}% · {stats.wonByMFE} winners</div>
        </Card>
        <Card style={{ padding: 14 }}>
          <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text3)', fontWeight: 700, marginBottom: 6 }}>Winners → Losers</div>
          <div className="tabnum" style={{ fontSize: 28, fontWeight: 700, color: stats.turnedLossCount > 0 ? 'var(--red)' : 'var(--green-bright)', lineHeight: 1 }}>{stats.turnedLossCount}</div>
          <div style={{ fontSize: 11, color: stats.turnedLossCount > 0 ? 'var(--red)' : 'var(--text3)', marginTop: 4 }}>{stats.turnedLossCount > 0 ? `${fmtMoney(Math.abs(dollarLeak))} bled` : 'Clean record'}</div>
          <div style={{ fontSize: 10.5, color: 'var(--text3)', marginTop: 3 }}>Was up &gt; 0, closed in loss</div>
        </Card>
        <Card style={{ padding: 14 }}>
          <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text3)', fontWeight: 700, marginBottom: 6 }}>$ Left on table</div>
          <div className="tabnum" style={{ fontSize: 22, fontWeight: 700, color: 'var(--red)', lineHeight: 1 }}>{fmtMoney(stats.giveBackDollars)}</div>
          <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 4 }}>across {stats.giveBackCount} winners</div>
          <div style={{ fontSize: 10.5, color: 'var(--text3)', marginTop: 3 }}>Profit you took less than the peak (winners only)</div>
        </Card>
        <Card style={{ padding: 14 }}>
          <div style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.06em', color: 'var(--text3)', fontWeight: 700, marginBottom: 6 }}>Best exit window</div>
          <div className="tabnum" style={{ fontSize: 22, fontWeight: 700, color: 'var(--violet-light)', lineHeight: 1 }}>{bestForward.label.replace('Held to ', '').replace('Actually closed', 'Now')}</div>
          <div style={{ fontSize: 11, color: bestForward.dol >= 0 ? 'var(--green-bright)' : 'var(--red)', marginTop: 4 }}>{fmtMoney(bestForward.dol, true)} total</div>
          <div style={{ fontSize: 10.5, color: 'var(--text3)', marginTop: 3 }}>If you mechanically held that long</div>
        </Card>
      </div>

      {/* Forward-time comparison chart */}
      <Card style={{ padding: 18 }}>
        <div style={{ marginBottom: 6 }}>
          <div style={{ fontWeight: 600 }}>What if you had held mechanically?</div>
          <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>Total dollars across all trades if every one had been closed at the same time interval after entry. Compare to your actual closing decisions.</div>
        </div>
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginTop: 14 }}>
          {forwardBars.map((b, i) => {
            const pct = (Math.abs(b.dol) / maxForwardAbs) * 100;
            const isActual = b.key === 'actual';
            const isBest = b.key === bestForward.key && !isActual;
            const positive = b.dol >= 0;
            return (
              <div key={b.key} style={{ display: 'grid', gridTemplateColumns: isMobile ? '110px 1fr 90px' : '140px 1fr 120px', alignItems: 'center', gap: 10 }}>
                <div style={{ fontSize: 12, color: isActual ? 'var(--violet-light)' : 'var(--text2)', fontWeight: isActual ? 700 : 500 }}>{b.label}{isBest && <span style={{ marginLeft: 6, fontSize: 9, padding: '1px 6px', background: 'rgba(38,166,154,0.18)', color: 'var(--green-bright)', borderRadius: 4, fontWeight: 700 }}>BEST</span>}</div>
                <div style={{ height: 22, background: 'var(--panel2)', borderRadius: 'var(--r-sm)', position: 'relative', overflow: 'hidden' }}>
                  <div style={{ position: 'absolute', top: 0, bottom: 0, left: '50%', width: 1, background: 'var(--border2)' }} />
                  <div style={{ position: 'absolute', top: 0, bottom: 0, [positive ? 'left' : 'right']: '50%', width: `${pct / 2}%`, background: positive ? 'var(--green)' : 'var(--red)', opacity: isActual ? 1 : 0.75, borderRadius: 3 }} />
                </div>
                <div className="tabnum" style={{ fontSize: 12, fontWeight: 600, color: positive ? 'var(--green-bright)' : 'var(--red)', textAlign: 'right' }}>{fmtMoney(b.dol, true)}</div>
              </div>
            );
          })}
        </div>
        {bestForward.key !== 'actual' && bestForward.dol > actualForward.dol && (
          <div style={{ marginTop: 14, padding: 11, background: 'rgba(16,185,129,0.06)', border: '1px solid rgba(16,185,129,0.22)', borderRadius: 'var(--r-md)', fontSize: 12.5, color: 'var(--text2)', lineHeight: 1.6 }}>
            <strong style={{ color: 'var(--violet-light)' }}>Insight:</strong> Mechanically holding every trade for <strong>{bestForward.label.replace('Held to ', '')}</strong> would have produced <strong>{fmtMoney(bestForward.dol - actualForward.dol, true)}</strong> more than your actual closing decisions. This doesn't mean "always hold longer" — it means your bias is to close too early. Consider trailing stops or partial scale-outs to capture more of these trends.
          </div>
        )}
        {bestForward.key === 'actual' && (
          <div style={{ marginTop: 14, padding: 11, background: 'rgba(38,166,154,0.06)', border: '1px solid rgba(38,166,154,0.25)', borderRadius: 'var(--r-md)', fontSize: 12.5, color: 'var(--text2)', lineHeight: 1.6 }}>
            <strong style={{ color: 'var(--green-bright)' }}>Good news:</strong> Your actual exit decisions beat every mechanical hold-time strategy. You're picking your moments well — just be aware of the {stats.turnedLossCount} cases where winners turned into losers.
          </div>
        )}
      </Card>

      {/* MFE vs Profit scatter — the visual "give back" picture, in dollars */}
      <Card style={{ padding: 18 }}>
        <div style={{ marginBottom: 12 }}>
          <div style={{ fontWeight: 600 }}>MFE vs realized profit ($)</div>
          <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>Each dot is a trade. X axis = peak unrealized profit in dollars (MFE). Y axis = what you actually closed at. Dots low on the Y axis with a high X = winners you gave back. Dots far below zero = winners that turned into losers.</div>
        </div>
        <ResponsiveContainer width="100%" height={isMobile ? 260 : 320}>
          <ScatterChart margin={{ top: 10, right: 10, bottom: 10, left: 0 }}>
            <CartesianGrid strokeDasharray="1 4" stroke="var(--chart-grid)" />
            <XAxis type="number" dataKey="mfeDol" name="MFE" tick={{ fontSize: 10, fill: 'var(--chart-tick)' }} axisLine={{ stroke: 'var(--chart-axis)' }} tickLine={false} tickFormatter={(v) => v >= 1000 ? `$${(v/1000).toFixed(1)}k` : `$${v.toFixed(0)}`} />
            <YAxis type="number" dataKey="profitDol" name="Profit" tick={{ fontSize: 10, fill: 'var(--chart-tick)' }} axisLine={false} tickLine={false} tickFormatter={(v) => v >= 1000 || v <= -1000 ? `$${(v/1000).toFixed(1)}k` : `$${v.toFixed(0)}`} />
            <ReferenceLine y={0} stroke="var(--chart-baseline)" strokeDasharray="2 2" />
            <Tooltip cursor={{ strokeDasharray: '3 3', stroke: 'var(--chart-baseline)' }} contentStyle={{ background: 'var(--chart-tooltip-bg)', border: '1px solid var(--chart-tooltip-border)', borderRadius: 'var(--r-md)', fontSize: 12, color: 'var(--chart-tooltip-text)' }} labelStyle={{ color: 'var(--chart-tooltip-text)', fontWeight: 600 }} itemStyle={{ color: 'var(--chart-tooltip-text)' }}
              formatter={(v, n) => {
                if (n === 'profitDol') return [(v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(2), 'Closed at'];
                if (n === 'mfeDol') return [(v >= 0 ? '+$' : '-$') + Math.abs(v).toFixed(2), 'Peak (MFE)'];
                return [v, n];
              }}
              labelFormatter={(v, payload) => payload?.[0]?.payload?.symbol || ''} />
            <Scatter data={stats.scatterData.filter(d => d.profitDol != null && d.profitDol >= 0)} fill="#4ade80" fillOpacity={0.7} />
            <Scatter data={stats.scatterData.filter(d => d.profitDol != null && d.profitDol < 0)} fill="#f87171" fillOpacity={0.7} />
          </ScatterChart>
        </ResponsiveContainer>
        <div style={{ display: 'flex', gap: 14, marginTop: 10, fontSize: 11, color: 'var(--text3)', flexWrap: 'wrap' }}>
          <span><span style={{ display: 'inline-block', width: 9, height: 9, background: '#4ade80', borderRadius: '50%', marginRight: 5 }} />Winner (closed in profit)</span>
          <span><span style={{ display: 'inline-block', width: 9, height: 9, background: '#f87171', borderRadius: '50%', marginRight: 5 }} />Loser (closed in loss)</span>
        </div>
      </Card>

      {/* Per-symbol exit quality table */}
      <Card style={{ padding: 18 }}>
        <div style={{ marginBottom: 12 }}>
          <div style={{ fontWeight: 600 }}>Per-symbol exit quality</div>
          <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>Which instruments do you exit well on, and which bleed you via give-backs?</div>
        </div>
        <div style={{ overflowX: 'auto' }}>
          <table style={{ width: '100%', fontSize: 12, borderCollapse: 'collapse' }}>
            <thead><tr style={{ fontSize: 10, textTransform: 'uppercase', letterSpacing: '0.05em', color: 'var(--text3)', borderBottom: '1px solid var(--border)' }}>
              <th style={{ padding: 10, textAlign: 'left' }}>Symbol</th>
              <th style={{ padding: 10, textAlign: 'right' }}>Trades</th>
              <th style={{ padding: 10, textAlign: 'right' }}>Capture</th>
              <th style={{ padding: 10, textAlign: 'right' }}>Turned losses</th>
              <th style={{ padding: 10, textAlign: 'right' }}>Net $</th>
            </tr></thead>
            <tbody>
              {stats.symbolStats.map(s => {
                const captureColor = s.captureRate >= 70 ? 'var(--green-bright)' : s.captureRate >= 40 ? '#fbbf24' : 'var(--red)';
                return (
                  <tr key={s.symbol} style={{ borderBottom: '1px solid var(--border)' }}>
                    <td style={{ padding: 10, fontFamily: 'ui-monospace,monospace', color: 'var(--text)' }}>{s.symbol}</td>
                    <td className="tabnum" style={{ padding: 10, textAlign: 'right', color: 'var(--text2)' }}>{s.count}</td>
                    <td className="tabnum" style={{ padding: 10, textAlign: 'right', color: captureColor, fontWeight: 600 }}>{s.captureRate.toFixed(0)}%</td>
                    <td className="tabnum" style={{ padding: 10, textAlign: 'right', color: s.turnedLoss > 0 ? 'var(--red)' : 'var(--text3)' }}>{s.turnedLoss}/{s.count} ({s.count > 0 ? (s.turnedLoss / s.count * 100).toFixed(0) : 0}%)</td>
                    <td className="tabnum" style={{ padding: 10, textAlign: 'right', fontWeight: 600, color: s.dollars >= 0 ? 'var(--green-bright)' : 'var(--red)' }}>{fmtMoney(s.dollars, true)}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>

      {/* Worst give-back trades — clickable */}
      {stats.scatterData.filter(d => d.profit < 0 && d.mfe > 50).length > 0 && (
        <Card style={{ padding: 18 }}>
          <div style={{ marginBottom: 12 }}>
            <div style={{ fontWeight: 600 }}>Top winners that turned into losers</div>
            <div style={{ fontSize: 12, color: 'var(--text3)', marginTop: 2 }}>These trades were in profit at some point but you held until they hit your stop. Tap to review.</div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
            {stats.scatterData
              .filter(d => d.profit < 0 && d.mfe > 50)
              .sort((a, b) => (b.mfeDol || b.mfe) - (a.mfeDol || a.mfe))
              .slice(0, 10).map(d => (
              <div key={d.id} onClick={() => onOpenTrade?.(d.id)} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 12px', background: 'rgba(248,113,113,0.06)', border: '1px solid rgba(248,113,113,0.25)', borderRadius: 'var(--r-md)', cursor: 'pointer', transition: 'background 0.15s', flexWrap: 'wrap', gap: 8 }}
                onMouseEnter={e => e.currentTarget.style.background = 'rgba(248,113,113,0.12)'} onMouseLeave={e => e.currentTarget.style.background = 'rgba(248,113,113,0.06)'}>
                <div style={{ display: 'flex', alignItems: 'center', gap: 10, minWidth: 0, flexWrap: 'wrap' }}>
                  <span style={{ fontFamily: 'ui-monospace,monospace', fontSize: 13, color: 'var(--text)', fontWeight: 600 }}>{d.symbol}</span>
                  <span style={{ fontSize: 11, color: 'var(--green-bright)' }}>peaked {d.mfeDol != null ? '+$' + d.mfeDol.toFixed(2) : '+' + d.mfe.toLocaleString() + 'pt'}</span>
                </div>
                <div className="tabnum" style={{ fontSize: 13, fontWeight: 600, color: 'var(--red)' }}>closed {fmtMoney(d.net, true)}</div>
              </div>
            ))}
          </div>
        </Card>
      )}
    </div>
  );
}

              {/* Data summary — Sync replaces the old Export/Import flow (same JSON payload) */}
              <div style={{ paddingBottom: 14, marginBottom: 14, borderBottom: '1px solid var(--border)' }}>
                <div style={{ fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text2)', fontWeight: 600, fontFamily: "'Geist', sans-serif", marginBottom: 8 }}>Data</div>
                <div style={{ fontSize: 12, color: 'var(--text3)' }}>{trades.length} trades · {Object.keys(notes).length} notes · {strategies.length} strategies · {notebook.length} notebook entries · {Object.values(attachments).reduce((a, arr) => a + (arr?.length || 0), 0)} images</div>
                <div style={{ fontSize: 11, color: 'var(--text3)', marginTop: 6, fontStyle: 'italic' }}>To back up or restore your data, use <strong style={{ color: 'var(--text2)' }}>Sync now</strong> / <strong style={{ color: 'var(--text2)' }}>Sync from file</strong> above. Same JSON format.</div>
              </div>
              {/* Danger zone */}
              <div>
                <div style={{ fontSize: 10.5, textTransform: 'uppercase', letterSpacing: '0.1em', color: 'var(--text2)', fontWeight: 600, fontFamily: "'Geist', sans-serif", marginBottom: 8 }}>Danger zone</div>
                <button style={btnStyle('danger')} onClick={resetEverything}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg> Reset everything</button>
              </div>
            </Card>
          )}
          {trades.length === 0 && tab !== 'playbook' ? (
            <div style={{ minHeight: '60vh', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
              <div style={{ textAlign: 'center', maxWidth: 420 }}>
                <div style={{ width: 64, height: 64, borderRadius: 'var(--r-xl)', background: 'linear-gradient(135deg,#10B981,#c026d3)', margin: '0 auto 20px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 28, fontWeight: 700, color: '#fff' }}>{BRAND[0]}</div>
                <div style={{ fontSize: 24, fontWeight: 600, marginBottom: 8 }}>Welcome to {BRAND}</div>
                <div style={{ fontSize: 14, color: 'var(--text2)', marginBottom: 24, lineHeight: 1.6 }}>A comprehensive trading journal. Import your MT5 history report to unlock the full dashboard — Day/Week view, Trade analytics, Calendar heatmap, Strategies, Notebook, Reports, and Progress tracking. Your Playbook is ready now in the sidebar.</div>
                <div style={{ display: 'flex', justifyContent: 'center' }}><UploadBtn onUpload={handleUpload} primary /></div>
              </div>
            </div>
          ) : (
            <Fragment>
              {detailTrade && (() => {
                const t = trades.find(x => x.id === detailTrade);
                if (!t) return null;
                return <DetailedTradePage trade={t} note={notes[t.id] || {}} strategies={strategies} attachments={attachments} allNotes={notes} onSaveNote={n => saveNote(t.id, n)} onSaveAttachments={saveAttachments} onClose={() => setDetailTrade(null)} onPurgeTag={purgeTagFromAllNotes} exitData={exitData[t.id]} tagCategoryMap={tagCategoryMap} tagCategories={allTagCategories} onOpenTagLibrary={() => setTagLibraryOpen(true)} />;
              })()}
              {!detailTrade && tab === 'dashboard' && <Dashboard trades={dateFilteredTrades} onDayClick={handleDayClick} checklist={checklist} checklistDays={checklistDays} onChecklistToggle={toggleChecklist} onChecklistEdit={editChecklist} setTab={setTab} snapshot={activeSnapshot} openPositions={filteredOpenPositions} workingOrders={filteredWorkingOrders} riskStatus={riskStatus} riskRules={riskRules} onOpenGate={() => setGateOpen(true)} deposits={dateFilteredDeposits} />}
              {!detailTrade && tab === 'dayweek' && <DayWeekView trades={dateFilteredTrades} dayNotes={dayNotes} onSaveDayNote={saveDayNote} focusDate={focusDate} exitData={exitData} onOpenTrade={id => setDetailTrade(id)} />}
              {!detailTrade && tab === 'trade' && <TradeView trades={dateFilteredTrades} notes={notes} strategies={strategies} exitData={exitData} onSaveNote={saveNote} onOpenTradeDetail={setDetailTrade} />}
              {!detailTrade && tab === 'positions' && <PositionsPage snapshot={activeSnapshot} openPositions={filteredOpenPositions} workingOrders={filteredWorkingOrders} deposits={dateFilteredDeposits} />}
              {!detailTrade && tab === 'playbook' && <Playbook playbookState={playbookState} onSavePlaybookState={savePlaybookState} />}
              {!detailTrade && tab === 'rules' && <RiskRules rules={riskRules} onSave={saveRiskRules} />}
              {!detailTrade && tab === 'notebook' && <Notebook entries={notebook} onSave={saveNotebookEntry} onDelete={deleteNotebookEntry} folders={notebookFolders} onSaveFolder={saveNotebookFolder} onDeleteFolder={deleteNotebookFolder} trades={trades} notes={notes} dayNotes={dayNotes} />}
              {!detailTrade && tab === 'reports' && <Reports trades={dateFilteredTrades} setTab={setTab} />}
              {!detailTrade && tab === 'exit' && <ExitAnalysisPage trades={dateFilteredTrades} exitData={exitData} onOpenTrade={(id) => setDetailTrade(id)} />}
              {!detailTrade && tab === 'coach' && <AICoach trades={dateFilteredTrades} notes={notes} stats={computeStats(dateFilteredTrades)} riskRules={riskRules} exitData={exitData} config={aiCoachConfig} onSaveConfig={saveAICoachConfig} conversations={aiCoachConvos} onSaveConvos={saveAICoachConvos} />}
              {!detailTrade && tab === 'strategies' && <Strategies strategies={strategies} trades={dateFilteredTrades} notes={notes} onSave={saveStrategy} onDelete={deleteStrategy} />}
              {!detailTrade && tab === 'calendar' && <CalendarPage trades={dateFilteredTrades} onDayClick={handleDayClick} />}
              {!detailTrade && tab === 'progress' && <ProgressPage trades={dateFilteredTrades} checklist={checklist} checklistDays={checklistDays} />}
            </Fragment>
          )}
        </main>
      </div>
      {daySummary && (() => {
        const stats = computeStats(dateFilteredTrades);
        return <DaySummaryPopup dayKey={daySummary} stats={stats} existingNote={dayNotes[daySummary]} onClose={() => setDaySummary(null)} onViewDetails={handleDayDetails} onAddNote={handleDayAddNote} />;
      })()}
      <PreTradeGate open={gateOpen} onClose={() => setGateOpen(false)} status={riskStatus} rules={riskRules} />
      <TagLibrary open={tagLibraryOpen} onClose={() => setTagLibraryOpen(false)} allNotes={notes} tagCategoryMap={tagCategoryMap} onSaveTagCategoryMap={saveTagCategoryMap} tagCategories={allTagCategories} onSaveCategory={saveTagCategory} onDeleteCategory={deleteTagCategory} trades={trades} />
      {/* Floating sync button — always reachable; shows amber dot when unsynced changes */}
      {(() => {
        const isDirty = lastDirty && (!lastExportAt || lastDirty > lastExportAt);
        return (
          <div className="rfx-float-bottom" style={{ '--rfx-float-offset': isMobile ? '18px' : '26px', position: 'fixed', left: isMobile ? 18 : (sidebarCollapsed ? 60 : 220) + 18, zIndex: 40, display: 'flex', flexDirection: 'column', gap: 8, alignItems: 'flex-start', transition: 'left 0.2s ease' }}>
            {syncStatus && (
              <div className="fade-in" style={{ background: 'var(--panel)', border: '1px solid var(--green)', color: 'var(--green-bright)', borderRadius: 'var(--r-md)', padding: '8px 14px', fontSize: 12, fontWeight: 600, boxShadow: '0 6px 20px rgba(0,0,0,0.5)' }}>{syncStatus}</div>
            )}
            <button onClick={syncExport} title={isDirty ? 'You have unsynced changes — tap to sync' : 'Sync now'}
              style={{ position: 'relative', padding: '9px 16px', borderRadius: 'var(--r-full)', border: isDirty ? 'none' : '1px solid var(--border2)', cursor: 'pointer', background: isDirty ? '#f59e0b' : 'rgba(16,16,19,0.95)', color: isDirty ? '#000' : 'var(--text2)', fontWeight: 600, fontSize: 12, boxShadow: isDirty ? '0 4px 20px rgba(245,158,11,0.35)' : '0 4px 16px rgba(0,0,0,0.5)', display: 'flex', alignItems: 'center', gap: 6, backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)', transition: 'background 0.15s ease, box-shadow 0.15s ease, color 0.15s ease' }}>
              <span style={{ fontSize: 12 }}>↻</span>{isDirty ? 'Sync (unsaved)' : 'Sync'}
            </button>
          </div>
        );
      })()}
      {/* Dashboard brand watermark — faint mark, visible in screenshots */}
      {tab === 'dashboard' && !isMobile && (
        <img src={window.RFX_LOGO} alt="" aria-hidden="true" className="rfx-float-bottom"
          style={{ '--rfx-float-offset': '88px', position: 'fixed', right: 24, zIndex: 30, width: 30, height: 30, borderRadius: 7, opacity: 0.42, pointerEvents: 'none', filter: 'drop-shadow(0 2px 6px rgba(0,0,0,0.3))' }} />
      )}
      {/* Floating gate button — always reachable */}
      {trades.length > 0 && !gateOpen && (
        <button onClick={() => setGateOpen(true)} title="Pre-trade gate" className="rfx-float-bottom"
          style={{ '--rfx-float-offset': isMobile ? '18px' : '26px', position: 'fixed', right: isMobile ? 18 : 26, zIndex: 40, padding: '10px 18px', borderRadius: 'var(--r-full)', border: `1px solid ${riskStatus.locked ? 'rgba(248,113,113,0.4)' : 'rgba(16,185,129,0.24)'}`, cursor: 'pointer', background: riskStatus.locked ? 'rgba(248,113,113,0.9)' : 'rgba(16,185,129,0.9)', color: '#fff', fontWeight: 600, fontSize: 13, letterSpacing: '-0.01em', boxShadow: riskStatus.locked ? '0 4px 20px rgba(248,113,113,0.4)' : '0 4px 20px rgba(16,185,129,0.32)', display: 'flex', alignItems: 'center', gap: 7, backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)', transition: 'background 0.15s ease, box-shadow 0.15s ease' }}>
          <span style={{ fontSize: 14, fontStyle: 'normal' }}>{riskStatus.locked ? "×" : '◈'}</span>{riskStatus.locked ? 'Locked' : 'Pre-trade gate'}
        </button>
      )}
    </div>

    {/* ── Cloud Login Modal ── */}
    {showCloudModal && (
      <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.65)', zIndex: 1000, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
        <div style={{ background: 'var(--panel)', border: '1px solid rgba(255,255,255,0.08)', borderRadius: 'var(--r-xl)', padding: 28, maxWidth: 400, width: '100%', boxShadow: '0 20px 60px rgba(0,0,0,0.6)' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 18 }}>
            <div style={{ fontWeight: 700, fontSize: 15 }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/></svg> Cloud Sync</div>
            <button style={{ background: 'none', border: 'none', color: 'var(--text)', cursor: 'pointer', fontSize: 18 }} onClick={() => { setShowCloudModal(false); setCloudMsg(''); }}><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
          </div>
          {cloudUser ? (
            <div>
              <div style={{ fontSize: 13, color: 'var(--text2)', marginBottom: 8 }}>Signed in as</div>
              <div style={{ fontWeight: 600, fontSize: 14, marginBottom: 18, color: 'var(--violet-light)' }}>{cloudUser.email}</div>
              <div style={{ fontSize: 12, color: 'var(--text3)', marginBottom: 16, lineHeight: 1.6 }}>
                Your trades auto-sync to the cloud after every MT5 import. Access your journal from any device at this same URL.
              </div>
              <button style={{ width: '100%', padding: '10px 0', borderRadius: 'var(--r-md)', border: '1px solid var(--red)', background: 'none', color: 'var(--red)', cursor: 'pointer', fontWeight: 600, fontSize: 13 }} onClick={handleCloudLogout}>Sign out</button>
            </div>
          ) : (
            <div>
              <div style={{ fontSize: 13, color: 'var(--text2)', marginBottom: 14, lineHeight: 1.6 }}>
                Sign in with your Supabase account to sync trades across all devices.
              </div>
              <input
                type="email" placeholder="Email" value={cloudEmail}
                onChange={e => setCloudEmail(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleCloudLogin()}
                style={{ width: '100%', padding: '10px 14px', borderRadius: 'var(--r-md)', border: '1px solid var(--border)', background: 'var(--input-bg)', color: 'var(--text)', fontSize: 14, fontFamily: 'inherit', transition: 'border-color 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out)', marginBottom: 10, boxSizing: 'border-box' }}
              />
              <input
                type="password" placeholder="Password" value={cloudPassword}
                onChange={e => setCloudPassword(e.target.value)}
                onKeyDown={e => e.key === 'Enter' && handleCloudLogin()}
                style={{ width: '100%', padding: '10px 14px', borderRadius: 'var(--r-md)', border: '1px solid var(--border)', background: 'var(--input-bg)', color: 'var(--text)', fontSize: 14, fontFamily: 'inherit', transition: 'border-color 0.15s var(--ease-out), box-shadow 0.15s var(--ease-out)', marginBottom: 12, boxSizing: 'border-box' }}
              />
              <button
                style={{ width: '100%', padding: '10px 0', borderRadius: 'var(--r-md)', border: 'none', background: 'var(--violet)', color: '#fff', cursor: cloudLoading ? 'default' : 'pointer', fontWeight: 700, fontSize: 14, opacity: cloudLoading ? 0.7 : 1 }}
                onClick={handleCloudLogin} disabled={cloudLoading}>
                {cloudLoading ? 'Signing in…' : 'Sign in'}
              </button>
              {cloudMsg && <div style={{ marginTop: 12, fontSize: 12, color: 'var(--red)', lineHeight: 1.5 }}>{cloudMsg}</div>}
            </div>
          )}
        </div>
      </div>
    )}

    </MobileContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
