<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0A0C0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="RamanFX" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
    /* Opening animation: the demand base sweeps in, the candle rises, the R draws, the leg drops, the kick fires. */
    #splash{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:#0A0C0F;transition:opacity .38s ease,visibility .38s}
    #splash.out{opacity:0;visibility:hidden}
    html.no-splash #splash{display:none}
    #splash svg{width:118px;height:auto;overflow:visible}
    #splash svg *{transform-box:fill-box}
    #splash .m-base{transform-origin:left center;transform:scaleX(0);animation:spx .5s .05s cubic-bezier(.2,.8,.2,1) forwards}
    #splash .m-body{transform-origin:center bottom;transform:scaleY(0);animation:spy .5s .22s cubic-bezier(.2,.9,.25,1.12) forwards}
    #splash .m-wick{opacity:0;animation:spf .3s .55s ease forwards}
    #splash .m-bowl{stroke-dasharray:1;stroke-dashoffset:1;animation:spd .5s .5s cubic-bezier(.6,0,.2,1) forwards}
    #splash .m-leg{opacity:0;transform:translate(-8%,-14%);animation:spl .32s .86s cubic-bezier(.5,0,.3,1) forwards}
    #splash .m-kick{transform-origin:left bottom;transform:scale(0);animation:spk .45s 1.1s cubic-bezier(.2,.9,.25,1.35) forwards}
    #splash .sp-word{font:600 21px/1 Geist,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.01em;color:#E8ECF1;opacity:0;transform:translateY(6px);animation:spw .45s 1.25s ease forwards}
    #splash .sp-word b{font-weight:600;color:#5B8CFF}
    @keyframes spx{to{transform:scaleX(1)}}@keyframes spy{to{transform:scaleY(1)}}@keyframes spf{to{opacity:1}}@keyframes spd{to{stroke-dashoffset:0}}
    @keyframes spl{to{opacity:1;transform:none}}@keyframes spk{to{transform:scale(1)}}@keyframes spw{to{opacity:1;transform:none}}
    @media (prefers-reduced-motion:reduce){#splash *{animation:none!important;opacity:1!important;transform:none!important;stroke-dashoffset:0!important}}
  </style>
  <title>RamanFX — Trading Journal</title>
  <script>try{var t=JSON.parse(localStorage.getItem('ledger_theme'));document.documentElement.dataset.theme=t==='light'?'light':'dark'}catch(e){}try{if(sessionStorage.getItem('rfx_splashed'))document.documentElement.classList.add('no-splash');sessionStorage.setItem('rfx_splashed','1')}catch(e){}</script>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <svg viewBox="5 2 93 89" xmlns="http://www.w3.org/2000/svg">
    <rect class="m-wick" x="16.5" y="5" width="6" height="12" rx="1.2" fill="#5B8CFF"/>
    <rect class="m-body" x="11" y="15" width="17" height="50" rx="2.5" fill="#5B8CFF"/>
    <rect class="m-wick" x="16.5" y="63" width="6" height="18" rx="1.2" fill="#5B8CFF"/>
    <path class="m-base" d="M8 80H59.49L65.76 88H8Z" fill="#5B8CFF"/>
    <path class="m-bowl" d="M33 21.5H50A13 13 0 0 1 50 47.5H33" fill="none" stroke="#5B8CFF" stroke-width="11" pathLength="1"/>
    <path class="m-leg" d="M34.01 47.5L64.75 86.74L64.25 68.26L47.99 47.5Z" fill="#5B8CFF"/>
    <path class="m-kick" d="M64.75 86.74L94.51 44.15L85.49 37.85L64.25 68.26Z" fill="#3DDC97"/>
    </svg>
    <div class="sp-word">Raman<b>FX</b></div>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
