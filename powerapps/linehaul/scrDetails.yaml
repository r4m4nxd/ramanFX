                  - detModalCancel:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =clrLine
                        BorderThickness: =1
                        Color: =clrInk
                        DisabledBorderColor: =clrLine
                        DisabledColor: =clrInk3
                        DisabledFill: =clrSoft
                        Fill: =clrPanel
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =38
                        HoverBorderColor: =clrInk3
                        HoverColor: =clrInk
                        HoverFill: =clrPanel
                        OnSelect: =Set(varConfirmEdit, false)
                        PressedBorderColor: =clrInk3
                        PressedColor: =clrInk
                        PressedFill: =clrLine
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Size: =10.5
                        Text: ="Go back"
                        Width: =120
                        X: =Parent.Width - 304
                        Y: =Parent.Height - 58
                  - detModalOk:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =clrBlue
                        BorderThickness: =1
                        Color: =clrWhite
                        DisabledBorderColor: =clrLine
                        DisabledColor: =clrInk3
                        DisabledFill: =clrSoft
                        Fill: =clrBlue
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Semibold
                        Height: =38
                        HoverBorderColor: =clrBlueHover
                        HoverColor: =clrWhite
                        HoverFill: =clrBlue
                        OnSelect: |-
                          =Set(varSavingEdit, true);
                          With(
                              {
                                  r: Patch(
                                      LinehaulRates,
                                      LookUp(LinehaulRates, ID = varRate.ID),
                                      {
                                          Active: detTglEditActive.Value,
                                          EffectiveDate: detDteEditEff.SelectedDate,
                                          ExpiryDate: detDteEditExp.SelectedDate,
                                          Comments: detTxtEditNotes.Text
                                      }
                                  )
                              },
                              If(
                                  IsError(r) || IsBlank(r.ID),
                                  Notify("Changes weren't saved. Check your connection and try again.", NotificationType.Error),
                                  If(
                                      r.Active,
                                      ForAll(
                                          Filter(
                                              Filter(
                                                  LinehaulRates,
                                                  Title = r.Title && Destination = r.Destination && Carrier = r.Carrier &&
                                                  Mode = r.Mode && Equipment = r.Equipment && Active = true
                                              ),
                                              ID <> r.ID
                                          ) As old,
                                          Patch(LinehaulRates, old, {Active: false})
                                      )
                                  );
                                  Set(
                                      varRate,
                                      Patch(
                                          varRate,
                                          {
                                              Active: r.Active,
                                              EffectiveDate: r.EffectiveDate,
                                              ExpiryDate: r.ExpiryDate,
                                              Comments: r.Comments
                                          }
                                      )
                                  );
                                  ClearCollect(
                                      colLaneRates,
                                      Sort(
                                          AddColumns(Filter(LinehaulRates, Title = varRate.Title && Destination = varRate.Destination && Carrier = varRate.Carrier && Mode = varRate.Mode && Equipment = varRate.Equipment), LH, 0, NoFSC, false),
                                          Timestamp,
                                          SortOrder.Descending
                                      )
                                  );
                                  Set(varEditRate, false);
                                  Notify("Changes saved.", NotificationType.Success)
                              )
                          );
                          Set(varConfirmEdit, false);
                          Set(varSavingEdit, false)
                        PressedBorderColor: =clrInk
                        PressedColor: =clrWhite
                        PressedFill: =clrInk
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Size: =10.5
                        Text: ="Save changes"
                        Width: =152
                        X: =Parent.Width - 172
                        Y: =Parent.Height - 58
