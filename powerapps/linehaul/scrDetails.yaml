Screens:
  scrDetails:
    Properties:
      Fill: =clrPage
      OnVisible: |-
        =Set(varEditRate, false); Set(varConfirmEdit, false); Set(varSavingEdit, false);
        ClearCollect(
            colLaneRates,
            Sort(
                AddColumns(Filter(LinehaulRates, Title = varRate.Title && Destination = varRate.Destination && Carrier = varRate.Carrier && Mode = varRate.Mode && Equipment = varRate.Equipment), LH, 0, NoFSC, false),
                Timestamp,
                SortOrder.Descending
