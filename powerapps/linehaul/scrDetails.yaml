                                                            "—",
                                                            With(
                                                                {b: Coalesce(varRate.Base, 0), fsc: FscPct(varRate.Fuel, varRate.F_Adj, varRate.F_Discount, detTglFuel.Value)},
                                                                With(
                                                                    {x: b * (1 + fsc / 100)},
                                                                    With(
                                                                        {a: If(varRate.AdjType = "%", x * Coalesce(varRate.Adj, 0) / 100, Coalesce(varRate.Adj, 0))},
                                                                        With(
                                                                            {d: If(varRate.DiscountType = "%", (x + a) * Coalesce(varRate.Discount, 0) / 100, Coalesce(varRate.Discount, 0))},
                                                                            Text(b, "$#,##0.00") & Char(10) &
                                                                            "+ " & Text(x - b, "$#,##0.00") & Char(10) &
                                                                            "+ " & Text(a, "$#,##0.00") & Char(10) &
                                                                            "− " & Text(d, "$#,##0.00") & Char(10) &
                                                                            Text(x + a - d, "$#,##0.00")
                                                                        )
                                                                    )
                                                                )
                                                            )
