                                                      Text: |-
                                                        =With(
                                                            {f: varRate.Fuel, fa: Coalesce(varRate.F_Adj, 0), fd: Coalesce(varRate.F_Discount, 0)},
                                                            "Base" & Char(10) &
                                                            If(
                                                                IsBlank(f), "Fuel",
                                                                f = "ALL-IN", "Fuel · all-in rate",
                                                                FuelMissing(f), "Fuel · " & f & " has no FSC in the library",
                                                                !(detTglFuel.Value), "Fuel · excluded",
                                                                "Fuel · " & f & " " & Text(LookUp(nfFuel, Title = f).FSC, "0.00") & "%" &
                                                                If(fa > 0, " + " & fa, "") & If(fd > 0, " − " & fd, "") &
                                                                " = " & Text(FscPct(f, fa, fd, true), "0.00") & "%"
                                                            ) & Char(10) &
                                                            "Add-on" & Char(10) &
                                                            "Discount" & Char(10) &
                                                            "LH cost"
                                                        )
