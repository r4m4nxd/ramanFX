                  IsMatch(entTxtDisc.Text, "^(\d+\.?\d*|\.\d+)?$") &&
                  IsMatch(entTxtFAdj.Text, "^(\d+\.?\d*|\.\d+)?$") &&
                  IsMatch(entTxtFDisc.Text, "^(\d+\.?\d*|\.\d+)?$"),
