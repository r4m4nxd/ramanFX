Screens:
  scrDetails:
    Properties:
      Fill: =clrPage
      OnVisible: |-
        =Set(varEditRate, false); Set(varConfirmEdit, false); Set(varSavingEdit, false); Set(varDetNoFuel, false); Reset(detTglFuel);
        ClearCollect(
            colLaneRates,
            Sort(
                AddColumns(Filter(LinehaulRates, Title = varRate.Title && Destination = varRate.Destination && Carrier = varRate.Carrier && Mode = varRate.Mode && Equipment = varRate.Equipment), IsOn, Upper(Trim(Active)) in ["YES", "TRUE"], LH, 0, NoFSC, false,
                           Expired, ExpiryDate < Today()),
                Timestamp,
                SortOrder.Descending
            )
        )
    Children:
      - detRoot:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =clrPage
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Horizontal
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Width: =Parent.Width
          Children:
            - detRail:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =clrRail
                  FillPortions: =0
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =8
                  LayoutMinHeight: =0
                  LayoutMinWidth: =96
                  PaddingBottom: =14
                  PaddingLeft: =5
                  PaddingRight: =5
                  PaddingTop: =14
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  Width: =96
                Children:
                  - detLogo:
                      Control: Image@2.2.3
                      Properties:
                        Height: =48
                        Image: ='cff logo'
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =48
                  - detRailGap:
                      Control: Rectangle@2.3.0
                      Properties:
                        Fill: =clrClear
                        Height: =10
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        Width: =10
                  - detNavNew:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =clrClear
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =88
                      Children:
                        - detNavNewIcon:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Color: =clrRailInk
                              Height: =26
                              HoverColor: =clrBlue
                              Icon: =Icon.Edit
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrEntry, ScreenTransition.None)
                              PressedColor: =clrBlue
                              Tooltip: ="New rate"
                              Width: =26
                        - detNavNewText:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =clrRailInk
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrEntry, ScreenTransition.None)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =8.5
                              Text: ="New rate"
                              Width: =88
                  - detNavRecent:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =clrRailOn
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =88
                      Children:
                        - detNavRecentIcon:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Color: =clrRailOnInk
                              Height: =26
                              HoverColor: =clrRailOnInk
                              Icon: =Icon.DetailList
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrRecent, ScreenTransition.None)
                              PressedColor: =clrRailOnInk
                              Tooltip: ="Recent"
                              Width: =26
                        - detNavRecentText:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =clrRailOnInk
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrRecent, ScreenTransition.None)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =8.5
                              Text: ="Recent"
                              Width: =88
                  - detNavFuel:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =clrClear
                        FillPortions: =0
                        Height: =64
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =4
                        LayoutJustifyContent: =LayoutJustifyContent.Center
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        RadiusBottomLeft: =6
                        RadiusBottomRight: =6
                        RadiusTopLeft: =6
                        RadiusTopRight: =6
                        Width: =88
                      Children:
                        - detNavFuelIcon:
                            Control: Classic/Icon@2.5.0
                            Properties:
                              Color: =clrRailInk
                              Height: =26
                              HoverColor: =clrBlue
                              Icon: =Icon.Money
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrFuel, ScreenTransition.None)
                              PressedColor: =clrBlue
                              Tooltip: ="Fuel library"
                              Width: =26
                        - detNavFuelText:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Center
                              Color: =clrRailInk
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =18
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrFuel, ScreenTransition.None)
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =8.5
                              Text: ="Fuel library"
                              Width: =88
            - detRailEdge:
                Control: Rectangle@2.3.0
                Properties:
                  AlignInContainer: =AlignInContainer.Stretch
                  Fill: =clrLine
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  Width: =1
            - detMain:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =clrPage
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutMinHeight: =0
                  LayoutMinWidth: =300
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                Children:
                  - detHeader:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        Fill: =clrPanel
                        FillPortions: =0
                        Height: =60
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        PaddingBottom: =2
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =2
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - detHdrTitle:
                            Control: Label@2.5.1
                            Properties:
                              Color: =clrInk
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =16
                              Text: ="Line-Haul Form"
                              Width: =210
                        - detHdrDiv:
                            Control: Rectangle@2.3.0
                            Properties:
                              Fill: =clrLine
                              Height: =24
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              Width: =1
                        - detHdrStep:
                            Control: Label@2.5.1
                            Properties:
                              Color: =clrInk3
                              FillPortions: =1
                              Font: =Font.'Segoe UI'
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =40
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =11
                              Text: ="Rate details"
                              Visible: =Parent.Width > 700
                        - detHdrUser:
                            Control: Label@2.5.1
                            Properties:
                              Align: =Align.Right
                              Color: =clrInk2
                              Font: =Font.'Segoe UI'
                              FontWeight: =FontWeight.Semibold
                              Height: =36
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =10
                              Text: =User().FullName & " · " & Text(Today(), "mmm d, yyyy")
                              Visible: =Parent.Width > 1000
                              Width: =240
                        - detHdrBtnEdit:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =clrBlue
                              BorderThickness: =1
                              Color: =clrWhite
                              DisabledBorderColor: =clrLine
                              DisabledColor: =clrInk3
                              DisabledFill: =clrSoft
                              Fill: =clrBlue
                              Font: =Font.'Segoe UI'
                              Height: =38
                              HoverBorderColor: =clrBlueHover
                              HoverColor: =clrWhite
                              HoverFill: =clrBlue
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Set(varEditRate, true); Reset(detTglEditActive); Reset(detDteEditEff); Reset(detDteEditExp); Reset(detTxtEditNotes)
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              PressedBorderColor: =clrInk
                              PressedColor: =clrWhite
                              PressedFill: =clrInk
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Size: =11
                              Text: ="Edit status & dates"
                              Visible: =!varEditRate
                              Width: =200
                        - detHdrBtnBack:
                            Control: Classic/Button@2.2.0
                            Properties:
                              BorderColor: =clrLine
                              BorderThickness: =1
                              Color: =clrInk
                              DisabledBorderColor: =clrLine
                              DisabledColor: =clrInk3
                              DisabledFill: =clrSoft
                              Fill: =clrPanel
                              Font: =Font.'Segoe UI'
                              Height: =38
                              HoverBorderColor: =clrInk3
                              HoverColor: =clrInk
                              HoverFill: =clrPanel
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              OnSelect: =Navigate(scrRecent, ScreenTransition.None)
                              PaddingBottom: =0
                              PaddingLeft: =12
                              PaddingRight: =12
                              PaddingTop: =0
                              PressedBorderColor: =clrInk3
                              PressedColor: =clrInk
                              PressedFill: =clrLine
                              RadiusBottomLeft: =5
                              RadiusBottomRight: =5
                              RadiusTopLeft: =5
                              RadiusTopRight: =5
                              Size: =11
                              Text: ="← Back to recent"
                              Width: =176
                  - detBody:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        Fill: =clrClear
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        LayoutMinWidth: =40
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        PaddingTop: =16
                        RadiusBottomLeft: =0
                        RadiusBottomRight: =0
                        RadiusTopLeft: =0
                        RadiusTopRight: =0
                      Children:
                        - detHero:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =clrClear
                              FillPortions: =0
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              PaddingBottom: =2
                              PaddingLeft: =2
                              PaddingRight: =2
                              PaddingTop: =2
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - detLblLane:
                                  Control: Label@2.5.1
                                  Properties:
                                    Color: =clrInk
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =44
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =20
                                    Text: =varRate.Title & "  →  " & varRate.Destination
                              - detChipCarrier:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =clrLine
                                    BorderThickness: =1
                                    Color: =clrInk
                                    Fill: =clrPanel
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =26
                                    HoverBorderColor: =clrLine
                                    HoverColor: =clrInk
                                    HoverFill: =clrPanel
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =0
                                    PressedBorderColor: =clrLine
                                    PressedColor: =clrInk
                                    PressedFill: =clrPanel
                                    RadiusBottomLeft: =11
                                    RadiusBottomRight: =11
                                    RadiusTopLeft: =11
                                    RadiusTopRight: =11
                                    Size: =8.5
                                    Text: =varRate.Carrier
                                    Width: =140
                              - detChipMode:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =clrLine
                                    BorderThickness: =1
                                    Color: =clrInk
                                    Fill: =clrPanel
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =26
                                    HoverBorderColor: =clrLine
                                    HoverColor: =clrInk
                                    HoverFill: =clrPanel
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =0
                                    PressedBorderColor: =clrLine
                                    PressedColor: =clrInk
                                    PressedFill: =clrPanel
                                    RadiusBottomLeft: =11
                                    RadiusBottomRight: =11
                                    RadiusTopLeft: =11
                                    RadiusTopRight: =11
                                    Size: =8.5
                                    Text: =varRate.Mode
                                    Width: =100
                              - detChipEquip:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =clrLine
                                    BorderThickness: =1
                                    Color: =clrInk
                                    Fill: =clrPanel
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =26
                                    HoverBorderColor: =clrLine
                                    HoverColor: =clrInk
                                    HoverFill: =clrPanel
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =0
                                    PressedBorderColor: =clrLine
                                    PressedColor: =clrInk
                                    PressedFill: =clrPanel
                                    RadiusBottomLeft: =11
                                    RadiusBottomRight: =11
                                    RadiusTopLeft: =11
                                    RadiusTopRight: =11
                                    Size: =8.5
                                    Text: =varRate.Equipment
                                    Width: =170
                              - detStatus:
                                  Control: Classic/Button@2.2.0
                                  Properties:
                                    BorderColor: =clrClear
                                    BorderThickness: =0
                                    Color: =If(varRate.ExpiryDate < Today(), clrRed, varRate.IsOn, clrGreenInk, clrInk3)
                                    Fill: =If(varRate.ExpiryDate < Today(), clrRedBg, varRate.IsOn, clrGreenBg, clrSoft)
                                    Font: =Font.'Segoe UI'
                                    FontWeight: =FontWeight.Bold
                                    Height: =26
                                    HoverBorderColor: =clrClear
                                    HoverColor: =If(varRate.ExpiryDate < Today(), clrRed, varRate.IsOn, clrGreenInk, clrInk3)
                                    HoverFill: =If(varRate.ExpiryDate < Today(), clrRedBg, varRate.IsOn, clrGreenBg, clrSoft)
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =10
                                    PaddingRight: =10
                                    PaddingTop: =0
                                    PressedBorderColor: =clrClear
                                    PressedColor: =If(varRate.ExpiryDate < Today(), clrRed, varRate.IsOn, clrGreenInk, clrInk3)
                                    PressedFill: =If(varRate.ExpiryDate < Today(), clrRedBg, varRate.IsOn, clrGreenBg, clrSoft)
                                    RadiusBottomLeft: =11
                                    RadiusBottomRight: =11
                                    RadiusTopLeft: =11
                                    RadiusTopRight: =11
                                    Size: =8.5
                                    Text: =If(varRate.ExpiryDate < Today(), "Expired", varRate.IsOn, "Active", "Inactive")
                                    Width: =90
                              - detLblSubmitted:
                                  Control: Label@2.5.1
                                  Properties:
                                    Align: =Align.Right
                                    Color: =clrInk3
                                    FillPortions: =1
                                    Font: =Font.'Segoe UI'
                                    Height: =44
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =10
                                    Text: ="Submitted by " & varRate.SubmittedBy & " · " & Text(varRate.Timestamp, "mmm d, yyyy h:mm AM/PM")
                        - detCols:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Fill: =clrClear
                              FillPortions: =0
                              Height: |-
                                =If(
                                    detBody.Width < 900,
                                    detSecCost.Height + 4 + 16 + (If(varEditRate, detSecEdit.Height + 16, 0) + detSecLane.Height + 16 + detSecHistory.Height) + 4,
                                    Max(detSecCost.Height, (If(varEditRate, detSecEdit.Height + 16, 0) + detSecLane.Height + 16 + detSecHistory.Height)) + 4
                                )
                              LayoutDirection: =If(detBody.Width < 900, LayoutDirection.Vertical, LayoutDirection.Horizontal)
                              LayoutGap: =16
                              LayoutMinHeight: =0
                              LayoutMinWidth: =0
                              RadiusBottomLeft: =0
                              RadiusBottomRight: =0
                              RadiusTopLeft: =0
                              RadiusTopRight: =0
                            Children:
                              - detColLeft:
                                  Control: GroupContainer@1.5.0
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Fill: =clrClear
                                    FillPortions: =If(detBody.Width < 900, 0, 1.15)
                                    Height: =(detSecCost.Height) + 4
                                    LayoutDirection: =LayoutDirection.Vertical
                                    LayoutGap: =16
                                    LayoutMinHeight: =0
                                    LayoutMinWidth: =320
                                    PaddingBottom: =2
                                    PaddingLeft: =2
                                    PaddingRight: =2
                                    PaddingTop: =2
                                    RadiusBottomLeft: =0
                                    RadiusBottomRight: =0
                                    RadiusTopLeft: =0
                                    RadiusTopRight: =0
                                  Children:
                                    - detSecCost:
                                        Control: GroupContainer@1.5.0
                                        Variant: AutoLayout
                                        Properties:
                                          BorderColor: =clrLine
                                          BorderThickness: =1
                                          DropShadow: =DropShadow.None
                                          Fill: =clrPanel
                                          FillPortions: =0
                                          Height: =If(detLblWarn.Visible, 608, 540)
                                          LayoutDirection: =LayoutDirection.Vertical
                                          LayoutMinHeight: =0
                                          LayoutMinWidth: =0
                                          RadiusBottomLeft: =6
                                          RadiusBottomRight: =6
                                          RadiusTopLeft: =6
                                          RadiusTopRight: =6
                                        Children:
                                          - detSecCostHead:
                                              Control: GroupContainer@1.5.0
                                              Variant: AutoLayout
                                              Properties:
                                                DropShadow: =DropShadow.None
                                                Fill: =clrClear
                                                FillPortions: =0
                                                Height: =48
                                                LayoutAlignItems: =LayoutAlignItems.Center
                                                LayoutDirection: =LayoutDirection.Horizontal
                                                LayoutGap: =12
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                                PaddingLeft: =16
                                                PaddingRight: =16
                                                RadiusBottomLeft: =0
                                                RadiusBottomRight: =0
                                                RadiusTopLeft: =0
                                                RadiusTopRight: =0
                                              Children:
                                                - detSecCostTitle:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Color: =clrInk
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =FontWeight.Bold
                                                      Height: =30
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Text: ="Cost"
                                                      Width: =80
                                                - detSecCostHint:
                                                    Control: Label@2.5.1
                                                    Properties:
                                                      Color: =clrInk3
                                                      FillPortions: =1
                                                      Font: =Font.'Segoe UI'
                                                      Height: =30
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =40
                                                      PaddingBottom: =0
                                                      PaddingLeft: =0
                                                      PaddingRight: =0
                                                      PaddingTop: =0
                                                      Size: =10
                                                      Text: ="Calculated with today's FSC"
                                                - detTglFuel:
                                                    Control: Classic/Toggle@2.1.0
                                                    Properties:
                                                      Color: =clrInk
                                                      Default: =!varDetNoFuel
                                                      FalseFill: =RGBA(190, 200, 210, 1)
                                                      FalseHoverFill: =clrInk3
                                                      FalseText: ="Include fuel"
                                                      Font: =Font.'Segoe UI'
                                                      FontWeight: =FontWeight.Semibold
                                                      HandleFill: =clrWhite
                                                      Height: =32
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      Size: =10
                                                      TrueFill: =clrBlue
                                                      TrueHoverFill: =clrBlueHover
                                                      TrueText: ="Include fuel"
                                                      Visible: =false
                                                      Width: =10
                                                - detChipFuel:
                                                    Control: Classic/Button@2.2.0
                                                    Properties:
                                                      BorderColor: =If(!varDetNoFuel, clrBlue, clrLine)
                                                      BorderThickness: =1
                                                      Color: =If(!varDetNoFuel, clrWhite, clrInk2)
                                                      DisabledBorderColor: =clrLine
                                                      DisabledColor: =clrInk3
                                                      DisabledFill: =clrSoft
                                                      Fill: =If(!varDetNoFuel, clrBlue, clrPanel)
                                                      Font: =Font.'Segoe UI'
                                                      Height: =32
                                                      HoverBorderColor: =clrInk3
                                                      HoverColor: =If(!varDetNoFuel, clrWhite, clrInk)
                                                      HoverFill: =If(!varDetNoFuel, clrBlue, clrPanel)
                                                      LayoutMinHeight: =0
                                                      LayoutMinWidth: =0
                                                      OnSelect: =Set(varDetNoFuel, !varDetNoFuel); Reset(detTglFuel)
                                                      PaddingBottom: =0
                                                      PaddingLeft: =12
                                                      PaddingRight: =12
                                                      PaddingTop: =0
                                                      PressedBorderColor: =clrInk3
                                                      PressedColor: =clrWhite
                                                      PressedFill: =clrBlue
                                                      RadiusBottomLeft: =16
                                                      RadiusBottomRight: =16
                                                      RadiusTopLeft: =16
                                                      RadiusTopRight: =16
                                                      Size: =10
                                                      Text: ="Include fuel"
                                                      Width: =126
                                          - detSecCostSep:
                                              Control: Rectangle@2.3.0
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Stretch
                                                Fill: =clrLine
                                                Height: =1
                                                LayoutMinHeight: =0
                                                LayoutMinWidth: =0
                                          - detSecCostBody:
                                              Control: GroupContainer@1.5.0
