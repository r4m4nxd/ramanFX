                                                            OnSelect: =Select(Parent)
                                                            PaddingBottom: =0
                                                            PaddingLeft: =10
                                                            PaddingRight: =10
                                                            PaddingTop: =0
                                                            Size: =8.5
                                                            Text: =Text(ThisItem.EffectiveDate, "mmm d, yyyy")
                                                            Width: =Parent.TemplateWidth * 0.17
                                                            X: =Parent.TemplateWidth * 0.47
                                                      - detLaneRowExp:
                                                          Control: Label@2.5.1
                                                          Properties:
                                                            Color: |-
                                                              =With(
                                                                  {d: DateDiff(Today(), ThisItem.ExpiryDate, TimeUnit.Days)},
                                                                  If(
                                                                      d <= 0, clrRed,
                                                                      d >= 90, clrInk,
                                                                      d > 30, With({k: (90 - d) / 60}, RGBA(72 + 124 * k, 88 + 32 * k, 106 - 106 * k, 1)),
                                                                      With({k: (30 - d) / 30}, RGBA(196, 120 - 98 * k, 28 * k, 1))
                                                                  )
                                                              )
                                                            Font: =Font.'Segoe UI'
                                                            FontWeight: =If(ThisItem.ID = varRate.ID, FontWeight.Bold, FontWeight.Normal)
                                                            Height: =44
                                                            OnSelect: =Select(Parent)
                                                            PaddingBottom: =0
                                                            PaddingLeft: =10
                                                            PaddingRight: =10
                                                            PaddingTop: =0
                                                            Size: =8.5
                                                            Text: |-
                                                              =With(
                                                                  {d: DateDiff(Today(), ThisItem.ExpiryDate, TimeUnit.Days)},
                                                                  If(
                                                                      d < 0, "Expired",
                                                                      d = 0, "Today",
                                                                      d = 1, "1 day",
                                                                      d < 14, d & " days",
                                                                      d < 60, RoundDown(d / 7, 0) & " weeks",
                                                                      RoundDown(d / 30, 0) & " months"
                                                                  )
                                                              )
                                                            Tooltip: ="Valid to " & Text(ThisItem.ExpiryDate, "mmm d, yyyy")
                                                            Width: =Parent.TemplateWidth * 0.17
                                                            X: =Parent.TemplateWidth * 0.64
                                                      - detLaneRowAdded:
                                                          Control: Label@2.5.1
                                                          Properties:
                                                            Color: =clrInk
                                                            Font: =Font.'Segoe UI'
                                                            FontWeight: =If(ThisItem.ID = varRate.ID, FontWeight.Bold, FontWeight.Normal)
                                                            Height: =44
                                                            OnSelect: =Select(Parent)
                                                            PaddingBottom: =0
                                                            PaddingLeft: =10
                                                            PaddingRight: =10
                                                            PaddingTop: =0
                                                            Size: =8.5
                                                            Text: =Text(ThisItem.Timestamp, "mmm d, yyyy")
                                                            Width: =Parent.TemplateWidth * 0.19
                                                            X: =Parent.TemplateWidth * 0.81
                                                      - detLaneRowSep:
                                                          Control: Rectangle@2.3.0
                                                          Properties:
                                                            Fill: =clrSoft
                                                            Height: =1
                                                            Width: =Parent.TemplateWidth
                                                            Y: =43
      - detModal:
          Control: GroupContainer@1.5.0
          Variant: ManualLayout
          Properties:
            DropShadow: =DropShadow.None
            Fill: =clrClear
            Height: =Parent.Height
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            RadiusTopLeft: =0
            RadiusTopRight: =0
            Visible: =varConfirmEdit
            Width: =Parent.Width
          Children:
            - detModalShade:
                Control: Rectangle@2.3.0
                Properties:
                  Fill: =RGBA(22, 32, 43, 0.45)
                  Height: =Parent.Height
                  Width: =Parent.Width
            - detModalCard:
                Control: GroupContainer@1.5.0
                Variant: ManualLayout
                Properties:
                  BorderColor: =clrLine
                  BorderThickness: =1
                  DropShadow: =DropShadow.Bold
                  Fill: =clrPanel
                  Height: =300
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  X: =(Parent.Width - 500) / 2
                  Y: =(Parent.Height - 300) / 2
                Children:
                  - detModalTitle:
                      Control: Label@2.5.1
                      Properties:
                        Color: =clrInk
                        Font: =Font.'Segoe UI'
                        FontWeight: =FontWeight.Bold
                        Height: =30
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Text: ="Check before saving"
                        Width: =Parent.Width - 40
                        X: =20
                        Y: =16
                  - detModalMsg:
                      Control: Label@2.5.1
                      Properties:
                        Color: =clrInk2
                        Font: =Font.'Segoe UI'
                        Height: =Parent.Height - 124
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =11
                        Text: =detLblEditWarn.Text
                        VerticalAlign: =VerticalAlign.Top
                        Width: =Parent.Width - 40
                        X: =20
                        Y: =54
                  - detModalCancel:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =clrLine
                        BorderThickness: =1
                        Color: =clrInk
                        DisabledBorderColor: =clrLine
                        DisabledColor: =clrInk3
                        DisabledFill: =clrSoft
                        Fill: =clrPanel
                        Font: =Font.'Segoe UI'
                        Height: =38
                        HoverBorderColor: =clrInk3
                        HoverColor: =clrInk
                        HoverFill: =clrPanel
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: =Set(varConfirmEdit, false)
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =0
                        PressedBorderColor: =clrInk3
                        PressedColor: =clrInk
                        PressedFill: =clrLine
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Size: =11
                        Text: ="Go back"
                        Width: =120
                        X: =Parent.Width - 332
                        Y: =Parent.Height - 58
                  - detModalOk:
                      Control: Classic/Button@2.2.0
                      Properties:
                        BorderColor: =clrBlue
                        BorderThickness: =1
                        Color: =clrWhite
                        DisabledBorderColor: =clrLine
                        DisabledColor: =clrInk3
                        DisabledFill: =clrSoft
                        Fill: =clrBlue
                        Font: =Font.'Segoe UI'
                        Height: =38
                        HoverBorderColor: =clrBlueHover
                        HoverColor: =clrWhite
                        HoverFill: =clrBlue
                        LayoutMinHeight: =0
                        LayoutMinWidth: =0
                        OnSelect: |-
                          =Set(varSavingEdit, true);
                          With(
                              {
                                  r: Patch(
                                      LinehaulRates,
                                      LookUp(LinehaulRates, ID = varRate.ID),
                                      {
                                          Active: If(detTglEditActive.Value, "Yes", "No"),
                                          EffectiveDate: detDteEditEff.SelectedDate,
                                          ExpiryDate: detDteEditExp.SelectedDate,
                                          Comments: detTxtEditNotes.Text
                                      }
                                  )
                              },
                              If(
                                  IsError(r) || IsBlank(r.ID),
                                  Notify("Changes weren't saved. Check your connection and try again.", NotificationType.Error),
                                  If(
                                      Upper(r.Active) = "YES",
                                      ForAll(
                                          Filter(
                                              AddColumns(
                                                  Filter(
                                                      LinehaulRates,
                                                      Title = r.Title && Destination = r.Destination && Carrier = r.Carrier &&
                                                      Mode = r.Mode && Equipment = r.Equipment
                                                  ),
                                                  IsOn, Upper(Trim(Active)) in ["YES", "TRUE"]
                                              ),
                                              IsOn && ID <> r.ID
                                          ) As old,
                                          Patch(LinehaulRates, LookUp(LinehaulRates, ID = old.ID), {Active: "No"})
                                      )
                                  );
                                  Set(
                                      varRate,
                                      Patch(
                                          varRate,
                                          {
                                              Active: r.Active,
                                              IsOn: Upper(r.Active) = "YES",
                                              Expired: r.ExpiryDate < Today(),
                                              EffectiveDate: r.EffectiveDate,
                                              ExpiryDate: r.ExpiryDate,
                                              Comments: r.Comments
                                          }
                                      )
                                  );
                                  ClearCollect(
                                      colLaneRates,
                                      Sort(
                                          AddColumns(Filter(LinehaulRates, Title = varRate.Title && Destination = varRate.Destination && Carrier = varRate.Carrier && Mode = varRate.Mode && Equipment = varRate.Equipment), IsOn, Upper(Trim(Active)) in ["YES", "TRUE"], LH, 0, NoFSC, false,
                                                     Expired, ExpiryDate < Today()),
                                          Timestamp,
                                          SortOrder.Descending
                                      )
                                  );
                                  Set(varEditRate, false);
                                  Notify("Changes saved.", NotificationType.Success)
                              )
                          );
                          Set(varConfirmEdit, false);
                          Set(varSavingEdit, false)
                        PaddingBottom: =0
                        PaddingLeft: =12
                        PaddingRight: =12
                        PaddingTop: =0
                        PressedBorderColor: =clrInk
                        PressedColor: =clrWhite
                        PressedFill: =clrInk
                        RadiusBottomLeft: =5
                        RadiusBottomRight: =5
                        RadiusTopLeft: =5
                        RadiusTopRight: =5
                        Size: =11
                        Text: ="Save changes"
                        Width: =180
                        X: =Parent.Width - 200
                        Y: =Parent.Height - 58
