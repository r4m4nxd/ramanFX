                                                                                        "+ " & Text(x - b, "$#,##0.00") & Char(10) &
                                                                                        "+ " & Text(a, "$#,##0.00") & Char(10) &
                                                                                        "− " & Text(d, "$#,##0.00") & Char(10) &
                                                                                        Text(x + a - d, "$#,##0.00")
